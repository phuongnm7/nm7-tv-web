name: Deploy NM7 TV Web to Cloudflare

on:
  push:
    branches:
      - fix/safari-drm-final-20261005
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Smoke test deployed Cloudflare Worker
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://nm7-tv-web.phuongnm7-iptv.workers.dev"
          curl -fsSL --max-redirs 3 --max-time 30 "$BASE/" -o /tmp/nm7-home.html
          curl -fsSL --max-redirs 3 --max-time 30 "$BASE/assets/nm7-default-background.webp" -o /tmp/nm7-bg.webp
          BG_META="$(file /tmp/nm7-bg.webp)"
          echo "$BG_META"
          echo "$BG_META" | grep -q "3840x2160"
          test "$(sha256sum /tmp/nm7-bg.webp | cut -d' ' -f1)" = "d8af6ac8ba532db465dcb8c44e00b71865e6c9a712c8cc21cd0a2118400bd00d"
          grep -q "NM7 TV 1.0.69" /tmp/nm7-home.html
          curl -fsSL --max-redirs 3 --max-time 30 "$BASE/api/playlist?source=tv&default=android1069" -o /tmp/nm7-tv.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/nm7-tv.json',encoding='utf-8'))
          channels=d.get('channels') or []
          if not channels:
              raise SystemExit('default Android 1.0.69 playlist returned zero channels')
          groups=[]
          seen=set()
          for c in channels:
              g=c.get('group') or 'Khác'
              if g not in seen:
                  seen.add(g); groups.append(g)
          expected=['VTV','VTVcab','Thể Thao','SCTV']
          if groups[:4] != expected:
              raise SystemExit(f'wrong first groups: {groups[:8]}')
          def names(g): return [c.get('name','') for c in channels if (c.get('group') or 'Khác')==g]
          checks={
              'VTV':['VTV1','VTV2','VTV3','VTV4','VTV5','VTV5 Tây Nam Bộ','VTV5 Tây Nguyên','VTV6'],
              'VTVcab':['On BiBi','ON Cine','ON E- Channel','On Golf','ON Info TV','On Kids','On Life','On Movies - You TV'],
              'Thể Thao':['HTV Thể Thao','On Sports 50fps','SCTV15 HD','SCTV17 HD','SCTV22','VTV6 HD'],
              'SCTV':['SCTV Phim Tổng Hợp','SCTV1','SCTV2 - TODAY TV','SCTV3'],
          }
          for g,want in checks.items():
              got=names(g)
              if got[:len(want)] != want:
                  raise SystemExit(f'{g} order mismatch: {got[:len(want)]}')
          ons=[c for c in channels if c.get('name')=='On Sports 50fps']
          if ons:
              candidates=ons[0].get('candidates') or []
              if not candidates:
                  raise SystemExit('On Sports 50fps has no candidates')
              if not any((x.get('type') or '').lower()=='dash' and x.get('drm') for x in candidates):
                  raise SystemExit('On Sports 50fps has no DASH DRM candidate')
          print('CLOUDFLARE_SMOKE_OK channels=',len(channels),'groups=',groups[:8])
          PY

          HTML="$(curl -fsSL --max-redirs 3 --max-time 30 "$BASE/?v=20261005-vtvcab3-final2")"
          python3 - "$HTML" <<'PY'
          import sys
          html=sys.argv[1]
          if 'shaka-player@5.2.12' not in html:
              raise SystemExit('Shaka 5.2.12 marker not found in deployed HTML')
          print('SHAKA_5_2_12_SMOKE_OK')
          PY
          APP="$(curl -fsSL --max-redirs 3 --max-time 30 "$BASE/app.js?v=20261005-ios-drm-final1")"
          python3 - "$APP" <<'PY'
          import sys
          app=sys.argv[1]
          checks={
              "DRM cache schema":"CACHE_SCHEMA='20261005-drm-final-1'",
              "Apple direct DASH request filter":"(!appleDrm||S.proxyAttempt)",
              "Apple DRM ABR lock":"abr:{enabled:appleDrm?false:undefined}",
              "DRM hard recovery":"hardRestartDrm",
              "real stall watchdog":"function armDrmStallWatch(reason)",
              "VTVcab3 HLS preference":"id==='vtvcab3hd'||name.indexOf('vtvcab3')>=0",
              "VTVcab3 candidate sanitizer":"function sanitizeAppleCandidates(c)",
              "VTVcab3 wrong HLS removed":"e3\\.endpoint\\.cdn\\.sctvonline\\.vn\\/hls\\/vtvcab3\\/index\\.m3u8"
          }
          for label,needle in checks.items():
              if needle not in app:
                  raise SystemExit(label+' marker missing: '+needle)
          print('APPLE_DRM_ROOT_FIX_SMOKE_OK')
          PY

          curl -fsSL --max-redirs 3 --max-time 30 "$BASE/api/playlist?source=sport" -o /tmp/nm7-sport.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/nm7-sport.json',encoding='utf-8'))
          channels=d.get('channels') or []
          if not channels:
              raise SystemExit(f"sport playlist returned zero channels: {d.get('error')}")
          print('CLOUDFLARE_SPORT_SMOKE_OK channels=',len(channels),'upstream=',d.get('upstream'))
          PY

          CUSTOM_URL='https://raw.githubusercontent.com/phuongnm7/Iptv-phuongnm7/main/sports-auto.m3u?utm_source=chatgpt.com'
          ENCODED_CUSTOM="$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=""))' "$CUSTOM_URL")"
          curl -fsSL --max-redirs 3 --max-time 30 "$BASE/api/source?u=$ENCODED_CUSTOM" -o /tmp/nm7-custom.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/nm7-custom.json',encoding='utf-8'))
          channels=d.get('channels') or []
          if not channels:
              raise SystemExit(f"custom source proxy returned zero channels: {d.get('error')}")
          print('CLOUDFLARE_CUSTOM_SOURCE_SMOKE_OK channels=',len(channels),'upstream=',d.get('upstream'))
          PY
