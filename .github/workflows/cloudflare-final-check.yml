name: Cloudflare Final TV Web Check

on:
  push:
    branches: ["cloudflare-migration"]
  workflow_dispatch:

jobs:
  final:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Syntax
        run: node --check src/index.js
      - name: Deploy preview
        run: |
          set -euo pipefail
          npx wrangler deploy --temporary 2>&1 | tee /tmp/deploy.log
          grep -o 'https://[^[:space:]]*workers.dev' /tmp/deploy.log | tail -1 > /tmp/live.txt
          test -s /tmp/live.txt
          echo "LIVE_URL=$(cat /tmp/live.txt)"
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium --with-deps
      - name: Final UI and playback test
        run: |
          set -euo pipefail
          node <<'NODE'
          const {chromium}=require('playwright');
          const fs=require('fs');
          const base=fs.readFileSync('/tmp/live.txt','utf8').trim();
          const channels=[];
          const hlsUpstream='https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8';
          const hlsProxy=base+'/__nm7/stream?u='+encodeURIComponent(hlsUpstream);
          for(let g=0;g<12;g++)for(let i=0;i<30;i++)channels.push({id:'e2e-'+g+'-'+i,name:'E2E '+(g+1)+'-'+(i+1),group:'GROUP '+String(g+1).padStart(2,'0'),logo:'',candidates:[{url:hlsProxy,type:'hls',hls:true,dash:false,drm:null,ref:'',ua:'',headers:{}}]});
          const body=JSON.stringify({channels});
          (async()=>{
            const b=await chromium.launch({headless:true,args:['--autoplay-policy=no-user-gesture-required','--disable-gpu']});
            const p=await b.newPage({viewport:{width:1920,height:1080}});
            const errors=[];
            p.on('pageerror',e=>errors.push(e.message));
            await p.route('**/playlist.json*',r=>r.fulfill({status:200,contentType:'application/json',body}));
            await p.route('**/api/playlist*',r=>r.fulfill({status:200,contentType:'application/json',body}));
            const mediaResponses=[];
            p.on('response',r=>{if(/__nm7\/stream|\.m3u8|\.ts/.test(r.url()))mediaResponses.push({status:r.status(),url:r.url()});});
            p.on('requestfailed',r=>{if(/__nm7\/stream|\.m3u8|\.ts/.test(r.url()))console.log('REQUEST_FAILED='+r.url()+' '+(r.failure()?.errorText||''));});
            await p.goto(base+'/?debug=1',{waitUntil:'domcontentloaded',timeout:30000});
            await p.waitForSelector('.card',{timeout:15000});
            const initial=await p.evaluate(()=>({tag:document.activeElement?.tagName,row:document.activeElement?.dataset?.row,col:document.activeElement?.dataset?.col,count:document.querySelectorAll('.card').length}));
            if(initial.tag!=='BUTTON'||initial.row!=='0'||initial.col!=='0')throw new Error('initial focus '+JSON.stringify(initial));
            for(let i=0;i<25;i++)await p.keyboard.press('ArrowRight');
            const right=await p.evaluate(()=>({row:Number(document.activeElement?.dataset?.row),col:Number(document.activeElement?.dataset?.col),scrollLeft:document.activeElement?.closest('.cards')?.scrollLeft||0}));
            if(right.row!==0||right.col<20||right.scrollLeft<=0)throw new Error('horizontal navigation '+JSON.stringify(right));
            for(let i=0;i<10;i++){await p.keyboard.press('ArrowDown');await p.waitForTimeout(30);}
            const down=await p.evaluate(()=>({row:Number(document.activeElement?.dataset?.row),homeScroll:document.querySelector('#home')?.scrollTop||0}));
            if(down.row<=0||down.homeScroll<=0)throw new Error('vertical navigation '+JSON.stringify(down));
            await p.goto(base+'/?debug=1',{waitUntil:'domcontentloaded',timeout:30000});
            await p.waitForSelector('.card',{timeout:15000});
            await p.locator('.card').first().click();
            await p.waitForFunction(()=>{const v=document.querySelector('#video');return !!v&&v.readyState>=2&&v.currentTime>0},{timeout:20000});
            const media=await p.evaluate(()=>{const v=document.querySelector('#video');return {time:v.currentTime,ready:v.readyState,paused:v.paused,error:v.error?{code:v.error.code,message:v.error.message}:null,status:document.querySelector('#status')?.textContent||'',debug:document.querySelector('#debug')?.textContent||''}});
            console.log('INITIAL='+JSON.stringify(initial));
            console.log('RIGHT='+JSON.stringify(right));
            console.log('DOWN='+JSON.stringify(down));
            console.log('PLAYBACK='+JSON.stringify(media));
            console.log('MEDIA_RESPONSES='+JSON.stringify(mediaResponses.slice(0,30)));
            if(media.time<=0||media.ready<2||media.paused)throw new Error('HLS playback failed '+JSON.stringify(media));
            if(errors.length)throw new Error('page errors '+JSON.stringify(errors));
            await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
