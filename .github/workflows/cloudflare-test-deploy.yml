name: Deploy isolated NM7 TV Web test Worker

on:
  push:
    branches:
      - fix/sports-hls-startup-proxy-20261010
  workflow_dispatch:

concurrency:
  group: nm7-tv-web-isolated-test
  cancel-in-progress: true

jobs:
  deploy-test-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v6

      - name: Guard against production deployment
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx 'name = "nm7-tv-web-test"' wrangler.toml
          if grep -Fx 'name = "nm7-tv-web"' wrangler.toml; then
            echo "Refusing to deploy: wrangler.toml targets production."
            exit 1
          fi
          echo "ISOLATED_WORKER_NAME_GUARD_OK"

      - name: Validate JavaScript and Stalker regression
        shell: bash
        run: |
          set -euo pipefail
          node --check worker.js
          node --check web-tv/app.js
          node --check web-tv/app-safari-policy.js
          node scripts/test-playback-startup-fallback.js
          node scripts/test-worker-hls-segments.js

      - name: Deploy isolated Cloudflare Worker only
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Smoke-test isolated test URL
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://nm7-tv-web-test.phuongnm7-iptv.workers.dev"

          # A newly created workers.dev endpoint can briefly return 404 while propagating.
          ready=0
          for attempt in $(seq 1 12); do
            status="$(curl -sS --max-redirs 3 --max-time 15 -o /tmp/nm7-test-home.html -w "%{http_code}" "$BASE/" || true)"
            if [[ "$status" == "200" ]] && grep -q "NM7 TV 1.0.69" /tmp/nm7-test-home.html; then
              ready=1
              break
            fi
            echo "Waiting for test Worker propagation: attempt=$attempt HTTP=$status"
            sleep 2
          done
          if [[ "$ready" != "1" ]]; then
            echo "Test Worker root never returned the expected app HTML."
            head -c 500 /tmp/nm7-test-home.html || true
            exit 1
          fi
          echo "TEST_WORKER_HOME_OK"

          probe_status="$(curl -sS --retry 5 --retry-delay 2 --retry-all-errors --max-redirs 3 --max-time 25 --get \
            --data-urlencode 'u=https://mag.example.test/play/live.php?mac=00:11:22:33:44:55&stream=123&extension=ts&play_token=MASKED' \
            -o /tmp/nm7-test-probe.json -w "%{http_code}" "$BASE/api/probe" || true)"
          if [[ "$probe_status" != "200" ]]; then
            echo "Probe endpoint returned HTTP=$probe_status"
            cat /tmp/nm7-test-probe.json || true
            exit 1
          fi
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/nm7-test-probe.json', encoding='utf-8'))
          if d.get('type') != 'mpegts':
              raise SystemExit('Stalker query extension was not detected as MPEG-TS: '+str(d))
          print('STALKER_QUERY_EXTENSION_PROBE_OK', d.get('type'))
          PY

          playlist_status="$(curl -sS --retry 5 --retry-delay 2 --retry-all-errors --max-redirs 3 --max-time 30 \
            -o /tmp/nm7-test-playlist.json -w "%{http_code}" "$BASE/api/playlist?source=tv&default=2" || true)"
          if [[ "$playlist_status" != "200" ]]; then
            echo "Playlist endpoint returned HTTP=$playlist_status"
            cat /tmp/nm7-test-playlist.json || true
            exit 1
          fi
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/nm7-test-playlist.json', encoding='utf-8'))
          channels=d.get('channels') or []
          if not channels:
              raise SystemExit('Test Worker playlist has no channels: '+str(d.get('error')))
          print('TEST_WORKER_PLAYLIST_OK channels=', len(channels), 'upstream=', d.get('upstream'))
          PY
