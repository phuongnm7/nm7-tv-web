name: Cloudflare visual asset probe
on:
  push:
    branches: ["feat/tvdrm-player-integration-20261004"]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe live background and page
        run: |
          set -euo pipefail
          curl -fsSL --max-time 30 "https://nm7-tv-web.phuongnm7-iptv.workers.dev/" -o /tmp/home.html
          curl -fsSL --max-time 30 "https://nm7-tv-web.phuongnm7-iptv.workers.dev/assets/nm7-default-background.webp" -o /tmp/bg.webp
          echo "PAGE_SHA256=$(sha256sum /tmp/home.html | cut -d' ' -f1)"
          echo "BG_SHA256=$(sha256sum /tmp/bg.webp | cut -d' ' -f1)"
          file /tmp/bg.webp
          grep -o 'nm7-default-background[^"]*' /tmp/home.html | head -5 || true
