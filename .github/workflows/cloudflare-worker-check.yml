name: Cloudflare Worker Build and Preview

on:
  push:
    branches: ["cloudflare-migration"]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Build static assets
        run: npm run build
      - name: Check Worker syntax
        run: node --check src/index.js
      - name: Deploy temporary Cloudflare preview
        run: |
          set -euo pipefail
          npx wrangler deploy --temporary 2>&1 | tee /tmp/cloudflare-deploy.log
          LIVE_URL="$(grep -o 'https://[^[:space:]]*workers.dev' /tmp/cloudflare-deploy.log | tail -1)"
          test -n "$LIVE_URL"
          echo "LIVE_URL=$LIVE_URL" | tee /tmp/cloudflare-live-url
          printf '%s\n' "$LIVE_URL" > /tmp/cloudflare-live-url.txt

      - name: Test critical HLS manifests through Worker
        run: |
          set -euo pipefail
          LIVE_URL="$(cat /tmp/cloudflare-live-url.txt)"
          export LIVE_URL
          node <<'NODE'
          const base=process.env.LIVE_URL;
          const tests=[
            ['VTV1-VTVGo','https://vtvgolive-failover.vtvdigital.vn/vtvgo/vtv1-manifest.m3u8','', 'Mozilla/5.0'],
            ['VTV1-FPT','https://live-a.fptplay53.net/live/media/vtv1/live247-hls-avc/index.m3u8','', 'Mozilla/5.0'],
            ['ON-Sports-SCTV','https://e3.endpoint.cdn.sctvonline.vn/hls/vtvcab3/sd2/index.m3u8','http://sctvonline.vn/','ReactNativeVideo/3.4.4 (Linux;Android 9) ExoPlayerLib/2.13.3'],
            ['ON-Sports-Plus-SCTV','https://e3.endpoint.cdn.sctvonline.vn/hls/vtvcab6/sd2/index.m3u8','http://sctvonline.vn/','ReactNativeVideo/3.4.4 (Linux;Android 9) ExoPlayerLib/2.13.3'],
            ['ON-Football-SCTV','https://e1.endpoint.cdn.sctvonline.vn/hls/vtvcab16/sd2/index.m3u8','http://sctvonline.vn/','ReactNativeVideo/3.4.4 (Linux;Android 9) ExoPlayerLib/2.13.3'],
            ['ON-Sports-News','https://livevlive.vtvcab.vn/hls/OS_THETHAO_TINTUC_HD/sc-gaFEAA/m30_index.m3u8','','Mozilla/5.0']
          ];
          (async()=>{
            let pass=0;
            for(const [name,u,r,uAgent] of tests){
              const q=new URL(base+'/__nm7/stream');
              q.searchParams.set('u',u);
              if(r)q.searchParams.set('r',r);
              if(uAgent)q.searchParams.set('ua',uAgent);
              try{
                const x=await fetch(q,{headers:{'Accept':'application/vnd.apple.mpegurl,text/plain,*/*'},redirect:'follow'});
                const body=(await x.text()).slice(0,400).trim();
                const ok=x.ok && (body.startsWith('#EXTM3U') || body.includes('#EXT-X-'));
                console.log(JSON.stringify({name,status:x.status,ok,contentType:x.headers.get('content-type'),sample:body.slice(0,120)}));
                if(ok)pass++;
              }catch(e){console.log(JSON.stringify({name,error:String(e)}))}
            }
            console.log('MANIFEST_SMOKE='+pass+'/'+tests.length);
            if(pass===0)process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Install Playwright package and browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium --with-deps

      - name: Smoke test live Worker
        run: |
          set -euo pipefail
          LIVE_URL="$(cat /tmp/cloudflare-live-url.txt)"
          echo "Testing $LIVE_URL"
          export LIVE_URL
          node <<'NODE'
          const fs=require('fs');
          const base=fs.readFileSync('/tmp/cloudflare-live-url.txt','utf8').trim();
          async function get(path){
            const r=await fetch(base+path,{redirect:'follow',cache:'no-store'});
            const text=await r.text();
            console.log(path, r.status, text.slice(0,180).replace(/\s+/g,' '));
            if(!r.ok)throw new Error(path+' HTTP '+r.status);
            return {status:r.status,text};
          }
          (async()=>{
            const page=await get('/');
            if(!/NM7 TV/i.test(page.text))throw new Error('homepage marker missing');
            const staticList=await get('/playlist.json');
            const d=JSON.parse(staticList.text);
            if(!Array.isArray(d.channels)||!d.channels.length)throw new Error('static playlist empty');
            const api=await get('/api/playlist?source=tv');
            const a=JSON.parse(api.text);
            if(!Array.isArray(a.channels)||!a.channels.length)throw new Error('API playlist empty');
            console.log('SMOKE_OK='+JSON.stringify({staticChannels:d.channels.length,apiChannels:a.channels.length}));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Smoke test live UI
        run: |
          set -euo pipefail
          LIVE_URL="$(cat /tmp/cloudflare-live-url.txt)"
          node <<'NODE'
          const {chromium}=require('playwright');
          const fs=require('fs'); const base=fs.readFileSync('/tmp/cloudflare-live-url.txt','utf8').trim();
          (async()=>{
            const b=await chromium.launch({headless:true,args:['--autoplay-policy=no-user-gesture-required','--disable-gpu']});
            const p=await b.newPage({viewport:{width:1920,height:1080}});
            const errors=[];
            p.on('pageerror',e=>errors.push(e.message));
            await p.goto(base+'/?debug=1',{waitUntil:'domcontentloaded',timeout:30000});
            await p.waitForSelector('.card',{timeout:15000});
            const n=await p.locator('.card').count();
            const first=await p.locator('.card').first().getAttribute('aria-label');
            const active=await p.evaluate(()=>({tag:document.activeElement?.tagName,row:document.activeElement?.dataset?.row,col:document.activeElement?.dataset?.col}));
            console.log('UI_OK='+JSON.stringify({cards:n,first,active,errors}));
            if(n<1)throw new Error('no channel cards rendered');
            if(active.tag!=='BUTTON'||active.row!=='0'||active.col!=='0')throw new Error('initial focus incorrect '+JSON.stringify(active));
            await p.keyboard.press('ArrowRight'); await p.waitForTimeout(100);
            const right=await p.evaluate(()=>({row:document.activeElement?.dataset?.row,col:document.activeElement?.dataset?.col}));
            if(right.row!=='0'||right.col!=='1')throw new Error('RIGHT navigation failed '+JSON.stringify(right));
            await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
