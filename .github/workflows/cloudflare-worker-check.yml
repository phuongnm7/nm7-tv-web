name: Cloudflare Worker Build and Preview

on:
  push:
    branches: ["cloudflare-migration"]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Build static assets
        run: npm run build
      - name: Check Worker syntax
        run: node --check src/index.js
      - name: Validate and create temporary Cloudflare preview
        run: npx wrangler deploy --temporary --yes
