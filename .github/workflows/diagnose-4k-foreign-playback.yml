name: Diagnose NM7 4K and foreign channel playback
on:
  push:
    branches:
      - fix/sctv4k-proxy-retry-state-20261010
      - fix/sports-hls-startup-proxy-20261010
    paths:
      - ".github/workflows/diagnose-4k-foreign-playback.yml"
      - "web-tv/app-safari-policy.js"
      - "web-tv/app.js"
      - "worker.js"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install ffprobe for bounded media inspection
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Inspect production playlist candidates and nested HLS resources
        shell: bash
        run: |
          python3 - <<'PY'
          import json, re, os, tempfile, subprocess, shutil, time, urllib.parse, urllib.request, urllib.error
          from urllib.parse import urlparse, urljoin, parse_qs
          BASE = "https://nm7-tv-web-test.phuongnm7-iptv.workers.dev"
          VERCEL_TEST_BASE = "https://nm7-tv-web.vercel.app"
          UA = "Mozilla/5.0 (Linux; Android 15; SM-G998B) AppleWebKit/537.36 Chrome/130.0.0.0 Mobile Safari/537.36"

          def request(url, headers=None, limit=12000, timeout=18):
              started = time.monotonic()
              req = urllib.request.Request(url, headers=headers or {"User-Agent": UA}, method="GET")
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      headers_at = time.monotonic()
                      body = r.read(limit)
                      finished = time.monotonic()
                      return {"status": r.status, "contentType": r.headers.get("Content-Type", ""),
                              "contentLength": r.headers.get("Content-Length"),
                              "headerMs": round((headers_at-started)*1000),
                              "bodyReadMs": round((finished-headers_at)*1000),
                              "totalMs": round((finished-started)*1000),
                              "body": body, "finalUrl": r.geturl()}
              except urllib.error.HTTPError as e:
                  headers_at = time.monotonic()
                  body = e.read(min(limit, 1200))
                  finished = time.monotonic()
                  return {"status": e.code, "contentType": e.headers.get("Content-Type", ""),
                          "contentLength": e.headers.get("Content-Length"),
                          "headerMs": round((headers_at-started)*1000),
                          "bodyReadMs": round((finished-headers_at)*1000),
                          "totalMs": round((finished-started)*1000),
                          "body": body, "finalUrl": e.geturl()}
              except Exception as e:
                  return {"error": type(e).__name__ + ": " + str(e)[:160],
                          "headerMs": None, "bodyReadMs": round((time.monotonic()-started)*1000),
                          "totalMs": round((time.monotonic()-started)*1000), "body": b"", "finalUrl": url}

          def safe_url(url):
              # Signed CDN credentials can be encoded in path segments, not only query strings.
              # Diagnostic logs therefore report host + resource kind, never the stream path.
              try:
                  p = urlparse(url)
                  suffix = ""
                  path = (p.path or "").lower()
                  if path.endswith((".m3u8", ".m3u")): suffix = "/[manifest]"
                  elif path.endswith((".ts", ".m2ts")): suffix = "/[transport-segment]"
                  elif path.endswith((".m4s", ".mp4", ".cmfv", ".cmfa")): suffix = "/[media-segment]"
                  elif path.endswith(".mpd"): suffix = "/[dash-manifest]"
                  return (p.scheme + "://" if p.scheme else "") + (p.hostname or "") + suffix
              except Exception:
                  return "[redacted-url]"

          def output_summary(label, result):
              body = result.get("body", b"")
              text = body[:10000].decode("utf-8", "ignore")
              resolutions = re.findall(r'RESOLUTION=(\d+x\d+)', text, re.I)
              codecs = re.findall(r'CODECS="([^"]+)"', text, re.I)
              is_hls = body.lstrip().startswith(b"#EXTM3U")
              is_dash = b"<MPD" in body[:5000]
              is_html = b"<html" in body[:500].lower() or b"<!doctype html" in body[:500].lower()
              durations = [float(x) for x in re.findall(r'#EXTINF:([0-9.]+)', text, re.I)]
              target_duration = re.search(r'#EXT-X-TARGETDURATION:(\d+)', text, re.I)
              media_sequence = re.search(r'#EXT-X-MEDIA-SEQUENCE:(\d+)', text, re.I)
              hls_meta = ({
                  "targetDurationSec": int(target_duration.group(1)) if target_duration else None,
                  "mediaSequence": int(media_sequence.group(1)) if media_sequence else None,
                  "endList": bool(re.search(r'#EXT-X-ENDLIST', text, re.I)),
                  "segmentCount": len(durations),
                  "segmentDurationsSec": durations[:8]
              } if is_hls else None)
              print(label, json.dumps({
                  "status": result.get("status"), "contentType": result.get("contentType"),
                  "contentLength": result.get("contentLength"), "headerMs": result.get("headerMs"),
                  "bodyReadMs": result.get("bodyReadMs"), "totalMs": result.get("totalMs"),
                  "bytesRead": len(body), "isHLS": is_hls, "isDASH": is_dash, "isHTML": is_html,
                  "hlsMeta": hls_meta,
                  "resolutions": list(dict.fromkeys(resolutions))[:12],
                  "codecs": list(dict.fromkeys(codecs))[:8], "error": result.get("error")
              }, ensure_ascii=False))
              return text

          def extract_uris(text, base_url):
              rows = []
              previous_variant = False
              for line in text.splitlines():
                  s = line.strip()
                  if s.startswith("#EXT-X-STREAM-INF"):
                      attrs = []
                      for key in ("BANDWIDTH", "AVERAGE-BANDWIDTH", "RESOLUTION", "FRAME-RATE", "CODECS"):
                          m = re.search(key + r'="([^"]+)"|' + key + r'=([^,]+)', s, re.I)
                          if m: attrs.append(key + "=" + (m.group(1) or m.group(2)))
                      print("HLS_VARIANT", json.dumps(attrs, ensure_ascii=False))
                      previous_variant = True
                  elif s.startswith("#EXT-X-KEY"):
                      method = re.search(r'METHOD=([^,]+)', s, re.I)
                      uri = re.search(r'URI="([^"]+)"', s, re.I)
                      print("HLS_KEY", json.dumps({
                          "method": method.group(1) if method else None,
                          "uri": safe_url(urljoin(base_url, uri.group(1))) if uri else None
                      }, ensure_ascii=False))
                  elif s and not s.startswith("#"):
                      resolved = urljoin(base_url, s)
                      # If the proxy rewrote the URI, unwrap only for safe path reporting.
                      q = parse_qs(urlparse(resolved).query)
                      upstream = q.get("u", [""])[0] if urlparse(resolved).path == "/api/stream" else ""
                      rows.append({"url": resolved, "kind": "variant" if previous_variant or ".m3u8" in urlparse(upstream or resolved).path.lower() else "segment"})
                      print("HLS_URI", json.dumps({
                          "kind": rows[-1]["kind"], "url": safe_url(upstream or resolved)
                      }, ensure_ascii=False))
                      previous_variant = False
              return rows

          def inspect_path(label, url, headers, depth=0):
              result = request(url, headers, 12000, 15)
              text = output_summary(label, result)
              if not text.startswith("#EXTM3U") or depth >= 1:
                  return
              items = extract_uris(text, result.get("finalUrl") or url)
              if not items:
                  print(label + "_NO_MEDIA_URI")
                  return
              # Check up to two playlist/segment references to keep the probe bounded.
              for index, item in enumerate(items[:2]):
                  child = item["url"]
                  child_path = urlparse(child).path.lower()
                  is_manifest = item["kind"] == "variant" or child_path.endswith((".m3u8", ".m3u"))
                  if is_manifest:
                      inspect_path(label + "_CHILD" + str(index+1), child, headers if not child.startswith(BASE) else {"User-Agent": UA}, depth+1)
                  else:
                      seg = request(child, headers if not child.startswith(BASE) else {"User-Agent": UA}, 8_000_000, 12)
                      output_summary(label + "_SEGMENT" + str(index+1), seg)
                      body = seg.get("body", b"")
                      if seg.get("status") == 200 and body:
                          # Inspect real media bytes/codecs without logging upstream URLs or tokens.
                          ts_sync = bool(len(body) > 376 and body[0] == 0x47 and body[188] == 0x47 and body[376] == 0x47)
                          probe_result = {"tsSync188": ts_sync, "bytesRead": len(body), "ffprobeAvailable": bool(shutil.which("ffprobe"))}
                          if shutil.which("ffprobe"):
                              fd, temp_path = tempfile.mkstemp(suffix=".ts")
                              try:
                                  with os.fdopen(fd, "wb") as stream: stream.write(body)
                                  run = subprocess.run([
                                      "ffprobe", "-v", "error", "-select_streams", "v:0",
                                      "-show_entries", "stream=codec_name,profile,width,height,pix_fmt,level,avg_frame_rate",
                                      "-of", "json", temp_path
                                  ], capture_output=True, text=True, timeout=12)
                                  try:
                                      meta = json.loads(run.stdout or "{}")
                                      streams = meta.get("streams") or []
                                  except Exception:
                                      streams = []
                                  probe_result.update({"ffprobeExit": run.returncode, "videoStreams": streams[:2]})
                                  if run.returncode != 0:
                                      probe_result["ffprobeHasError"] = bool((run.stderr or "").strip())
                              except Exception as e:
                                  probe_result["ffprobeErrorType"] = type(e).__name__
                              finally:
                                  try: os.unlink(temp_path)
                                  except Exception: pass
                          print(label + "_MEDIA_PROBE", json.dumps(probe_result, ensure_ascii=False))

          def fetch_playlist(source, default=None):
              q = {"source": source}
              if default is not None: q["default"] = default
              endpoint = BASE + "/api/playlist?" + urllib.parse.urlencode(q)
              result = request(endpoint, {"User-Agent": UA, "Cache-Control": "no-cache"}, 2_000_000, 30)
              if result.get("status") != 200:
                  print("PLAYLIST_FETCH_ERROR", source, default, result.get("status"), result.get("error"))
                  return []
              try:
                  data = json.loads(result["body"].decode("utf-8"))
                  channels = data.get("channels") or []
                  print("PLAYLIST", json.dumps({"source":source,"preset":default,"channelCount":len(channels),"cached":data.get("cached")}))
                  return channels
              except Exception as e:
                  print("PLAYLIST_JSON_ERROR", source, default, type(e).__name__, str(e)[:120])
                  return []

          channels = fetch_playlist("tv", "1") + fetch_playlist("tv", "2") + fetch_playlist("sport")
          dazn_names = sorted(set(str(c.get("name") or "") for c in channels if "dazn" in str(c.get("name") or "").lower()))
          print("TEST_DAZN_CHANNEL_NAMES", json.dumps(dazn_names[:30], ensure_ascii=False))
          # List matching names and safe host summaries, never stream paths or query/token values.
          bournemouth_catalog = []
          for channel in channels:
              channel_name = str(channel.get("name") or "")
              name_flat = re.sub(r"[^a-z0-9]+", "", channel_name.lower())
              if "bournemouth" not in name_flat and "matchtime" not in name_flat:
                  continue
              candidates = channel.get("candidates") or []
              hosts = sorted(set(urlparse(str(item.get("url") or "")).hostname or "" for item in candidates))
              stalker_candidate = any(
                  urlparse(str(item.get("url") or "")).path.lower().endswith("/play/live.php")
                  and all(key in parse_qs(urlparse(str(item.get("url") or "")).query) for key in ("mac", "stream", "extension"))
                  for item in candidates
              )
              bournemouth_catalog.append({"channel": channel_name, "candidateCount": len(candidates), "hosts": [h for h in hosts if h], "hasStalkerLiveCandidate": stalker_candidate})
          print("BOURNEMOUTH_CHANNEL_CATALOG", json.dumps(bournemouth_catalog[:80], ensure_ascii=False))
          targets, seen = [], set()
          for c in channels:
              name = str(c.get("name") or "")
              flat = re.sub(r"[^a-z0-9]+", "", name.lower())
              if not ("sctv4k" in flat or "dazn" in flat or "bournemouth" in flat or "matchtime" in flat):
                  continue
              for i, cand in enumerate(c.get("candidates") or []):
                  url = str(cand.get("url") or cand.get("resolvedUrl") or "")
                  key = (flat, url)
                  if not url.startswith(("http://", "https://")) or key in seen: continue
                  seen.add(key)
                  targets.append((name, i, cand, url))
          targets.sort(key=lambda item: (
              0 if "bournemouth" in re.sub(r"[^a-z0-9]+", "", item[0].lower()) and "matchtime" in re.sub(r"[^a-z0-9]+", "", item[0].lower())
              else 1 if "afc" in re.sub(r"[^a-z0-9]+", "", item[0].lower()) and "bournemouth" in re.sub(r"[^a-z0-9]+", "", item[0].lower())
              else 2 if "bournemouth" in re.sub(r"[^a-z0-9]+", "", item[0].lower())
              else 3 if "sctv4k" in re.sub(r"[^a-z0-9]+", "", item[0].lower())
              else 4
          ))
          print("TARGET_CANDIDATES", len(targets))
          for name, i, cand, url in targets[:4]:
              typ = str(cand.get("type") or ("dash" if cand.get("dash") else "hls" if cand.get("hls") else "unknown"))
              p = urlparse(url)
              ref = str(cand.get("ref") or "")
              extra = cand.get("headers") if isinstance(cand.get("headers"), dict) else {}
              drm = cand.get("drm")
              print("CANDIDATE", json.dumps({
                  "channel": name, "candidateIndex": i, "type": typ, "host": p.hostname,
                  "resourcePath": "[redacted]", "extension": (re.search(r"\.([a-z0-9]+)$", p.path, re.I).group(1) if re.search(r"\.([a-z0-9]+)$", p.path, re.I) else ""), "hasQueryToken": bool(p.query), "refererHost": urlparse(ref).hostname,
                  "hasCustomUA": bool(cand.get("ua")), "headerNames": sorted(extra.keys()),
                  "drm": bool(drm), "forceProxy": bool(cand.get("forceProxy"))
              }, ensure_ascii=False))
              upstream_headers = {"User-Agent": str(cand.get("ua") or UA)}
              if ref: upstream_headers["Referer"] = ref
              for k, v in extra.items():
                  if str(k).lower() not in ("host", "connection", "content-length", "user-agent", "referer") and isinstance(v, str):
                      upstream_headers[str(k)] = v
              inspect_path(name.replace(" ", "_") + "_DIRECT", url, upstream_headers)
              q = {"u": url}
              if ref: q["r"] = ref
              if cand.get("ua"): q["ua"] = str(cand["ua"])
              if extra: q["h"] = json.dumps(extra, separators=(",", ":"))
              proxy_url = BASE + "/api/stream?" + urllib.parse.urlencode(q)
              inspect_path(name.replace(" ", "_") + "_CLOUDFLARE_PROXY", proxy_url, {"User-Agent": UA})
              query_fields = parse_qs(urlparse(url).query)
              is_stalker = (
                  urlparse(url).path.lower().endswith("/play/live.php")
                  and all(key in query_fields for key in ("mac", "stream", "extension"))
                  and ("play_token" in query_fields or "token" in query_fields)
              )
              if is_stalker:
                  # Compare a different proxy egress using the same source/header metadata.
                  # Log status/host/container metadata only; never output the query URL or token.
                  vercel_proxy_url = VERCEL_TEST_BASE + "/api/stream?" + urllib.parse.urlencode(q)
                  vercel_result = request(vercel_proxy_url, {"User-Agent": UA}, limit=12000, timeout=18)
                  vercel_body = vercel_result.get("body", b"")
                  ts_sync = bool(len(vercel_body) > 376 and vercel_body[0] == 0x47 and vercel_body[188] == 0x47 and vercel_body[376] == 0x47)
                  print(name.replace(" ", "_") + "_VERCEL_EXISTING_PROXY", json.dumps({
                      "status": vercel_result.get("status"), "contentType": vercel_result.get("contentType"),
                      "headerMs": vercel_result.get("headerMs"), "bodyReadMs": vercel_result.get("bodyReadMs"),
                      "totalMs": vercel_result.get("totalMs"), "bytesRead": len(vercel_body),
                      "host": safe_url(vercel_result.get("finalUrl") or vercel_proxy_url),
                      "tsSync188": ts_sync, "error": vercel_result.get("error")
                  }, ensure_ascii=False))
              is_stalker = (
                  urlparse(url).path.lower().endswith("/play/live.php")
                  and all(key in query_fields for key in ("mac", "stream", "extension"))
                  and ("play_token" in query_fields or "token" in query_fields)
              )
              if is_stalker:
                  probe_url = BASE + "/api/probe?" + urllib.parse.urlencode(q)
                  diagnostic = request(probe_url, {"User-Agent": UA}, 12000, 25)
                  try:
                      d = json.loads(diagnostic.get("body", b"{}").decode("utf-8", "ignore"))
                  except Exception:
                      d = {}
                  print("STALKER_PROBE", json.dumps({
                      "channel": name, "candidateIndex": i, "probeHTTP": diagnostic.get("status"),
                      "upstreamHTTP": d.get("status"), "HEAD": d.get("headStatus"), "GET": d.get("getStatus"),
                      "hint": d.get("errorHint"), "type": d.get("type"), "contentType": d.get("contentType"),
                      "bodyClass": d.get("bodyClass"), "bodyBytes": d.get("bodyBytes"),
                      "finalHost": d.get("finalHost"), "server": d.get("serverType"),
                      "cfRay": d.get("cfRayPresent"), "via": d.get("viaPresent"),
                      "authHeader": d.get("wwwAuthenticatePresent")
                  }, ensure_ascii=False))
          if not targets:
              print("NO_MATCHING_TARGETS — the tested channels are not in the three currently served production playlists; likely a local/custom playlist or another source.")
          PY

      - name: Probe a representative saved custom sports M3U entry (redacted)
        shell: bash
        run: |
          python3 - <<'PY'
          import json, time, urllib.parse, urllib.request, urllib.error
          from urllib.parse import urlparse, urljoin
          BASE = "https://nm7-tv-web-test.phuongnm7-iptv.workers.dev"
          STREAM = "https://film4k.net/api/tv/ants/3/index.m3u8"
          REFERER = "https://film4k.net/"
          ORIGIN = "https://film4k.net"
          FULL_UA = "Mozilla/5.0 (Linux; Android 15) AppleWebKit/537.36 Chrome/140.0.0.0 Mobile Safari/537.36"
          RUNNER_UA = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/130.0.0.0 Safari/537.36"

          def safe_host(url):
              try: return urlparse(url).hostname
              except Exception: return "[unknown]"

          def probe(label, url, headers, limit=12000, timeout=12):
              start = time.monotonic()
              req = urllib.request.Request(url, headers=headers, method="GET")
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      header_at = time.monotonic()
                      body = r.read(limit)
                      end = time.monotonic()
                      final = r.geturl()
                      result = {
                          "status": r.status, "contentType": r.headers.get("Content-Type", ""),
                          "headerMs": round((header_at-start)*1000),
                          "readMs": round((end-header_at)*1000), "totalMs": round((end-start)*1000),
                          "bytesRead": len(body), "host": safe_host(final),
                          "isHLS": body.lstrip().startswith(b"#EXTM3U"),
                          "isHTML": body[:500].lstrip().lower().startswith((b"<html", b"<!doctype html")),
                          "errorType": None
                      }
                      print(label, json.dumps(result, ensure_ascii=False))
                      return {"result": result, "body": body, "finalUrl": final}
              except urllib.error.HTTPError as e:
                  end = time.monotonic()
                  body = e.read(min(limit, 1200))
                  result = {
                      "status": e.code, "contentType": e.headers.get("Content-Type", ""),
                      "headerMs": round((end-start)*1000), "readMs": 0,
                      "totalMs": round((end-start)*1000), "bytesRead": len(body),
                      "host": safe_host(e.geturl()), "isHLS": body.lstrip().startswith(b"#EXTM3U"),
                      "isHTML": body[:500].lstrip().lower().startswith((b"<html", b"<!doctype html")),
                      "errorType": None
                  }
                  print(label, json.dumps(result, ensure_ascii=False))
                  return {"result": result, "body": body, "finalUrl": e.geturl()}
              except Exception as e:
                  result = {
                      "status": None, "contentType": None, "headerMs": None, "readMs": None,
                      "totalMs": round((time.monotonic()-start)*1000), "bytesRead": 0,
                      "host": safe_host(url), "isHLS": False, "isHTML": False,
                      "errorType": type(e).__name__
                  }
                  print(label, json.dumps(result, ensure_ascii=False))
                  return {"result": result, "body": b"", "finalUrl": url}

          def children(response):
              text = response["body"].decode("utf-8", "ignore")
              return [x.strip() for x in text.splitlines() if x.strip() and not x.lstrip().startswith("#")]

          ref_headers = {"User-Agent": FULL_UA, "Referer": REFERER, "Origin": ORIGIN}
          full = probe("SAVED_SPORT_DIRECT_FULL_UA", STREAM, ref_headers)
          short = probe("SAVED_SPORT_DIRECT_TRUNCATED_UA", STREAM,
                        {"User-Agent": "Mozilla/5.0", "Referer": REFERER, "Origin": ORIGIN})
          q = {"u": STREAM, "r": REFERER, "ua": FULL_UA,
               "h": json.dumps({"Origin": ORIGIN}, separators=(",", ":"))}
          proxy_url = BASE + "/api/stream?" + urllib.parse.urlencode(q)
          proxy = probe("SAVED_SPORT_PROXY_FULL_UA", proxy_url, {"User-Agent": RUNNER_UA})
          # Inspect only one child. Never print a URI/path/query because it can contain a token.
          direct_children = children(full)
          if full["result"]["isHLS"] and direct_children:
              child = urljoin(full["finalUrl"], direct_children[0])
              probe("SAVED_SPORT_DIRECT_SEGMENT1", child, ref_headers, limit=2048, timeout=10)
          proxy_children = children(proxy)
          if proxy["result"]["isHLS"] and proxy_children:
              child = urljoin(proxy["finalUrl"], proxy_children[0])
              probe("SAVED_SPORT_PROXY_SEGMENT1", child, {"User-Agent": RUNNER_UA}, limit=2048, timeout=10)
          PY
