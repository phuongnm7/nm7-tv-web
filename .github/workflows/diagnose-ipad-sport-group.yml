name: Diagnose iPad sports group playback
on:
  push:
    branches:
      - fix/youtube-original-coccoc-adblock-20261006
    paths:
      - ".github/workflows/diagnose-ipad-sport-group.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect sports group and matching HLS alternatives without leaking stream URLs
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.parse, re
          from urllib.parse import urlparse
          BASE='https://nm7-tv-web.phuongnm7-iptv.workers.dev'
          req=urllib.request.Request(BASE+'/api/playlist?source=tv&default=android1069',
              headers={'User-Agent':'NM7-iPad-Sport-Diagnose/1.0','Cache-Control':'no-cache'})
          with urllib.request.urlopen(req,timeout=30) as r:
              data=json.loads(r.read().decode('utf-8'))
          channels=data.get('channels') or []
          print('PLAYLIST_CHANNELS',len(channels),'SOURCE',data.get('source'),'CACHED',data.get('cached'))
          groups=sorted(set(str(c.get('group') or '') for c in channels if re.search(r'sport|thể thao|the thao|bóng đá|bong da',str(c.get('group') or ''),re.I)))
          print('SPORT_RELATED_GROUPS',json.dumps(groups,ensure_ascii=False))
          sports=[c for c in channels if re.search(r'thể thao|the thao|sport|bóng đá|bong da',str(c.get('group') or ''),re.I)]
          print('SPORT_CHANNEL_COUNT',len(sports))
          def safe_candidate(c):
              u=str(c.get('url') or c.get('resolvedUrl') or '')
              p=urlparse(u)
              ext=''
              m=re.search(r'\.(m3u8?|mpd|flv|mp4|ts|m4s)(?:$|[?#])',p.path+'?x',re.I)
              if m: ext=m.group(1).lower()
              typ=str(c.get('type') or '')
              if not typ:
                  typ='dash' if c.get('dash') or ext=='mpd' else 'hls' if c.get('hls') or ext in ('m3u','m3u8') else 'flv' if c.get('flv') or ext=='flv' else 'mpegts' if ext in ('ts','m4s') else 'unknown'
              drm=c.get('drm')
              drmInfo={'present':bool(drm),'type':drm.get('type') if isinstance(drm,dict) else None,'hasKey':bool(isinstance(drm,dict) and (drm.get('key') or drm.get('clearKeys'))),'hasLicense':bool(isinstance(drm,dict) and (drm.get('license') or drm.get('licenseUrl')))}
              refHost=urlparse(str(c.get('ref') or '')).hostname or ''
              headers=c.get('headers') or {}
              return {'type':typ,'extension':ext,'host':p.hostname or '', 'refHost':refHost,'ua':'custom' if c.get('ua') else 'browser-default','originHeader':bool(headers.get('Origin')),'otherHeaders':[str(k) for k in headers.keys() if str(k).lower() not in ('origin','referer','user-agent')],'drm':drmInfo,'forceProxy':bool(c.get('forceProxy'))}
          def norm(name):
              s=str(name or '').lower()
              s=re.sub(r'\[[^\]]*\]|\([^)]*\)',' ',s)
              s=re.sub(r'\b(hd|fhd|uhd|4k|50fps|25fps|live|trực tiếp|fpt play|backup|dự phòng|server|nguồn)\b',' ',s)
              s=re.sub(r'[^a-z0-9]+','',s)
              return s
          # Index every clear HLS channel from all other groups by normalized name.
          hlsIndex={}
          for x in channels:
              g=str(x.get('group') or '')
              for cand in x.get('candidates') or []:
                  u=str(cand.get('url') or '')
                  if not cand.get('drm') and (cand.get('hls') or str(cand.get('type') or '').lower()=='hls' or re.search(r'\.m3u8?(?:$|[?#])',u,re.I)):
                      hlsIndex.setdefault(norm(x.get('name')),[]).append({'name':x.get('name'),'group':g,**safe_candidate(cand)})
          probeTargets=[]
          for c in sports:
              cs=c.get('candidates') or []
              key=norm(c.get('name'))
              alt=[x for x in hlsIndex.get(key,[]) if x.get('group')!=c.get('group')]
              print('SPORT_CHANNEL',json.dumps({'name':c.get('name'),'id':c.get('id'),'group':c.get('group'),'candidateCount':len(cs),'candidates':[safe_candidate(x) for x in cs],'matchingHLSAlternatives':alt[:8]},ensure_ascii=False))
              for i,x in enumerate(cs[:5]):
                  u=str(x.get('url') or '')
                  if not u.startswith(('http://','https://')): continue
                  q={'u':u}
                  if x.get('ua'): q['ua']=str(x['ua'])
                  if x.get('ref'): q['r']=str(x['ref'])
                  if x.get('headers'): q['h']=json.dumps(x['headers'],separators=(',',':'))
                  probeTargets.append((str(c.get('name')),i,BASE+'/api/probe?'+urllib.parse.urlencode(q)))
          for name,i,url in probeTargets[:60]:
              try:
                  with urllib.request.urlopen(url,timeout=15) as r:
                      d=json.loads(r.read().decode('utf-8'))
                  final=urlparse(str(d.get('resolvedUrl') or d.get('finalUrl') or '')).hostname or ''
                  print('PROBE',json.dumps({'channel':name,'candidate':i,'type':d.get('type'),'contentType':d.get('contentType'),'finalHost':final,'error':d.get('error')},ensure_ascii=False))
              except Exception as e:
                  print('PROBE_ERROR',json.dumps({'channel':name,'candidate':i,'errorType':type(e).__name__,'message':str(e)[:120]},ensure_ascii=False))
          PY
