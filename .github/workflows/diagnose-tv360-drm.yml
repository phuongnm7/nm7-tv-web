name: Diagnose TV360 ClearKey DASH endpoints

on:
  push:
    branches: ["feat/tvdrm-player-integration-20261004"]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Probe TV360 1-10
        shell: bash
        run: |
          set +euo pipefail
          for id in $(seq 1 10); do
            U="https://vmttv.dpdns.org/tv360/"
            echo "===== TV360-$id ====="
            curl -L --max-time 20 --get --data-urlencode "id=tv360-$id" -sS -D "/tmp/h$id" -o "/tmp/b$id" -A "Dalvik/2.1.0" "$U"
            echo "HTTP=$(grep -m1 -E '^HTTP/' /tmp/h$id | tail -1)"
            echo "FINAL=$(grep -i '^location:' /tmp/h$id | tail -1 | sed 's/\r//')"
            echo "BYTES=$(wc -c < /tmp/b$id)"
            python3 - "$id" "/tmp/b$id" <<'PY'
          import sys, re, xml.etree.ElementTree as ET
          i,p=sys.argv[1],sys.argv[2]
          b=open(p,'rb').read()
          if b.lstrip().startswith(b'<'):
            try:
              root=ET.fromstring(b)
              ns={'d':'urn:mpeg:dash:schema:mpd:2011'}
              print("TYPE",root.attrib.get('type'),"UPDATE",root.attrib.get('minimumUpdatePeriod'),
                    "TSBD",root.attrib.get('timeShiftBufferDepth'),"SPD",root.attrib.get('suggestedPresentationDelay'))
              for a in root.findall('.//d:AdaptationSet',ns):
                reps=a.findall('d:Representation',ns)
                cps=a.findall('d:ContentProtection',ns)
                print("ADAPT",a.attrib.get('contentType'),a.attrib.get('mimeType'),
                      a.attrib.get('codecs'),"REPS",len(reps),"CP",len(cps))
                for r in reps[:8]:
                  print(" REP",r.attrib.get('id'),r.attrib.get('bandwidth'),
                        r.attrib.get('width'),r.attrib.get('height'),r.attrib.get('frameRate'),
                        r.attrib.get('codecs'))
            except Exception as e: print("XML_ERROR",type(e).__name__,str(e)[:160])
          else:
            print("BODY_HEAD",b[:180].decode('utf-8','replace').replace('\n',' '))
          PY
          done

      - name: Verify live MPD initialization and media segments
        shell: bash
        run: |
          set +euo pipefail
          id=1
          U="https://vmttv.dpdns.org/tv360/"
          echo "===== TV360-$id segment path ====="
          FINAL="$(curl -L --max-time 20 --get --data-urlencode "id=tv360-$id" -sS -o /tmp/mpd1 -w '%{url_effective}' -A "Dalvik/2.1.0" "$U")"
          python3 - "$FINAL" /tmp/mpd1 /tmp/segments.txt <<'PY'
          import sys, re, urllib.parse, xml.etree.ElementTree as ET
          final, path, outp=sys.argv[1:]
          b=open(path,'rb').read(); root=ET.fromstring(b)
          ns={'d':'urn:mpeg:dash:schema:mpd:2011'}
          base_node=root.find('d:BaseURL',ns)
          base=(base_node.text.strip() if base_node is not None and base_node.text else final.rsplit('/',1)[0]+'/')
          def fmt(t,rep,num,time):
              if not t:return ''
              vals={'RepresentationID':rep,'Number':str(num),'Time':str(time)}
              for k,v in vals.items(): t=t.replace('$'+k+'$',v)
              return t
          lines=[]
          for aset in root.findall('.//d:AdaptationSet',ns):
              reps=aset.findall('d:Representation',ns)
              if not reps: continue
              rep=reps[0]; rid=rep.attrib.get('id','')
              st=rep.find('d:SegmentTemplate',ns) or aset.find('d:SegmentTemplate',ns)
              if st is None: continue
              init=fmt(st.attrib.get('initialization'),rid,0,0)
              if init:
                  lines.append('init|'+urllib.parse.urljoin(base,init))
              media=st.attrib.get('media',''); timescale=int(st.attrib.get('timescale','1'))
              timeline=st.find('d:SegmentTimeline',ns)
              if media and timeline is not None:
                  ss=timeline.findall('d:S',ns)
                  if ss:
                      cur=0; last=None
                      for s in ss:
                          if s.get('t') is not None: cur=int(s.get('t'))
                          d=int(s.get('d','0')); r=int(s.get('r','0'))
                          count=(r+1) if r>=0 else 1
                          for n in range(count):
                              last=(cur,cur+d);cur+=d
                      if last:
                          t,e=last
                          lines.append('media|'+urllib.parse.urljoin(base,fmt(media,rid,0,t)))
                  else:
                      pass
          lines=lines[:6]
          open(outp,'w').write('\n'.join(lines))
          print('SEGMENT_URL_COUNT',len(lines))
          PY
          n=0
          while IFS='|' read -r kind url; do
            [ -n "$url" ] || continue
            n=$((n+1))
            code_size="$(curl -sS -L --max-time 15 -o "/tmp/seg$n" -w '%{http_code} %{size_download}' -A "Dalvik/2.1.0" "$url")"
            echo "$kind $code_size"
          done < /tmp/segments.txt

      - name: Verify deployed proxy MPD and segment path
        shell: bash
        run: |
          set +euo pipefail
          BASE="https://nm7-tv-web.phuongnm7-iptv.workers.dev"
          ENTRY='https://vmttv.dpdns.org/tv360/?id=tv360-1'
          ENC="$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1],safe=""))' "$ENTRY")"
          echo "===== deployed proxy MPD ====="
          curl -sS --max-time 25 -o /tmp/proxy-mpd -w 'HTTP=%{http_code} BYTES=%{size_download}
' -A "Dalvik/2.1.0" "$BASE/api/stream?u=$ENC"
          python3 - "/tmp/proxy-mpd" "/tmp/proxy-segments.txt" <<'PY'
          import sys, urllib.parse, xml.etree.ElementTree as ET
          p,outp=sys.argv[1:]
          b=open(p,'rb').read(); root=ET.fromstring(b)
          ns={'d':'urn:mpeg:dash:schema:mpd:2011'}
          bn=root.find('d:BaseURL',ns)
          base=(bn.text.strip() if bn is not None and bn.text else '')
          print("PROXY_HAS_BASEURL",bool(base))
          print("PROXY_BASE_HOST",urllib.parse.urlsplit(base).netloc if base else '')
          def fmt(t,rep,time):
              if not t:return ''
              return t.replace('$RepresentationID$',rep).replace('$Time$',str(time)).replace('$Number$','0')
          lines=[]
          for aset in root.findall('.//d:AdaptationSet',ns):
              reps=aset.findall('d:Representation',ns)
              if not reps: continue
              rep=reps[0]; rid=rep.attrib.get('id','')
              st=rep.find('d:SegmentTemplate',ns) or aset.find('d:SegmentTemplate',ns)
              if st is None: continue
              init=fmt(st.attrib.get('initialization'),rid,0)
              if init and base: lines.append('init|'+urllib.parse.urljoin(base,init))
              timeline=st.find('d:SegmentTimeline',ns); media=st.attrib.get('media','')
              if timeline is not None and media:
                  ss=timeline.findall('d:S',ns)
                  cur=0
                  for s in ss:
                      if s.get('t') is not None: cur=int(s.get('t'))
                  if ss:
                      d=int(ss[-1].get('d','0'))
                      if s.get('t') is None: cur=max(0,cur)
                      lines.append('media|'+urllib.parse.urljoin(base,fmt(media,rid,cur)))
              if len(lines)>=4: break
          open(outp,'w').write('\n'.join(lines))
          print("PROXY_SEGMENT_URL_COUNT",len(lines))
          PY
          n=0
          while IFS='|' read -r kind url; do
            [ -n "$url" ] || continue
            n=$((n+1))
            enc="$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1],safe=""))' "$url")"
            curl -sS -L --max-time 20 -o "/tmp/p$n" -w "$kind HTTP=%{http_code} BYTES=%{size_download}
" "$BASE/api/stream?u=$enc"
          done < /tmp/proxy-segments.txt
