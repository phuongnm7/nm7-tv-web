name: Diagnose VTVcab3 ON Sports playback

on:
  push:
    branches: ["fix/safari-drm-final-20261005"]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe additional ON Sports resolvers
        shell: bash
        run: |
          set +e
          for U in \
            'https://code.vthanhtivi.pw/getlink/onlive/onsports/84867.m3u8' \
            'https://liveh34.vtvcab.vn/hls/THETHAO_HD/04.m3u8' \
            'https://live2onsport.vtvcab.vn/onplus/THETHAO_HD/m40_index.m3u8'
          do
            echo "=== $U ==="
            curl -L --max-time 25 -sS -D /tmp/ah -o /tmp/ab -A 'Mozilla/5.0 (Linux; Android 10; K) AppleWebKit/537.36 Chrome/120.0.0.0 Mobile Safari/537.36'
            rc=$?
            echo "CURL_RC=$rc"
            test -f /tmp/ah && head -20 /tmp/ah || true
            test -f /tmp/ab && { echo "BYTES=$(wc -c < /tmp/ab)"; head -c 1000 /tmp/ab | tr '\n' ' '; echo; } || true
          done

      - name: Probe dynamic VTVcab3 resolver
        shell: bash
        run: |
          set +e
          for U in \
            'https://api.vthanhtivi.pw/v1/getlink/vieon2/9fb740a5-d1a0-4068-8d02-0a4d428f46db' \
            'http://live.vthanhtivi.pw:8080/vtvcab3'
          do
            echo "=== $U ==="
            curl -L --max-time 25 -sS -D /tmp/dh -o /tmp/db -A 'KhoaTivi' "$U"
            rc=$?
            echo "CURL_RC=$rc"
            test -f /tmp/dh && head -20 /tmp/dh || true
            test -f /tmp/db && { echo "BYTES=$(wc -c < /tmp/db)"; head -c 1000 /tmp/db | tr '\n' ' '; echo; } || true
          done

      - name: Probe matching VTVcab3 HLS source
        shell: bash
        run: |
          set +e
          U='https://856175157.r.vtvcdn.com/ondrm/THETHAO_HD/m30_index.m3u8'
          curl -L --max-time 25 -sS -D /tmp/h -o /tmp/b -A 'KhoaTivi' "$U"
          rc=$?
          echo "CURL_RC=$rc"
          test -f /tmp/h && head -20 /tmp/h || true
          test -f /tmp/b && { echo "BYTES=$(wc -c < /tmp/b)"; head -c 400 /tmp/b; echo; grep -q '#EXTM3U' /tmp/b && echo HLS_M3U_OK || true; grep -q '#EXT-X-KEY' /tmp/b && echo HLS_ENCRYPTED || echo HLS_NO_KEY_TAG; } || true
        env:
          CURL_HOME: /tmp
      - name: Probe matching source through Cloudflare
        shell: bash
        run: |
          set +e
          U='https://856175157.r.vtvcdn.com/ondrm/THETHAO_HD/m30_index.m3u8'
          ENC="$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1],safe=""))' "$U")"
          curl -L --max-time 25 -sS -D /tmp/ph -o /tmp/pb -A 'Mozilla/5.0' "https://nm7-tv-web.phuongnm7-iptv.workers.dev/api/stream?u=$ENC&ua=KhoaTivi"
          rc=$?
          echo "CURL_RC=$rc"
          test -f /tmp/ph && head -30 /tmp/ph || true
          test -f /tmp/pb && { echo "PROXY_BYTES=$(wc -c < /tmp/pb)"; head -c 500 /tmp/pb; echo; grep -q '#EXTM3U' /tmp/pb && echo PROXY_HLS_M3U_OK || true; } || true
