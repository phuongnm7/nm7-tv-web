name: NM7 fallback endpoint access
on:
  push:
    branches: ["feature/web-tv-browser-1.0.69-android-exact"]
  pull_request:
    branches: ["main"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe fallback URLs
        shell: bash
        run: |
          set +e
          probe() {
            NAME="$1"; URL="$2"; UA="$3"; REF="$4"
            echo "===== $NAME ====="
            if [ -n "$REF" ]; then
              curl -sS -L --max-time 20 -A "$UA" --referer "$REF" -D h -o b "$URL"
            else
              curl -sS -L --max-time 20 -A "$UA" -D h -o b "$URL"
            fi
            rc=$?
            echo "curl_rc=$rc"
            head -n1 h 2>/dev/null
            grep -i '^content-type:' h 2>/dev/null || true
            grep -i '^location:' h 2>/dev/null | tail -2 || true
            echo "body:"
            head -c 160 b 2>/dev/null | tr '\n' ' '; echo
          }
          probe "VTV1 FPT" "https://live.fptplay53.net/live/media/vtv1/live247-hls-avc/index.m3u8" "Mozilla/5.0" ""
          probe "VTV1 VTVGiaiTri" "https://kcdn-livestream.vtvgiaitri.vn/vtvgtlivestream/vtv1_720/index.m3u8" "Mozilla/5.0" ""
          probe "VTV1 TodayPlus" "https://cdnw-liv02.todayplus.com.vn/hdb/smil:vtv1-sub.smil/chunklist_w28623972_b2289152.m3u8" "Mozilla/5.0" ""
          probe "ON Sports SCTV" "https://e3.endpoint.cdn.sctvonline.vn/hls/vtvcab3/index.m3u8" "ReactNativeVideo/3.4.4 (Linux;Android 9) ExoPlayerLib/2.13.3" "http://sctvonline.vn/"
          probe "ON Sports VTVCab" "https://liveh34.vtvcab.vn/hls/THETHAO_HD/04.m3u8" "Mozilla/5.0" "https://sctvonline.vn/"
          probe "ON Football SCTV" "https://e7.endpoint.cdn.sctvonline.vn/live/smil:VTVCAB16.smil/chunklist_w2005840737_b1692000.m3u8" "ReactNativeVideo/3.4.4 (Linux;Android 9) ExoPlayerLib/2.13.3" "http://sctvonline.vn/"
          probe "ON Football VTV CDN" "https://856175157.r.vtvcdn.com/ondrm/BONGDA_HD/m30_index.m3u8" "Mozilla/5.0" ""
