name: Probe Android wallpaper source
on:
  push:
    branches: ["feat/tvdrm-player-integration-20261004"]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch raw Android wallpaper
        shell: bash
        run: |
          set -euo pipefail
          URL="https://raw.githubusercontent.com/phuongnm7/nm7-tv-android/fb90371354eccc605cbac948ea701431a8434bf8/app/src/main/res/drawable/nm7_default_background_new.webp"
          set +e
          curl -L --max-time 30 -o /tmp/android.webp "$URL"
          rc=$?
          set -e
          echo "curl_rc=$rc"
          if [ "$rc" -eq 0 ]; then
            ls -lh /tmp/android.webp
            file /tmp/android.webp
            sha256sum /tmp/android.webp
          fi
