name: Production API diagnostic
on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check production page and playlist API
        shell: bash
        run: |
          set -euo pipefail
          probe() {
            local label="$1" url="$2" out="$3"
            local code
            code="$(curl -sS --max-time 30 -o "$out" -w "%{http_code}" "$url" || true)"
            echo "$label HTTP $code"
            if [[ "$code" == "401" || "$code" == "403" ]]; then
              echo "$label is deployment-protected; skipping authenticated production check."
              return 10
            fi
            if [[ "$code" =~ ^5 ]]; then
              echo "$label returned server error $code"
              return 1
            fi
            if [[ ! "$code" =~ ^2 ]]; then
              echo "$label returned unexpected status $code"
              return 1
            fi
            return 0
          }

          if ! probe PAGE https://nm7-tv-web.vercel.app/ /tmp/page.html; then
            rc=$?
            if [[ "$rc" -eq 10 ]]; then exit 0; else exit "$rc"; fi
          fi
          grep -q "NM7 TV" /tmp/page.html

          if ! probe TV_API 'https://nm7-tv-web.vercel.app/api/playlist?source=tv' /tmp/tv.json; then
            rc=$?
            if [[ "$rc" -eq 10 ]]; then exit 0; else exit "$rc"; fi
          fi
          python3 - <<'PY'
import json
d=json.load(open('/tmp/tv.json',encoding='utf-8'))
print('keys=',list(d.keys()))
print('channels=',len(d.get('channels',[])))
if not d.get('channels'): raise SystemExit('TV playlist returned zero channels')
PY

          if ! probe SPORT_API 'https://nm7-tv-web.vercel.app/api/playlist?source=sport' /tmp/sport.json; then
            rc=$?
            if [[ "$rc" -eq 10 ]]; then exit 0; else exit "$rc"; fi
          fi
          python3 - <<'PY'
import json
d=json.load(open('/tmp/sport.json',encoding='utf-8'))
print('channels=',len(d.get('channels',[])))
PY
