name: Seed native Android 1.0.69 wallpaper
on:
  push:
    branches: ["feat/tvdrm-player-integration-20261004"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore native wallpaper from Android 1.0.69 APK artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 120 -o /tmp/android-artifact.zip 'https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-1be8-8206-9403-93cc21f00af7/raw?se=2026-10-04T08%3A40%3A23Z&sp=r&sv=2026-02-06&sr=b&scid=7af15a2e-5955-5c69-a19d-6595dee806f1&skoid=0765b554-4b90-4fa2-9d6d-0055a2427910&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-04T01%3A18%3A17Z&ske=2026-10-05T01%3A18%3A17Z&sks=b&skv=2026-02-06&sig=5Ffj9M0ZjTStZtNeXe0v4kYaD3Yp4h3TDadaQO8YvkU%3D'
          rm -rf /tmp/apk && mkdir -p /tmp/apk
          unzip -q /tmp/android-artifact.zip -d /tmp/apk
          APK="/tmp/apk/NM7-TV-1.0.69-YouTube.apk"
          unzip -q -p "$APK" 'res/tf.webp' > web-tv/assets/nm7-default-background.webp
          file web-tv/assets/nm7-default-background.webp
          sha256sum web-tv/assets/nm7-default-background.webp
          META="$(file web-tv/assets/nm7-default-background.webp)"
          echo "$META"
          echo "$META" | grep -q "3840x2160"
          test "$(sha256sum web-tv/assets/nm7-default-background.webp | cut -d' ' -f1)" = "d8af6ac8ba532db465dcb8c44e00b71865e6c9a712c8cc21cd0a2118400bd00d"
      - name: Commit native wallpaper and remove seed workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/seed-native-android-wallpaper.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web-tv/assets/nm7-default-background.webp .github/workflows/seed-native-android-wallpaper.yml
          git commit -m "fix(ui): use native 1.0.69 wallpaper asset"
          git push
