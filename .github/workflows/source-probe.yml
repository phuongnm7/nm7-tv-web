name: NM7 default playlist source probe
on:
  push:
    branches: ["feat/tvdrm-player-integration-20261004"]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe candidate sources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request, re
          urls = [
            "https://phuongnm7-playlist.phuongnm7-iptv.workers.dev/",
            "https://iptv-live-merge.phuongnm7-iptv.workers.dev/playlist.m3u",
            "https://raw.githubusercontent.com/phuongnm7/Iptv-phuongnm7/main/IPTV_Gop_VMTTV_vAppTV.m3u",
          ]
          for u in urls:
              print("\n=== "+u+" ===")
              req=urllib.request.Request(u,headers={"User-Agent":"NM7-Source-Probe/1.0.69"})
              try:
                  with urllib.request.urlopen(req,timeout=20) as r:
                      raw=r.read(4*1024*1024).decode("utf-8","replace")
                      print("HTTP",r.status,"bytes",len(raw.encode()))
                      n=0
                      groups={}
                      for line in raw.splitlines():
                          if line.startswith("#EXTINF:"):
                              m=re.search(r'group-title="([^"]*)"',line,re.I)
                              name=line.split(",",1)[1].strip() if "," in line else ""
                              g=m.group(1) if m else "Khác"
                              groups.setdefault(g,[]).append(name)
                      print("groups:",[(g,len(v)) for g,v in list(groups.items())[:12]])
                      for g,v in list(groups.items())[:4]:
                          print("GROUP",g, "=>", v[:15])
              except Exception as e:
                  print("ERROR",repr(e))
          PY
