name: Test cross-repo Android artifact access
on:
  push:
    branches: ["feat/tvdrm-player-integration-20261004"]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Probe artifact API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          code=$(curl -sS -o /tmp/a.json -w "%{http_code}" -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/phuongnm7/nm7-tv-android/actions/artifacts/11202604717")
          echo "HTTP=$code"
          head -c 1000 /tmp/a.json
          echo
