  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test ON Football mirror candidates
        shell: bash
        run: |
          set +e
          items=(
            "AZURE_DDNS|https://azurex88.ddns.net/premium/bpk-tv/vcab/vtvcab16/index.m3u8"
            "AZURE_MYFTP|https://azurex88.myftp.biz/livetv/bpk-tv/vstv/userid:vmttv/mac=2F-1E-07-AD-E9-59/vtvcab16/index.m3u8"
            "KHANG|https://khanggtivi.xyz/vuminhthanh/vmt2024/onfootball/index.m3u8"
            "HOIQUAN|https://xem.hoiquan.click/TichHop/OnLive/LIVE/?user=onfootball"
            "TV360_ID_ONLY|https://tv.vietanhtv.top/tv360/tv360.php?id=174"
            "TV360_KEY_ONLY|https://tv.vietanhtv.top/sex/cleankey.php?id=tv360174"
          )
          for item in "${items[@]}"; do
            n="${item%%|*}"; u="${item#*|}"
            echo "=== $n ==="
            curl -L --max-time 20 -A "Mozilla/5.0 (Linux; Android 10; K) AppleWebKit/537.36 Chrome/120.0.0.0 Mobile Safari/537.36" -e "http://sctvonline.vn/" -sS -D /tmp/h -o /tmp/b "$u"
