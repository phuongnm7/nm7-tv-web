name: Test VTV1 short and ON Football fallback
on:
  push:
    branches: ["feat/tvdrm-player-integration-20261004"]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test public fallback endpoints
        shell: bash
        run: |
          set +e
          items=(
            "VTV1_SHORT|https://HaNoiIPTV.short.gy/HaNoiIPTV-VTV1_HD"
            "ONFOOT_KHANG|https://khanggtivi.xyz/vuminhthanh/vmt2024/onfootball/index.m3u8"
            "ONFOOT_AZURE|https://azurex88.myftp.biz/livetv/bpk-tv/vstv/userid:vmttv/mac=2F-1E-07-AD-E9-59/vtvcab16/index.m3u8"
          )
          for item in "${items[@]}"; do
            n="${item%%|*}"; u="${item#*|}"
            echo "=== $n ==="
            curl -L --max-time 20 -A "Mozilla/5.0 (Linux; Android 10; K) AppleWebKit/537.36 Chrome/120.0.0.0 Mobile Safari/537.36" -sS -D /tmp/h -o /tmp/b "$u"
            echo "HTTP=$(head -1 /tmp/h)"
            grep -iE '^(content-type|content-length|location|access-control-allow-origin|server):' /tmp/h | head -20
            echo "BYTES=$(wc -c < /tmp/b)"
            head -c 400 /tmp/b | strings | head -10
          done
