name: Test VTV1 fallback candidates
on:
  push:
    branches: ["feat/tvdrm-player-integration-20261004"]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test VTV1 fallback URLs
        shell: bash
        run: |
          set +e
          urls=(
            "VTV1_LIVEA|https://live-a.fptplay53.net/live/media/vtv1/live247-hls-avc/index.m3u8"
            "VTV1_H12|https://liveh12.vtvprime.vn/hls/VTV1_HD/index.m3u8"
            "VTV1_H12_03|https://liveh12.vtvprime.vn/hls/VTV1_HD/03.m3u8"
            "VTV1_SCTV|https://livesct.vtvprime.vn/mean/VTV1_HD/manifest.mpd"
          )
          for item in "${urls[@]}"; do
            n="${item%%|*}"; u="${item#*|}"
            echo "=== $n ==="
            curl -L --max-time 20 -A "Dalvik/2.1.0" -sS -D /tmp/h -o /tmp/b "$u"
            echo "HTTP=$(head -1 /tmp/h)"
            grep -iE '^(content-type|content-length|location|access-control-allow-origin|server):' /tmp/h | head -20
            echo "BYTES=$(wc -c < /tmp/b)"
            head -c 350 /tmp/b | strings | head -8
          done
