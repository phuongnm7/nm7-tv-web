name: Test VTV1 required headers
on:
  push:
    branches: ["feat/tvdrm-player-integration-20261004"]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test VTV1 with FPTPlay headers
        shell: bash
        run: |
          set +e
          URL='https://live-a.fptplay53.net/live/media/vtv1/live247-hls-avc/index.m3u8'
          for i in 1 2 3; do
            echo "=== FPT_HEADER_PROFILE_$i ==="
            case $i in
              1) UA='Mozilla/5.0 (Linux; Android 15; SM-S918B) AppleWebKit/537.36 Chrome/135.0.7049.111 Mobile Safari/537.36 vAppTV/1.0.2'; REF='https://fptplay.vn/'; ORG='https://fptplay.vn';;
              2) UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140.0.0.0 Safari/537.36'; REF='https://fptplay.vn/'; ORG='https://fptplay.vn';;
              3) UA='Dalvik/2.1.0'; REF='https://fptplay.vn/'; ORG='https://fptplay.vn';;
            esac
            curl -L --max-time 20 -A "$UA" -e "$REF" -H "Origin: $ORG" -sS -D /tmp/h -o /tmp/b "$URL"
            echo "HTTP=$(head -1 /tmp/h)"
            grep -iE '^(content-type|content-length|access-control-allow-origin|server|location):' /tmp/h | head -20
            echo "BYTES=$(wc -c < /tmp/b)"
            head -c 200 /tmp/b | strings | head -5
          done
      - name: Test legacy xemtv resolver
        shell: bash
        run: |
          set +e
          for u in "https://hd.xemtv.net/kenh/vtv1.php" "https://xemtv.us/tv/vtv1.php"; do
            echo "=== $u ==="
            curl -L --max-time 20 -A "Mozilla/5.0" -sS -D /tmp/h -o /tmp/b "$u"
            echo "HTTP=$(head -1 /tmp/h)"
            grep -iE '^(content-type|content-length|location|server):' /tmp/h | head -20
            echo "BYTES=$(wc -c < /tmp/b)"
            head -c 700 /tmp/b | strings | head -12
          done
