name: Extract TV365 playlist
on:
  push:
    branches:
      - temp/tv365-extract-20261006
jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download playlist
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-all-errors --connect-timeout 20 --max-time 120 \
            'https://raw.githubusercontent.com/TV365-VN/TV365-DATA/main/error.m3u' \
            -o tv365_app_playlist_source.m3u
          test "$(head -n 1 tv365_app_playlist_source.m3u)" = "#EXTM3U"
          echo "bytes=$(wc -c < tv365_app_playlist_source.m3u)"
          echo "lines=$(wc -l < tv365_app_playlist_source.m3u)"
          echo "channels=$(grep -c '^#EXTINF:' tv365_app_playlist_source.m3u)"
          sha256sum tv365_app_playlist_source.m3u
      - name: Upload playlist artifact
        uses: actions/upload-artifact@v4
        with:
          name: tv365-app-playlist
          path: tv365_app_playlist_source.m3u
          if-no-files-found: error
