name: Web Browser Validation

on:
  push:
    branches:
      - main
      - feat/**
  pull_request:
    branches:
      - main

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check web JavaScript
        run: |
          node --check web-tv/app.js
          node --check api/stream.js
          node --check api/probe.js
          node --check api/license.js
          node --check api/playlist.js
          node --check api/vietmitv-merge.js
          node --check api/vietmitv-source.js
      - name: Validate bundled uploaded M3U
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const zlib = require('node:zlib');
          const source = fs.readFileSync('api/vietmitv-source.js', 'utf8');
          const crypto = require('node:crypto');
          const partsBlock = source.match(/const SOURCE_GZIP_PARTS = \[([\s\S]*?)\];/);
          const hashesBlock = source.match(/const SOURCE_GZIP_PART_SHA256 = \[([\s\S]*?)\];/);
          if (!partsBlock || !hashesBlock) throw new Error('Missing segmented compressed M3U payload');
          const parts = [...partsBlock[1].matchAll(/"([A-Za-z0-9+/=]+)"/g)].map(m => m[1]);
          const expectedParts = [...hashesBlock[1].matchAll(/"([0-9a-f]{64})"/g)].map(m => m[1]);
          if (parts.length !== expectedParts.length) throw new Error('Compressed payload segment count mismatch');
          parts.forEach((part, i) => {
            const digest = crypto.createHash('sha256').update(part, 'ascii').digest('hex');
            if (digest !== expectedParts[i]) throw new Error('Compressed payload segment checksum mismatch at index ' + i);
          });
          const gzip = Buffer.from(parts.join(''), 'base64');
          if (gzip.length < 18 || gzip[0] !== 0x1f || gzip[1] !== 0x8b || gzip[2] !== 0x08) throw new Error('Invalid gzip header');
          const flags = gzip[3];
          let deflateStart = 10;
          if (flags & 0x04) deflateStart += 2 + gzip.readUInt16LE(deflateStart);
          for (const flag of [0x08, 0x10]) {
            if (flags & flag) {
              const end = gzip.indexOf(0, deflateStart);
              if (end < 0) throw new Error('Truncated gzip string header');
              deflateStart = end + 1;
            }
          }
          if (flags & 0x02) deflateStart += 2;
          const playlist = zlib.inflateRawSync(gzip.subarray(deflateStart, gzip.length - 8)).toString('utf8').replace(/^\uFEFF/, '');
          const sha = crypto.createHash('sha256').update(playlist, 'utf8').digest('hex');
          console.log('Bundled source sha256:', sha);
          if (sha !== '2cd1f0b3a7347d8f2e8913909ce2a6141d7d1ede0657dcc49cf5c4434d9c6966') throw new Error('Bundled M3U content checksum mismatch');
          if (!/^\s*#EXTM3U\b/i.test(playlist)) throw new Error('Uploaded M3U header is invalid');
          const lines = playlist.split(/\r?\n/);
          const extinf = lines.filter(line => /^\s*#EXTINF:/i.test(line));
          const groups = new Set(extinf.map(line => {
            const m = /\bgroup-title="([^"]*)"/i.exec(line);
            return m ? m[1] : 'Khác';
          }));
          if (extinf.length < 180) throw new Error('Too few channels in uploaded M3U: ' + extinf.length);
          for (const group of ['VTV', 'HTV', 'VTVcab', 'SCTV', 'Quốc Tế', 'Địa Phương', '🇨🇳| Trung Quốc', 'In The Box']) {
            if (!groups.has(group)) throw new Error('Missing original group: ' + group);
          }
          console.log('Uploaded M3U validated:', extinf.length, 'channels across', groups.size, 'groups');
          NODE
      - name: Check required web assets
        run: |
          test -s web-tv/index.html
          test -s web-tv/app.js
          test -s assets/nm7-default-background.webp
          test -s web-tv/dash.all.min.js
          grep -q 'Android 1.0.69' web-tv/index.html || true
