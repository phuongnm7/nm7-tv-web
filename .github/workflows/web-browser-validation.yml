name: Web Browser Validation

on:
  push:
    branches:
      - main
      - feat/**
  pull_request:
    branches:
      - main

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check web JavaScript
        run: |
          node --check web-tv/app.js
          node --check api/stream.js
          node --check api/probe.js
          node --check api/license.js
          node --check api/playlist.js
          node --check api/vietmitv-merge.js
          node --check api/vietmitv-source.js
          node --check api/vietmitv-sports-fallback.js
      - name: Validate bundled uploaded M3U
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const zlib = require('node:zlib');
          const source = fs.readFileSync('api/vietmitv-source.js', 'utf8');
          const crypto = require('node:crypto');
          const partsBlock = source.match(/const SOURCE_GZIP_PARTS = \[([\s\S]*?)\];/);
          const hashesBlock = source.match(/const SOURCE_GZIP_PART_SHA256 = \[([\s\S]*?)\];/);
          if (!partsBlock || !hashesBlock) throw new Error('Missing segmented compressed M3U payload');
          const parts = [...partsBlock[1].matchAll(/"([A-Za-z0-9+/=]+)"/g)].map(m => m[1]);
          const expectedParts = [...hashesBlock[1].matchAll(/"([0-9a-f]{64})"/g)].map(m => m[1]);
          if (parts.length !== expectedParts.length) throw new Error('Compressed payload segment count mismatch');
          parts.forEach((part, i) => {
            const digest = crypto.createHash('sha256').update(part, 'ascii').digest('hex');
            if (digest !== expectedParts[i]) throw new Error('Compressed payload segment checksum mismatch at index ' + i);
          });
          const gzip = Buffer.from(parts.join(''), 'base64');
          if (gzip.length < 18 || gzip[0] !== 0x1f || gzip[1] !== 0x8b || gzip[2] !== 0x08) throw new Error('Invalid gzip header');
          const flags = gzip[3];
          let deflateStart = 10;
          if (flags & 0x04) deflateStart += 2 + gzip.readUInt16LE(deflateStart);
          for (const flag of [0x08, 0x10]) {
            if (flags & flag) {
              const end = gzip.indexOf(0, deflateStart);
              if (end < 0) throw new Error('Truncated gzip string header');
              deflateStart = end + 1;
            }
          }
          if (flags & 0x02) deflateStart += 2;
          const playlist = zlib.inflateRawSync(gzip.subarray(deflateStart, gzip.length - 8)).toString('utf8').replace(/^\uFEFF/, '');
          const sha = crypto.createHash('sha256').update(playlist, 'utf8').digest('hex');
          console.log('Bundled source sha256:', sha);
          if (sha !== '2cd1f0b3a7347d8f2e8913909ce2a6141d7d1ede0657dcc49cf5c4434d9c6966') throw new Error('Bundled M3U content checksum mismatch');
          if (!/^\s*#EXTM3U\b/i.test(playlist)) throw new Error('Uploaded M3U header is invalid');
          const lines = playlist.split(/\r?\n/);
          const extinf = lines.filter(line => /^\s*#EXTINF:/i.test(line));
          const groups = new Set(extinf.map(line => {
            const m = /\bgroup-title="([^"]*)"/i.exec(line);
            return m ? m[1] : 'Khác';
          }));
          if (extinf.length < 180) throw new Error('Too few channels in uploaded M3U: ' + extinf.length);
          for (const group of ['VTV', 'HTV', 'VTVcab', 'SCTV', 'Quốc Tế', 'Địa Phương', '🇨🇳| Trung Quốc', 'In The Box']) {
            if (!groups.has(group)) throw new Error('Missing original group: ' + group);
          }
          console.log('Uploaded M3U validated:', extinf.length, 'channels across', groups.size, 'groups');
          NODE
      - name: Test playlist API handlers with uploaded M3U
        run: |
          node --experimental-default-type=module --input-type=module <<'NODE'
          import playlistHandler from './api/playlist.js';
          import mergeHandler from './api/vietmitv-merge.js';

          function makeResponse() {
            return {
              statusCode: 200,
              headers: {},
              body: null,
              setHeader(name, value) { this.headers[name.toLowerCase()] = value; },
              status(code) { this.statusCode = code; return this; },
              json(value) { this.body = JSON.stringify(value); return this; },
              send(value) { this.body = value; return this; },
              end(value) { if (value !== undefined) this.body = value; return this; }
            };
          }

          const required = [
            'VTV', 'HTV', 'VTVcab', 'SCTV', 'Quốc Tế', 'Địa Phương', '🇨🇳| Trung Quốc', 'In The Box',
            'Giờ Vàng TV', 'Gà Vàng 24h TV', 'Gà Vàng 33 TV', 'S8 TV', 'Sao Kê TV'
          ];

          const jsonRes = makeResponse();
          await playlistHandler({ method: 'GET', url: '/api/playlist?source=tv', headers: {} }, jsonRes);
          if (jsonRes.statusCode !== 200) throw new Error('TV playlist API returned HTTP ' + jsonRes.statusCode + ': ' + jsonRes.body);
          const json = JSON.parse(jsonRes.body);
          if (!Array.isArray(json.channels) || json.channels.length < 300) throw new Error('Merged Web channel list is too short: ' + (json.channels || []).length);
          const groups = new Set(json.channels.map(channel => channel.group));
          for (const group of required) if (!groups.has(group)) throw new Error('Web playlist missing group: ' + group);
          console.log('Web JSON API passed:', json.channels.length, 'channels,', groups.size, 'groups');

          const m3uRes = makeResponse();
          await mergeHandler({ method: 'GET', url: '/api/vietmitv-merge', headers: {} }, m3uRes);
          if (m3uRes.statusCode !== 200) throw new Error('Merged M3U endpoint returned HTTP ' + m3uRes.statusCode + ': ' + m3uRes.body);
          const text = String(m3uRes.body || '');
          if (!text.trimStart().startsWith('#EXTM3U')) throw new Error('Merged M3U header missing');
          for (const group of required) {
            if (!text.includes('group-title="' + group + '"')) throw new Error('Merged M3U missing group: ' + group);
          }
          const count = text.split(String.fromCharCode(10)).filter(line => line.trimStart().startsWith('#EXTINF:')).length;
          if (count < 300) throw new Error('Merged M3U channel count is too low: ' + count);
          console.log('Raw M3U API passed:', count, 'entries');

          // Simulate an upstream outage. Both public APIs must still serve the bundled
          // M3U plus the last-known-good copy of all five requested groups.
          const originalFetch = globalThis.fetch;
          globalThis.fetch = async () => { throw new Error('simulated upstream outage'); };
          try {
            await new Promise(resolve => setTimeout(resolve, 5100));
            const offlineJsonRes = makeResponse();
            await playlistHandler({ method: 'GET', url: '/api/playlist?source=tv', headers: {} }, offlineJsonRes);
            if (offlineJsonRes.statusCode !== 200) throw new Error('Offline Web JSON API returned HTTP ' + offlineJsonRes.statusCode + ': ' + offlineJsonRes.body);
            const offlineJson = JSON.parse(offlineJsonRes.body);
            if (!Array.isArray(offlineJson.channels) || offlineJson.channels.length < 300) throw new Error('Offline Web JSON API has too few channels');
            const offlineGroups = new Set(offlineJson.channels.map(channel => channel.group));
            for (const group of required) if (!offlineGroups.has(group)) throw new Error('Offline Web JSON API missing group: ' + group);

            const offlineM3uRes = makeResponse();
            await mergeHandler({ method: 'GET', url: '/api/vietmitv-merge', headers: {} }, offlineM3uRes);
            if (offlineM3uRes.statusCode !== 200) throw new Error('Offline merged M3U returned HTTP ' + offlineM3uRes.statusCode + ': ' + offlineM3uRes.body);
            const offlineText = String(offlineM3uRes.body || '');
            if (!offlineText.trimStart().startsWith('#EXTM3U')) throw new Error('Offline M3U header missing');
            for (const group of required) if (!offlineText.includes('group-title="' + group + '"')) throw new Error('Offline M3U missing group: ' + group);
            const offlineCount = offlineText.split(String.fromCharCode(10)).filter(line => line.trimStart().startsWith('#EXTINF:')).length;
            if (offlineCount < 300) throw new Error('Offline M3U count too low: ' + offlineCount);
            console.log('Offline fallback passed:', offlineJson.channels.length, 'JSON channels and', offlineCount, 'M3U entries');
          } finally {
            globalThis.fetch = originalFetch;
          }
          NODE
      - name: Check required web assets
        run: |
          test -s web-tv/index.html
          test -s web-tv/app.js
          test -s assets/nm7-default-background.webp
          test -s web-tv/dash.all.min.js
          grep -q 'Android 1.0.69' web-tv/index.html || true
