name: NM7 Web 1.0.69 browser and CDN smoke
on:
  push:
    branches: ["feature/web-tv-browser-1.0.69-android-exact"]
  pull_request:
    branches: ["main"]
jobs:
  browser:
    runs-on: ubuntu-latest
    env:
      PREVIEW_URL: https://nm7-tv-web-git-feature-web-tv-browser-1069-and-8db876-phuongnm7.vercel.app
    steps:
      - uses: actions/checkout@v4
      - name: Browser UI smoke
        run: |
          set -euxo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('web-tv/index.html','utf8');
          const js=html.slice(html.indexOf('<script>')+8,html.lastIndexOf('</script>'));
          new Function(js);
          if(/\?\./.test(js))throw new Error('optional chaining remains');
          if(/\?\?/.test(js))throw new Error('nullish coalescing remains');
          if(!html.includes('viewBox="0 0 388.67627 83.90052"'))throw new Error('exact YouTube vector missing');
          if(!html.includes('1.0.69'))throw new Error('1.0.69 missing');
          NODE
          curl -fsSL "$PREVIEW_URL/" -o page.html
          grep -q "NM7 TV" page.html
      - name: Playlist smoke
        run: |
          set -euxo pipefail
          curl -fsSL "$PREVIEW_URL/api/playlist?source=tv" -o tv.json
          node - <<'NODE'
          const d=require('./tv.json');
          if(!d.channels || d.channels.length<400)throw new Error('too few channels: '+(d.channels||[]).length);
          const n=s=>String(s||'').toLowerCase();
          function find(x){return d.channels.find(c=>n(c.name).includes(x)||n(c.tvgId).includes(x))}
          const v=find('vtv1'),sp=find('on sports'),fo=find('on football');
          if(!v)throw new Error('VTV1 missing');
          if(!sp)throw new Error('ON Sports missing');
          if(!fo)throw new Error('ON Football missing');
          if(!v.candidates.some(x=>x.type==='dash'))throw new Error('VTV1 DASH missing');
          if(!fo.candidates.some(x=>x.type==='dash'))throw new Error('ON Football DASH missing');
          console.log({channels:d.channels.length,VTV1:v,ON_SPORTS:sp,ON_FOOTBALL:fo});
          NODE
      - name: Playwright install
        run: |
          npm init -y >/dev/null 2>&1
          npm i playwright@1.52.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
      - name: Browser navigation smoke
        run: |
          set -euxo pipefail
          node - <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1920,height:1080}});
            const errors=[];page.on('pageerror',e=>errors.push(String(e)));
            await page.goto(process.env.PREVIEW_URL,{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForTimeout(5000);
            const info=await page.evaluate(()=>({
              title:document.title,
              cards:document.querySelectorAll('.card').length,
              focused:(document.querySelector('.card.focus')||{}).textContent||'',
              dash:typeof window.dashjs,
              hls:typeof window.Hls
            }));
            console.log(info);
            if(errors.length)throw new Error('page errors: '+errors.join('\\n'));
            if(info.cards<1)throw new Error('no channel cards rendered');
            await page.keyboard.press('ArrowRight');
            await page.waitForTimeout(100);
            await page.keyboard.press('ArrowRight');
            await page.waitForTimeout(100);
            console.log('focusAfterRight=',await page.locator('.card.focus').textContent());
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
  cdn:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ua:
          - "Mozilla/5.0 (SMART-TV; LINUX; Tizen 3.0)"
          - "Mozilla/5.0 (Linux; Android 10; NM7-TV)"
          - "ExoPlayerLib/2.18.1 (Linux; Android 10)"
          - "VLC/3.0.21 LibVLC/3.0.21"
        ref:
          - ""
          - "https://vtvgo.vn/"
    steps:
      - name: Probe Seenow
        run: |
          set +e
          UA='\${{ matrix.ua }}'; REF='\${{ matrix.ref }}'
          if [ -n "$REF" ]; then R=(--referer "$REF"); else R=(); fi
          curl -sS -D h1 -o b1 --max-time 20 -A "$UA" "\${R[@]}" "https://livevlisctcdnw.seenow.vn/livesnv2/VTV1_HD/manifest.mpd"
          echo "UA=$UA REF=$REF"; head -n1 h1; grep -i '^content-type:' h1 || true; head -c120 b1 | tr '\\n' ' '; echo
          curl -sS -D h2 -o b2 --max-time 20 -A "$UA" "\${R[@]}" "https://livevlisctcdnw.seenow.vn/mean/BONGDA_HD/manifest.mpd"
          head -n1 h2; grep -i '^content-type:' h2 || true; head -c120 b2 | tr '\\n' ' '; echo
