name: NM7 TV Web 1.0.69 local browser E2E

on:
  push:
    branches: ["feature/web-tv-1.0.69-from-stable-old"]
  workflow_dispatch:

concurrency:
  group: nm7-tv-local-e2e
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate ES5 application script
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path("web-tv/index.html").read_text(encoding="utf-8")
          scripts=re.findall(r"<script(?:[^>]*)>([\\s\\S]*?)</script>",s,re.I)
          Path("/tmp/nm7-browser.js").write_text("\n;\n".join(scripts),encoding="utf-8")
          PY
          node --check /tmp/nm7-browser.js
          if grep -q "Chờ xác nhận phát" /tmp/nm7-browser.js; then exit 1; fi
          if grep -qE "\\b(const|let)\\b|=>" /tmp/nm7-browser.js; then exit 1; fi

      - name: Install browser test dependencies
        run: |
          set -euxo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 hls.js@0.14.17 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Generate local HLS and DASH fixtures
        run: |
          set -euxo pipefail
          mkdir -p e2e
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc=size=640x360:rate=25 -f lavfi -i sine=frequency=880:sample_rate=48000 -t 8 -c:v libx264 -pix_fmt yuv420p -preset veryfast -g 50 -c:a aac -b:a 96k -f hls -hls_time 2 -hls_list_size 0 e2e/test-hls.m3u8
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc=size=640x360:rate=25 -f lavfi -i sine=frequency=440:sample_rate=48000 -t 8 -c:v libx264 -pix_fmt yuv420p -preset veryfast -g 50 -c:a aac -b:a 96k -seg_duration 2 -use_timeline 1 -use_template 1 -f dash e2e/test-dash.mpd
          cp node_modules/hls.js/dist/hls.min.js e2e/hls.min.js
          python3 - <<'PY'
          import json
          ch=[
            {"id":"VTV1HD","name":"VTV1","group":"VTV","logo":"","candidates":[{"url":"/test-dash.mpd","type":"dash"}]},
            {"id":"ONSPORTS","name":"VTVCab 3 - ON Sports HD","group":"VTVCab","logo":"","candidates":[{"url":"/test-hls.m3u8","type":"hls"}]},
            {"id":"ONFOOTBALL","name":"VTVCab 16 - ON Football HD","group":"VTVCab","logo":"","candidates":[{"url":"/test-dash.mpd","type":"dash"}]}
          ]
          with open("e2e/playlist.json","w") as f: json.dump({"channels":ch},f)
          PY

      - name: Browser E2E with local fixtures
        run: |
          set -euxo pipefail
          node <<'NODE' > /tmp/server.log 2>&1 &
          const http=require('http'),fs=require('fs'),path=require('path');
          const root=process.cwd();
          const mime={'.html':'text/html; charset=utf-8','.js':'application/javascript','.m3u8':'application/vnd.apple.mpegurl','.mpd':'application/dash+xml','.m4s':'video/iso.segment','.ts':'video/mp2t','.mp4':'video/mp4','.json':'application/json','.png':'image/png','.webp':'image/webp'};
          const server=http.createServer((req,res)=>{
            const u=new URL(req.url,'http://127.0.0.1');
            let file=null;
            if(u.pathname==='/')file='web-tv/index.html';
            else if(u.pathname==='/web-tv/dash.all.min.js')file='web-tv/dash.all.min.js';
            else if(u.pathname==='/web-tv/hls.min.js')file='e2e/hls.min.js';
            else if(u.pathname==='/api/playlist')file='e2e/playlist.json';
            else if(u.pathname.startsWith('/e2e/'))file=u.pathname.slice(1);
            else if(u.pathname==='/test-hls.m3u8'||u.pathname==='/test-dash.mpd')file='e2e'+u.pathname;
            else {
              res.statusCode=404;return res.end('not found');
            }
            const p=path.join(root,file);
            try{const data=fs.createReadStream(p);res.setHeader('Content-Type',mime[path.extname(p)]||'application/octet-stream');data.pipe(res);data.on('error',()=>{res.statusCode=404;res.end()})}catch(e){res.statusCode=404;res.end()}
          });
          server.listen(4173,'127.0.0.1');
          NODE
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break || sleep 1; done
          node <<'NODE'
          const { chromium }=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--autoplay-policy=no-user-gesture-required','--disable-gpu']});
            const page=await browser.newPage({viewport:{width:1920,height:1080}});
            const errors=[];
            page.on('pageerror',e=>errors.push('pageerror: '+e.message));
            page.on('console',m=>{if(m.type()==='error')errors.push('console: '+m.text())});
            await page.goto('http://127.0.0.1:4173/?e2e=1',{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForSelector('.card',{timeout:15000});
            const cards=await page.locator('.card').count();
            if(cards<3)throw new Error('expected 3 cards, got '+cards);

            // RIGHT moves; LEFT back to first and LEFT again opens menu.
            await page.evaluate(()=>document.dispatchEvent(new KeyboardEvent('keydown',{key:'ArrowRight',keyCode:39,which:39,bubbles:true})));
            await page.waitForTimeout(100);
            if(!(await page.locator('.card.focus').count()))throw new Error('RIGHT focus failed');
            await page.evaluate(()=>{
              document.dispatchEvent(new KeyboardEvent('keydown',{key:'ArrowLeft',keyCode:37,which:37,bubbles:true}));
              document.dispatchEvent(new KeyboardEvent('keydown',{key:'ArrowLeft',keyCode:37,which:37,bubbles:true}));
            });
            await page.waitForTimeout(100);
            if(await page.locator('#menu:not(.hidden)').count()!==1)throw new Error('LEFT menu open failed');
            await page.evaluate(()=>document.dispatchEvent(new KeyboardEvent('keydown',{key:'ArrowDown',keyCode:40,which:40,bubbles:true})));
            await page.waitForTimeout(80);
            if(await page.locator('#menu .mi.focus').count()!==1)throw new Error('DOWN menu focus failed');
            await page.evaluate(()=>document.dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',keyCode:27,which:27,bubbles:true})));
            await page.waitForTimeout(80);

            async function playAndCheck(label){
              await page.evaluate(name=>{window.__TEST_PLAY=name},label);
            }

            // Select VTV1 (DASH), close with Escape only if needed, then inspect video.
            await page.evaluate(()=>{document.dispatchEvent(new KeyboardEvent('keydown',{key:'Enter',keyCode:13,which:13,bubbles:true}))});
            await page.waitForSelector('#player:not(.hidden)',{timeout:3000});
            await page.waitForTimeout(5000);
            let dash=await page.evaluate(()=>{const v=document.querySelector('#video');return {paused:v.paused,t:v.currentTime,ready:v.readyState,src:v.currentSrc||v.src,error:v.error?{code:v.error.code,message:v.error.message}:null}});
            console.log('DASH_MEDIA='+JSON.stringify(dash));
            if(!(dash.currentTime>0&&dash.ready>=2))throw new Error('local DASH did not play');

            // Back to home, move DOWN to VTVCab row and select ON Sports HLS.
            await page.evaluate(()=>document.dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',keyCode:27,which:27,bubbles:true})));
            await page.waitForTimeout(100);
            await page.evaluate(()=>document.dispatchEvent(new KeyboardEvent('keydown',{key:'ArrowDown',keyCode:40,which:40,bubbles:true})));
            await page.waitForTimeout(100);
            await page.evaluate(()=>document.dispatchEvent(new KeyboardEvent('keydown',{key:'ArrowRight',keyCode:39,which:39,bubbles:true})));
            await page.waitForTimeout(100);
            await page.evaluate(()=>document.dispatchEvent(new KeyboardEvent('keydown',{key:'Enter',keyCode:13,which:13,bubbles:true})));
            await page.waitForSelector('#player:not(.hidden)',{timeout:3000});
            await page.waitForTimeout(5000);
            let hls=await page.evaluate(()=>{const v=document.querySelector('#video');return {paused:v.paused,t:v.currentTime,ready:v.readyState,src:v.currentSrc||v.src,error:v.error?{code:v.error.code,message:v.error.message}:null}});
            console.log('HLS_MEDIA='+JSON.stringify(hls));
            if(!(hls.currentTime>0&&hls.ready>=2))throw new Error('local HLS did not play');
            if(errors.length)throw new Error('browser errors: '+JSON.stringify(errors));
            console.log('REMOTE_AND_PLAYER=PASS');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
