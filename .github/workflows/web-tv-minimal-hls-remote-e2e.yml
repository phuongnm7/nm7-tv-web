name: NM7 TV Web Browser remote + HLS E2E

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 hls.js@1.7.3 http-server@14.1.1 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Generate HLS fixture
        run: |
          mkdir -p e2e-site/assets
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc=size=640x360:rate=25 -t 8 -c:v libx264 -profile:v baseline -level 3.1 -pix_fmt yuv420p -preset veryfast -g 50 -f hls -hls_time 2 -hls_list_size 0 e2e-site/test-hls.m3u8
          cp e2e-site/test-hls*.ts e2e-site/ 2>/dev/null || true
          cp node_modules/hls.js/dist/hls.min.js e2e-site/hls.min.js
          cp web-tv/index.html e2e-site/index.html
          cp web-tv/app.js e2e-site/app.js
          cp web-tv/dash.all.min.js e2e-site/dash.all.min.js
          cp assets/nm7-default-background.webp e2e-site/assets/nm7-default-background.webp
          cp assets/nm7-main-logo.png e2e-site/assets/nm7-main-logo.png

      - name: Write fixture playlist and adapt page
        run: |
          python3 - <<'PY'
          import json
          with open("e2e-site/playlist.json","w") as f:
            json.dump({"channels":[
              {"id":"A","name":"Kênh A","group":"Nhóm 1","logo":"","candidates":[{"url":"/test-hls.m3u8","hls":True}]},
              {"id":"B","name":"Kênh B","group":"Nhóm 1","logo":"","candidates":[{"url":"/test-hls.m3u8","hls":True}]},
              {"id":"C","name":"Kênh C","group":"Nhóm 2","logo":"","candidates":[{"url":"/test-hls.m3u8","hls":True}]}
            ]},f,ensure_ascii=False)
          p="e2e-site/index.html"
          s=open(p,encoding="utf-8").read()
          s=s.replace('<script src="https://cdn.jsdelivr.net/npm/hls.js@1.7.3/dist/hls.min.js"></script>','<script src="/hls.min.js"></script>')
          s=s.replace('<script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.8.2/dist/mpegts.min.js"></script>','')
          s=s.replace('<script src="https://cdn.jsdelivr.net/npm/shaka-player@4.16.51/dist/shaka-player.compiled.js"></script>','')
          open(p,"w",encoding="utf-8").write(s)
          p="e2e-site/app.js"
          s=open(p,encoding="utf-8").read()
          s=s.replace("tv:'/api/playlist?source=tv'","tv:'/playlist.json'")
          s=s.replace("sport:'/api/playlist?source=sport'","sport:'/playlist.json'")
          open(p,"w",encoding="utf-8").write(s)
          PY
          node --check e2e-site/app.js

      - name: Browser remote + HLS
        run: |
          set -euxo pipefail
          cat > e2e-site/server.cjs <<'NODE_SERVER'
          const http=require('http'),fs=require('fs'),path=require('path');
          const root=path.resolve('.');
          const types={'.html':'text/html; charset=utf-8','.js':'application/javascript; charset=utf-8','.json':'application/json; charset=utf-8','.m3u8':'application/vnd.apple.mpegurl','.ts':'video/mp2t','.webp':'image/webp','.png':'image/png'};
          const server=http.createServer((req,res)=>{
            let p=decodeURIComponent(new URL(req.url,'http://127.0.0.1').pathname);
            if(p==='/'||p==='')p='/index.html';
            const file=path.join(root,p.replace(/^\//,''));
            if(!file.startsWith(root)||!fs.existsSync(file)){res.writeHead(404);return res.end('not found')}
            const ext=path.extname(file),body=fs.readFileSync(file);
            res.writeHead(200,{'Content-Type':types[ext]||'application/octet-stream','Cache-Control':'no-store','Access-Control-Allow-Origin':'*'});
            res.end(body);
          });
          server.listen(4173,'127.0.0.1');
          NODE_SERVER
          (cd e2e-site && node server.cjs >/tmp/nm7-browser-e2e.log 2>&1) &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const b=await chromium.launch({headless:true,args:['--autoplay-policy=no-user-gesture-required','--disable-gpu']});

            const p=await b.newPage({viewport:{width:1920,height:1080}});
            p.on('console',m=>console.log('BROWSER_CONSOLE='+m.type()+':'+m.text()));
            p.on('pageerror',e=>console.log('BROWSER_PAGEERROR='+e.message));
            p.on('response',r=>{if(/test-hls|playlist\.json/.test(r.url()))console.log('BROWSER_RESPONSE='+r.status()+':'+r.url())});
            await p.goto('http://127.0.0.1:4173/?debug=1',{waitUntil:'domcontentloaded',timeout:30000});
            await p.waitForSelector('.card',{timeout:15000});
            const cards=await p.locator('.card').count();
            if(cards!==3)throw new Error('cards='+cards);
            const codec=await p.evaluate(()=>!!(window.MediaSource&&MediaSource.isTypeSupported&&MediaSource.isTypeSupported('video/mp4;codecs="avc1.42c01f"')));
            console.log('MSE_AVC_SUPPORTED='+codec);

            let init=await p.evaluate(()=>({tag:document.activeElement?.tagName,row:document.activeElement?.dataset?.row,col:document.activeElement?.dataset?.col}));
            if(init.tag!=='BUTTON'||init.row!=='0'||init.col!=='0')throw new Error('initial focus '+JSON.stringify(init));

            await p.keyboard.press('ArrowRight');
            await p.waitForTimeout(100);
            let right=await p.evaluate(()=>({row:document.activeElement?.dataset?.row,col:document.activeElement?.dataset?.col}));
            if(right.row!=='0'||right.col!=='1')throw new Error('RIGHT focus '+JSON.stringify(right));

            await p.keyboard.press('ArrowLeft');
            await p.waitForTimeout(50);
            await p.keyboard.press('ArrowLeft');
            await p.waitForTimeout(100);
            if(await p.locator('#side:not(.hidden)').count()!==1)throw new Error('LEFT did not open menu');

            await p.keyboard.press('ArrowDown');
            await p.waitForTimeout(50);
            let mi=await p.evaluate(()=>document.activeElement?.dataset?.menu);
            if(mi!=='1')throw new Error('menu DOWN focus='+mi);

            await p.keyboard.press('Escape');
            await p.waitForTimeout(100);
            if(await p.locator('#side:not(.hidden)').count()!==0)throw new Error('menu did not close');

            await p.keyboard.press('Enter');
            await p.waitForSelector('#player:not(.hidden)',{timeout:3000});
            await p.waitForFunction(()=>{const v=document.querySelector('#video');return !!v&&(v.readyState>=2&&v.currentTime>0)},null,{timeout:15000});
            const media=await p.evaluate(()=>{const v=document.querySelector('#video');return {t:v.currentTime,ready:v.readyState,paused:v.paused,src:v.currentSrc||v.src,network:v.networkState,readyState:v.readyState,err:v.error?{code:v.error.code,msg:v.error.message}:null,hls:!!window.Hls,hlsSupported:!!(window.Hls&&Hls.isSupported()),ms:!!window.MediaSource}});
            console.log('REMOTE_OK='+JSON.stringify({initial:init,right,menuDown:mi}));
            console.log('HLS='+JSON.stringify(media));
            if(!codec){
              console.log('HLS_NETWORK_ONLY_OK=Codec decode unavailable in CI Chromium; navigation, manifest and fragment requests were exercised.');
            } else if(!(media.t>0&&media.ready>=2)){
              throw new Error('HLS playback failed '+JSON.stringify(media));
            }
            await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
