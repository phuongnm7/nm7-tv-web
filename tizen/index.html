.card{position:relative;appearance:none;-webkit-appearance:none;flex:0 0 138px;width:138px;height:76px;border:1px solid #334f6a83;border-radius:22px;background:linear-gradient(90deg,#c72a3749,#d9182434);padding:6px 10px 2px;outline:none;display:flex;flex-direction:column;align-items:stretch;justify-content:stretch;transition:transform .12s ease,background .12s ease,border-color .12s ease;z-index:1;color:#fff;font:inherit;text-align:center;overflow:hidden;cursor:pointer}

.thumb img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}

.hidden{display:none!important}

#homeTabs{position:relative;height:64px;width:100%;display:flex;align-items:center;padding:6px 0;z-index:10}

#ytTab .ytPlay:after{content:"";position:absolute;left:18px;top:9px;border-left:13px solid #fff;border-top:7px solid transparent;border-bottom:7px solid transparent}

#homeTitle{position:absolute;left:50%;top:0;transform:translateX(-50%);height:64px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#c1cad6;text-shadow:0 2px 4px #0007;pointer-events:none;white-space:nowrap}

#player{position:absolute;z-index:60;inset:0;background:#000}
#video{width:100%;height:100%;background:#000;object-fit:contain}
#status{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:#c5cad1;font-size:26px;padding:70px;pointer-events:none;white-space:pre-wrap}
#playerTop{position:absolute;left:0;right:0;top:0;z-index:4;padding:22px 32px;background:linear-gradient(#000d,transparent)}

#menu h2{margin:0 0 15px;font-size:28px}
.mi{width:100%;height:48px;padding:10px 16px;margin:4px 0;border:0;border-radius:9px;background:transparent;color:#fff;text-align:left;font-size:18px;cursor:pointer;outline:none}.mi:focus,.mi.focus{background:#fff;color:#000}
.mi.focus{background:#fff;color:#000}

.input{width:100%;background:#07090d;color:#fff;border:2px solid #4e5662;border-radius:8px;padding:12px;font-size:21px}

.db{border:0;border-radius:8px;background:#303741;color:#fff;padding:11px 17px;font-size:18px}

<script>
(function(){
var VERSION='1.0.69';
var SRC=[{id:'tv',name:'Truyền hình',url:'https://nm7-tv-web.vercel.app/api/playlist?source=tv'},{id:'sport',name:'Thể thao',url:'https://nm7-tv-web.vercel.app/api/playlist?source=sport'}];
var S={source:0,list:[],groups:[],row:0,col:0,top:0,zone:'top',view:null,q:'',fav:[],recent:[],menu:0,mode:'home',player:false,ctrl:false,cp:2,dialog:null,current:null,candidateIndex:0,hls:null,dash:null,avplay:false,playerGeneration:0,cacheAge:0,proxyAttempt:false,watchdog:null,attemptNo:0,advanceBusy:false,flv:null,dashBase:''};
function $(id){return document.getElementById(id)}
var toastTimer;
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function toast(s){$('toast').textContent=s;$('toast').className='show';clearTimeout(toastTimer);toastTimer=setTimeout(function(){$('toast').className=''},2800)}
function saveUser(){try{localStorage.setItem('nm7:fav',JSON.stringify(S.fav));localStorage.setItem('nm7:recent',JSON.stringify(S.recent.slice(0,80)));}catch(e){}}
function restoreUser(){try{S.fav=JSON.parse(localStorage.getItem('nm7:fav')||'[]');S.recent=JSON.parse(localStorage.getItem('nm7:recent')||'[]')}catch(e){S.fav=[];S.recent=[]}}
function cacheKey(){return 'nm7:web:'+S.source}
function saveListCache(){try{localStorage.setItem(cacheKey(),JSON.stringify({at:Date.now(),channels:S.list}))}catch(e){}}
function readListCache(){try{var x=JSON.parse(localStorage.getItem(cacheKey())||'null');return x&&x.channels&&x.channels.length?x:null}catch(e){return null}}
function norm(c){c=c||{};if(!c.candidates)c.candidates=[];return c}
function setLabel(){var n=SRC[S.source].name;$('src').textContent=n;$('count').textContent=S.list.length?('· '+S.list.length+' kênh'):''}
function rebuildGroups(){var seen={},i,g;S.groups=[];for(i=0;i<S.list.length;i++){g=S.list[i].group||'Khác';if(!seen[g]){seen[g]=1;S.groups.push(g)}}S.row=Math.min(S.row,Math.max(0,S.groups.length-1));S.col=0}
function currentRows(){return S.view||S.list}
function channelsInGroup(g){var a=currentRows(),b=[],i;for(i=0;i<a.length;i++)if((a[i].group||'Khác')===g)b.push(a[i]);return b}
function currentChannel(){var a=channelsInGroup(S.groups[S.row]||'');return a[S.col]||a[0]||null}
function nearestColumn(oldCol,g){var n=channelsInGroup(g).length;return n?Math.min(oldCol,n-1):0}
function focusRemoteSink(){
 var s=$('remoteSink'),b=document.body;
 if(s)try{s.focus()}catch(e){}
 if(document.activeElement!==s&&b)try{b.focus()}catch(e2){}
}
function focusTop(){var y=$('ytTab'),a=$('appShortcut');if(y)y.classList.toggle('focus',S.zone==='top'&&S.top===0);if(a)a.classList.toggle('focus',S.zone==='top'&&S.top===1);focusRemoteSink()}
function setTopFocus(i){S.zone='top';S.top=Math.max(0,Math.min(1,i));document.querySelectorAll('.card.focus').forEach(function(x){x.classList.remove('focus')});focusTop();return true}
function focusElement(){
 if(S.zone==='top'){focusTop();return}
 var el=document.querySelector('.card.focus');
 if(!el){var all=document.querySelectorAll('.card');el=all[0]||null;if(el)el.classList.add('focus')}
 if(el)try{el.scrollIntoView({behavior:'auto',block:'nearest',inline:'center'})}catch(e){}
 focusRemoteSink();
}
function activateLogos(){var imgs=document.querySelectorAll('img[data-src]'),i,im,r;for(i=0;i<imgs.length;i++){im=imgs[i];r=parseInt(im.getAttribute('data-row')||'0',10);if(Math.abs(r-S.row)<=2){im.src=im.getAttribute('data-src');im.removeAttribute('data-src')}}}
function setHomeFocus(rr,cc){
 rr=Math.max(0,Math.min(S.groups.length-1,rr));
 var rows=channelsInGroup(S.groups[rr]||'');
 if(!rows.length)return false;
 cc=Math.max(0,Math.min(rows.length-1,cc));
 S.zone='channel';S.row=rr;S.col=cc;
 var el=document.querySelector('.card[data-row="'+rr+'"][data-col="'+cc+'"]');
 if(!el){render();focusRemoteSink();return true}
 document.querySelectorAll('.card.focus').forEach(function(x){if(x!==el)x.classList.remove('focus')});
 el.classList.add('focus');
 try{el.scrollIntoView({behavior:'auto',block:'nearest',inline:'center'})}catch(e){}
 activateLogos();
 focusRemoteSink();
 return true;
}
function logoOverride(c){
 var id=String(c&&c.id||'').toLowerCase().replace(/\s+/g,'').trim();
 var name=String(c&&c.name||'').toLowerCase().replace(/_/g,' ').replace(/-/g,' ').replace(/\s+/g,' ').trim();
 var group=String(c&&c.group||'').toLowerCase().replace(/\s+/g,'').trim();
 if(group.indexOf('vtvcab')<0&&name.indexOf('vtvcab')<0)return '';
 if(id==='vtvcab3hd'||name.indexOf('vtvcab 3')>=0||name.indexOf('vtvcab3')>=0||name.indexOf('on sports')>=0)return 'https://cdn.hqth.me/logo/thumbs/14.png';
 if(id==='vtvcab6hd'||name.indexOf('vtvcab 6')>=0||name.indexOf('vtvcab6')>=0||name.indexOf('on sports+')>=0||name.indexOf('onsports+')>=0)return 'https://cdn.hqth.me/logo/thumbs/17.png';
 if(id==='vtvcab16hd'||name.indexOf('vtvcab 16')>=0||name.indexOf('vtvcab16')>=0||name.indexOf('on football')>=0||name.indexOf('onfootball')>=0)return 'https://cdn.hqth.me/logo/thumbs/24.png';
 if(id==='vtvcab18hd'||name.indexOf('vtvcab 18')>=0||name.indexOf('vtvcab18')>=0||name.indexOf('on sports news')>=0||name.indexOf('onsports news')>=0)return 'https://cdn.hqth.me/logo/thumbs/26.png';
 return '';
}
function logoSource(c){
 var u=logoOverride(c)||String(c&&c.logo||'').trim();
 if(!u)return '';
 if(/^https?:\/\//i.test(u))return 'https://nm7-tv-web.vercel.app/api/image?u='+encodeURIComponent(u)+'&r='+encodeURIComponent(c&&c.ref||'')+'&ua='+encodeURIComponent(c&&c.ua||'');
 return u
}
function render(){
 var h=$('home'),html='',start=0,end=S.groups.length,r,g,a,i,c,selected;
 html+='<div id="homeTabs">';
 html+='<div id="ytTab" class="homeTab '+(S.zone==='top'&&S.top===0?'focus':'')+'" tabindex="-1" role="button" aria-label="YouTube"><span class="ytPlay"></span><span class="ytText">YouTube</span></div>';
 html+='<div id="appShortcut" class="homeTab '+(S.zone==='top'&&S.top===1?'focus':'')+'" tabindex="-1" role="button" aria-label="Chọn ứng dụng"><span class="plus" aria-hidden="true"></span><span class="label">Chọn ứng dụng</span></div>';
 html+='<div id="homeTitle">Danh sách kênh TV</div></div>';
 for(r=start;r<end;r++){
   g=S.groups[r];a=channelsInGroup(g);if(!a.length)continue;
   html+='<section class="row" data-row="'+r+'"><h2>'+esc(g)+'</h2><div class="cards">';
   for(i=0;i<a.length;i++){
     c=norm(a[i]);selected=(r===S.row&&i===S.col);
     html+='<div class="card '+(selected?'focus':'')+'" tabindex="-1" role="button" data-row="'+r+'" data-col="'+i+'" aria-label="'+esc(c.name)+'">';
     html+='<div class="thumb">';
     var logo=logoSource(c);
     if(logo)html+='<img loading="lazy" data-row="'+r+'" data-src="'+esc(logo)+'" onerror="this.style.display=\'none\';this.parentNode.innerHTML=\'<span>TV</span>\'">';
     else html+='<span>TV</span>';
     html+='</div><div class="name">'+esc(c.name)+'</div>'+(S.fav.indexOf(c.id)>=0?'<span class="star">★</span>':'')+'</div>';
   }
   html+='</div></section>';
 }
 h.innerHTML=html||'<div class="empty">Không có kênh phù hợp</div>';
 var yt=$('ytTab');if(yt)yt.onclick=function(){setTopFocus(0);toast('YouTube trên Web đang ở chế độ trình duyệt')};
 var app=$('appShortcut');if(app)app.onclick=function(){setTopFocus(1);toast('Chọn ứng dụng chỉ khả dụng trên Android TV')};
 focusTop();
 h.querySelectorAll('.card').forEach(function(card){
   card.onclick=function(){
     var rr=Number(card.getAttribute('data-row')||0),cc=Number(card.getAttribute('data-col')||0),aa=channelsInGroup(S.groups[rr]||'');
     S.row=rr;S.col=cc;if(aa[cc])play(aa[cc]);
   };
 });
 activateLogos();focusElement()
}
function parseM3UText(t){
 var lines=String(t||'').replace(/^\\uFEFF/,'').split(/\\r?\\n/),out=[],m=null,ua='',ref='',manifestType='',licenseType='',licenseKey='',i,l,p,h,um,rm,mt,km,kv;
 for(i=0;i<lines.length;i++){
  l=lines[i].trim();
  if(l.indexOf('#EXTINF:')===0){
   if(m&&m.candidates.length)out.push(m);
   p=l.indexOf(',');h=p<0?l:l.slice(0,p);
   m={name:p<0?'Kênh':l.slice(p+1).trim(),group:(/group-title="([^"]*)"/i.exec(h)||[])[1]||'Khác',logo:(/tvg-logo="([^"]*)"/i.exec(h)||[])[1]||'',id:(/tvg-id="([^"]*)"/i.exec(h)||[])[1]||'',candidates:[]};
   ua='';ref='';manifestType='';licenseType='';licenseKey='';
  }else if(m&&l.indexOf('#EXTVLCOPT:')===0){
   um=/http-user-agent=(?:"([^"]+)"|([^\s]+))/i.exec(l);rm=/(?:http-referrer|http-referer)=(?:"([^"]+)"|([^\s]+))/i.exec(l);
   if(um)ua=um[1]||um[2];if(rm)ref=rm[1]||rm[2];
  }else if(m&&l.indexOf('#KODIPROP:')===0){
   mt=/inputstream\.adaptive\.manifest_type=(.+)/i.exec(l);km=/inputstream\.adaptive\.license_type=(.+)/i.exec(l);kv=/inputstream\.adaptive\.license_key=(.+)/i.exec(l);
   if(mt)manifestType=mt[1].trim();if(km)licenseType=km[1].trim();if(kv)licenseKey=kv[1].trim();
  }else if(m&&l.charAt(0)!=='#'&&/^(https?|rtsp|rtmp|udp):/i.test(l)){
   var ps=l.split('|'),url=ps[0],r=ref,u=ua;
   for(var j=1;j<ps.length;j++){if(/^referer=/i.test(ps[j]))r=ps[j].slice(ps[j].indexOf('=')+1);if(/^http-user-agent=/i.test(ps[j]))u=ps[j].slice(ps[j].indexOf('=')+1)}
   var mm=manifestType.toLowerCase(),cand={url:url,ref:r,ua:u,type:mm==='mpd'?'dash':mm==='hls'?'hls':'',dash:mm==='mpd',hls:mm==='hls'||/\.m3u8(?:$|\?)/i.test(url)||/\.m3u(?:$|\?)/i.test(url)||/playlist|index\.m3u|manifest/i.test(url)};
   if(licenseType&&licenseKey)cand.drm={type:licenseType,key:licenseKey};
   m.candidates.push(cand);
  }
 }
 if(m&&m.candidates.length)out.push(m);
 for(i=0;i<out.length;i++){out[i].id=out[i].id||out[i].name}
 return out;
}
function parseUserList(a){S.list=[];for(var i=0;i<a.length;i++)S.list.push(norm(a[i]));S.view=null;rebuildGroups();setLabel();render()}
function fetchSource(n){
 S.source=n;var cached=readListCache(),had=!!cached;
 if(cached){S.list=cached.channels||[];S.view=null;rebuildGroups();setLabel();render();toast('Đã mở cache · đang cập nhật…')}
 else {$('home').innerHTML='<div class="empty">Đang tải '+esc(SRC[n].name)+'…</div>';$('src').textContent=SRC[n].name;$('count').textContent=''}
 fetch(SRC[n].url,{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(function(data){
   if(!data||!data.channels)throw new Error('Playlist response không hợp lệ');
   parseUserList(data.channels);saveListCache();toast('Đã cập nhật '+S.list.length+' kênh');
 }).catch(function(e){
   if(S.source!==0||n!==0){if(!had)toast('Không tải được playlist: '+e.message);return}

function ctrlAction(){var b=document.querySelectorAll('.cb'),a=b[S.cp]?b[S.cp].getAttribute('data-a'):'';if(a==='back'){stop();render();setTopFocus(0)}else if(a==='back10')seek(-10);else if(a==='fwd30')seek(30);else if(a==='play'){if(isTizenAvplay()&&S.player){try{var st=webapis.avplay.getState();if(st==='PLAYING')webapis.avplay.pause();else webapis.avplay.play()}catch(e){}}else{var v=$('video');v.paused?v.play():v.pause()}}else if(a==='next'){switchChannelRelative(1)}}

function remoteCode(e){
 var k=Number(e&&(e.keyCode!=null?e.keyCode:(e.which!=null?e.which:e.charCode))||0);
 var key=String(e&&e.key||'').toLowerCase(),code=String(e&&e.code||'').toLowerCase(),id=String(e&&e.keyIdentifier||'').toLowerCase();
 if(key==='arrowleft'||key==='left'||code==='arrowleft'||id==='left')return 37;
 if(key==='arrowright'||key==='right'||code==='arrowright'||id==='right')return 39;
 if(key==='arrowup'||key==='up'||code==='arrowup'||id==='up')return 38;
 if(key==='arrowdown'||key==='down'||code==='arrowdown'||id==='down')return 40;
 if(key==='enter'||key==='select'||key==='ok'||key==='numpadenter')return 13;
 if(key==='escape'||key==='esc')return 27;
 if(key==='back'||key==='backspace'||key==='return')return 10009;
 if(k===10009)return 10009;
 if(k===412||key==='mediarewind')return 412;
 if(k===417||key==='mediafastforward')return 417;
 if(k===10252||key==='mediaplaypause')return 10252;
 if(k===427||key==='channelup')return 427;
 if(k===428||key==='channeldown')return 428;
 return k;
}
function stopRemoteEvent(e){try{if(e&&e.cancelable)e.preventDefault()}catch(x){}try{e.stopImmediatePropagation()}catch(x){}try{e.stopPropagation()}catch(x){}}
function handleRemote(e){
 if(e&&e.__nm7RemoteHandled)return false;
 if(e&&e.repeat)return true;
 var k=remoteCode(e),handled=false;
 if(S.dialog){
   if(k===13||k===461||k===10009||k===27){$('dlg').className='hidden';S.dialog=null;render();handled=true}
 }else if(S.player){
   if(k===461||k===10009||k===27){
     if(S.ctrl){S.ctrl=false;$('ctrl').className='hidden';focusElement()}else{stop();render();setTopFocus(0)}
     handled=true
   }else if(S.ctrl){
     if(k===37){S.cp=Math.max(0,S.cp-1);focusCtrl();handled=true}
     else if(k===39){S.cp=Math.min(4,S.cp+1);focusCtrl();handled=true}
     else if(k===13){ctrlAction();handled=true}
     else if(k===38||k===40){S.cp=k===38?Math.max(0,S.cp-1):Math.min(4,S.cp+1);focusCtrl();handled=true}
   }else{
     if(k===13||k===10252){showCtrl();handled=true}
     else if(k===37||k===412){seek(-10);handled=true}
     else if(k===39||k===417){seek(30);handled=true}
     else if(k===38||k===427){switchChannelRelative(-1);handled=true}
     else if(k===40||k===428){switchChannelRelative(1);handled=true}
   }
 }else if(S.mode==='menu'){
   if(k===461||k===10009||k===27){closeMenu();handled=true}
   else if(k===38||k===40){var mi=menuItems();S.menu=Math.max(0,Math.min(mi.length-1,S.menu+(k===38?-1:1)));drawMenuFocus();handled=true}
   else if(k===13||k===39){selectMenu();handled=true}
 }else{
   if(k===461||k===10009||k===27){openMenu();handled=true}
   else if(S.zone==='top'){
     if(k===37){S.top=Math.max(0,S.top-1);focusTop();handled=true}
     else if(k===39){S.top=Math.min(1,S.top+1);focusTop();handled=true}
     else if(k===40){var fl=channelsInGroup(S.groups[0]||'').length;if(fl)setHomeFocus(0,Math.min(S.top,fl-1));handled=true}
     else if(k===13){if(S.top===0)toast('YouTube trên Web đang ở chế độ trình duyệt');else toast('Chọn ứng dụng chỉ khả dụng trên Android TV');handled=true}
   }else{
     var rows=channelsInGroup(S.groups[S.row]||''),targetRow,targetCol;
     if(k===37){if(S.col===0)openMenu();else setHomeFocus(S.row,S.col-1);handled=true}
     else if(k===39){if(rows.length)setHomeFocus(S.row,(S.col+1)%rows.length);handled=true}
     else if(k===38){
       if(S.row===0)setTopFocus(Math.max(0,Math.min(1,S.col)));
       else{targetRow=Math.max(0,S.row-1);targetCol=nearestColumn(S.col,S.groups[targetRow]||'');setHomeFocus(targetRow,targetCol)}
       handled=true
     }else if(k===40){targetRow=Math.min(S.groups.length-1,S.row+1);targetCol=nearestColumn(S.col,S.groups[targetRow]||'');setHomeFocus(targetRow,targetCol);handled=true}
     else if(k===13){play(currentChannel());handled=true}
     else if(k===8||k===403){var ch=currentChannel();if(ch){var fi=S.fav.indexOf(ch.id);if(fi<0)S.fav.push(ch.id);else S.fav.splice(fi,1);saveUser();render();toast(fi<0?'Đã thêm yêu thích':'Đã bỏ yêu thích')};handled=true}
   }
 }
 if(handled){if(e)e.__nm7RemoteHandled=true;stopRemoteEvent(e);return false}
 return true;
}
