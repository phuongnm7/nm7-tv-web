<title>NM7 TV Web 1.0.69</title>
<style>
:root{--navy:#07111F;--surface:#0E1C2E;--surface2:#14263C;--primary:#F5F8FC;--secondary:#9FB3C8;--accent:#37D6A6;--warn:#FFBD59}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--navy);color:var(--primary);font-family:Arial,Helvetica,sans-serif}
body{user-select:none}
button,input{font:inherit}
#root{position:relative;width:100%;height:100%;background:var(--navy) url("https://raw.githubusercontent.com/phuongnm7/nm7-tv-android/f79fc06009f20e0ac3a5859c0abcfd6ce70a6763/app/src/main/res/drawable/nm7_default_background_new.webp") center/cover no-repeat}
#shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(7,17,31,.87),rgba(7,17,31,.52) 44%,rgba(7,17,31,.72));pointer-events:none}
#header{position:absolute;z-index:10;left:0;right:0;top:0;height:64px;padding:6px 22px;display:grid;grid-template-columns:180px 84px 1fr 100px;gap:6px;align-items:center;background:linear-gradient(180deg,rgba(7,17,31,.94),rgba(7,17,31,.55),transparent)}
#youtubeTab,#shortcut{height:52px;border:2px solid transparent;border-radius:18px;background:transparent;color:var(--primary);display:flex;align-items:center;justify-content:center;outline:none}
#youtubeTab.focus,#shortcut.focus{background:rgba(41,139,168,.72);border-color:#A8E8FA}
#ytIcon{width:34px;height:24px;border-radius:7px;background:#FF0000;position:relative;display:inline-block;margin-right:9px;box-shadow:0 2px 6px #0008}
#ytIcon:after{content:"";position:absolute;left:13px;top:6px;border-left:10px solid white;border-top:6px solid transparent;border-bottom:6px solid transparent}
#youtubeTab span{font-size:17px;font-weight:700}
#shortcut{flex-direction:column}
#shortcut img{width:38px;height:38px;object-fit:contain}
#shortcut small{font-size:11px;color:var(--primary);line-height:12px}
#title{text-align:center;color:var(--secondary);font-size:18px;font-weight:700}
#clock{text-align:right;color:var(--primary);font-size:18px}
#main{position:absolute;inset:0;padding:70px 22px 22px;overflow:hidden}
#rows{height:100%;overflow-y:auto;overflow-x:hidden;padding-right:3px;scrollbar-width:none}
#rows::-webkit-scrollbar{display:none}
.group{margin:0 0 2px}
.groupTitle{height:34px;padding:8px 2px 5px;color:var(--primary);font-size:18px;font-weight:700}
.hrow{height:90px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;scroll-behavior:auto}
.hrow::-webkit-scrollbar{display:none}
.hinner{display:flex;align-items:center;height:90px;width:max-content;padding-right:18px}
.card{position:relative;flex:0 0 128px;width:128px;height:70px;margin-right:4px;border:0;background:transparent;outline:none;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;border-radius:12px}
.card.focus{z-index:4}
.cardName{width:100%;height:18px;margin-top:2px;text-align:center;font-size:11px;line-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--primary)}
.card.focus .cardName{font-weight:700}
.logoFrame{position:relative;width:60px;height:60px;display:flex;align-items:center;justify-content:center;overflow:visible}
.halo{position:absolute;width:60px;height:60px;border-radius:50%;background:rgba(64,169,255,.33);border:5px solid #2F9BFF;visibility:hidden}
.ring{position:absolute;width:54px;height:54px;border-radius:50%;border:2px solid #fff;visibility:hidden}
.card.focus .halo,.card.focus .ring{visibility:visible}
.logo{position:relative;z-index:2;width:48px;height:48px;border-radius:50%;object-fit:contain;display:block;background:transparent}
.badge{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#0E1C2E;border:1px solid #36516B;color:var(--accent);font-size:18px;font-weight:700}
.card.focus{transform:scale(1.12);transform-origin:center center;transition:transform .12s ease}
.card img{image-rendering:auto}
#empty{color:var(--secondary);font-size:20px;text-align:center;padding:80px 20px}
#sideShade{position:absolute;z-index:30;inset:0;background:rgba(0,0,0,.20);visibility:hidden}
#sideMenu{position:absolute;z-index:40;left:0;top:0;bottom:0;width:310px;padding:9px;background:rgba(7,17,31,.96);border-top-right-radius:22px;border-bottom-right-radius:22px;border:1px solid rgba(91,202,232,.2);box-shadow:20px 0 60px #0008;transform:translateX(-100%);transition:transform .12s ease}
#sideMenu.open{transform:translateX(0)}
#menuHead{height:64px;display:flex;align-items:center}
#menuHead img{width:54px;height:54px;object-fit:contain}
#menuHead span{margin-left:10px;font-size:19px;font-weight:700}
.menuList{overflow-y:auto;height:calc(100% - 92px);scrollbar-width:none}
.menuList::-webkit-scrollbar{display:none}
.menuItem{height:48px;margin-top:3px;border-radius:18px;padding:0 14px;display:flex;align-items:center;gap:10px;font-size:15px;color:var(--primary);outline:none}
.menuItem.focus{background:#D9298BA8;border:2px solid #A8E8FA}
.menuHint{position:absolute;bottom:10px;left:12px;right:12px;font-size:12px;color:var(--secondary)}
#player{position:absolute;z-index:60;inset:0;background:#000;display:none}
#player.open{display:block}
#video{position:absolute;inset:0;width:100%;height:100%;background:#000;object-fit:contain}
#playerInfo{position:absolute;z-index:3;left:22px;right:22px;top:18px;padding:8px 10px;background:linear-gradient(180deg,rgba(0,0,0,.78),transparent);pointer-events:none}
#playerName{font-size:22px;font-weight:700}
#playerStatus{font-size:15px;color:#B9C4D0;margin-top:4px;white-space:pre-wrap}
#controller{position:absolute;z-index:4;left:50%;bottom:28px;transform:translateX(-50%);display:none;background:rgba(16,20,24,.92);border-radius:12px;padding:10px;gap:8px}
#controller.open{display:flex}
.ctrl{border:0;border-radius:8px;background:#303742;color:white;padding:10px 16px;font-size:17px;outline:none}
.ctrl.focus{background:#fff;color:#000;outline:3px solid #fff}
#dialog{position:absolute;z-index:80;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center}
#dialog.open{display:flex}
#dialogBox{width:760px;max-width:88vw;background:#171C23;border-radius:14px;padding:26px}
#dialogBox h2{margin:0 0 16px;font-size:27px}
#searchInput{width:100%;height:50px;border:2px solid #4e5662;border-radius:8px;background:#07090D;color:#fff;padding:0 14px;font-size:20px;outline:none}
#toast{position:absolute;z-index:100;left:50%;bottom:24px;transform:translateX(-50%);background:rgba(18,24,33,.95);padding:11px 18px;border-radius:9px;font-size:17px;display:none;max-width:92vw;text-align:center}
#toast.show{display:block}
</style>

<script>
(function(){
var API_BASE=(/^https?:/i.test(location.protocol)?location.origin:'https://nm7-tv-web-git-feature-web-tv-browser-1069-and-8db876-phuongnm7.vercel.app');var API=API_BASE+'/api/playlist?source=tv',SPORT=API_BASE+'/api/playlist?source=sport';
var S={list:[],groups:[],groupIndex:0,colIndex:0,source:0,mode:'home',menuIndex:0,search:'',fav:[],recent:[],player:false,controller:false,controllerIndex:2,current:null,candidates:[],candidateIndex:0,proxyAttempt:false,hls:null,dash:null};
var AFFECTED={
 'vtvcab3hd':['https://cdn.hqth.me/logo/thumbs/14.png','https://assets-vtvcab.gviet.vn/images/hq/posters/_ports_ng_logo_04202212.jpg','https://i.ibb.co/tsBYvZ4/onsports-BEARTV.png'],
 'vtvcab6hd':['https://cdn.hqth.me/logo/thumbs/17.png','https://assets-vtvcab.gviet.vn/images/hq/posters/onsportscongmoi1.jpg','https://i.ibb.co/Bc8cL7w/onsportplus3-BEARTV.png'],
 'vtvcab16hd':['https://cdn.hqth.me/logo/thumbs/24.png','https://assets-vtvcab.gviet.vn/images/hq/posters/_ootball_-_opyright_by_cab_logo_202212.jpg','https://i.ibb.co/vd1LBK7/onfootbal-BEARTV.png'],
 'vtvcab18hd':['https://cdn.hqth.me/logo/thumbs/26.png','https://assets-vtvcab.gviet.vn/images/v2/channel/20220613/2022061306/Logo_ONSPORTSNEWS_150x904_1675158858.webp','https://i.ibb.co/PGG1dkn/ONSPORTSNEWS-BEARTV.png']
};
function $(id){return document.getElementById(id)}
function trim(s){return String(s==null?'':s).replace(/^\s+|\s+$/g,'')}
function norm(s){return trim(s).toLowerCase().replace(/[_-]+/g,' ').replace(/\s+/g,' ')}
function keyName(s){return norm(s).replace(/\b(server|source|nguon|sv)\s*\d+\b/g,'').replace(/[^a-z0-9]+/g,' ').replace(/\s+/g,' ').trim()}
function toast(s){$('toast').textContent=s;$('toast').style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(function(){$('toast').style.display='none'},2600)}
function saveUser(){try{localStorage.setItem('nm7:fav',JSON.stringify(S.fav));localStorage.setItem('nm7:recent',JSON.stringify(S.recent.slice(0,80)))}catch(e){}}
function loadUser(){try{S.fav=JSON.parse(localStorage.getItem('nm7:fav')||'[]');S.recent=JSON.parse(localStorage.getItem('nm7:recent')||'[]')}catch(e){S.fav=[];S.recent=[]}}
function cacheKey(){return 'nm7:cache:'+S.source}
function saveCache(){try{localStorage.setItem(cacheKey(),JSON.stringify({at:new Date().getTime(),list:S.list}))}catch(e){}}
function readCache(){try{var x=JSON.parse(localStorage.getItem(cacheKey())||'null');return x&&x.list&&x.list.length?x:null}catch(e){return null}}
function buildGroups(){
 var map={},groups=[],i,g;
 for(i=0;i<S.list.length;i++){g=S.list[i].group||'Chưa phân nhóm';if(!map[g]){map[g]=[];groups.push(g)}map[g].push(S.list[i])}
 S.groups=[];
 for(i=0;i<groups.length;i++)S.groups.push([groups[i],map[groups[i]]]);
 if(S.groups.length){if(S.groupIndex<0)S.groupIndex=0;if(S.groupIndex>=S.groups.length)S.groupIndex=S.groups.length-1}
 else S.groupIndex=0;
 S.colIndex=0
}
function groupChannels(){return S.groups[S.groupIndex]?S.groups[S.groupIndex][1]:[]}
function current(){var a=groupChannels();return a[S.colIndex]||a[0]||null}
function logoCandidates(c){
 var id=norm(c.tvgId).replace(/\s+/g,'');
 if(AFFECTED[id])return AFFECTED[id].concat(c.logo?[c.logo]:[]);
 return c.logo?[c.logo]:[]
}
function setLogoLazy(img,c){
 var arr=logoCandidates(c);
 img._logoCandidates=arr;img._logoIndex=0;
 if(!arr.length){img.style.display='none';return}
 img.setAttribute('data-lazy','1');img.style.display='block'
}
function loadLogo(img){
 if(!img||img.getAttribute('data-lazy')!=='1')return;
 img.removeAttribute('data-lazy');
 var arr=img._logoCandidates||[],i=img._logoIndex||0;
 function next(){
   if(i>=arr.length){img.style.display='none';return}
   img._logoIndex=i;img.src=arr[i];i++
 }
 img.onerror=next;next()
}
function lazyLogoScan(){
 var imgs=document.querySelectorAll('.logo[data-lazy]'),i,im,r;
 for(i=0;i<imgs.length;i++){im=imgs[i];r=im.getBoundingClientRect();if(r.top<window.innerHeight+180&&r.bottom>-180)loadLogo(im)}
}
function focusCard(gi,ci,animate){
 var a,row,old,el,x;
 if(S.groups.length===0)return;
 if(gi<0)gi=0;if(gi>=S.groups.length)gi=S.groups.length-1;
 S.groupIndex=gi;a=groupChannels();
 if(a.length===0){S.colIndex=0;return}
 if(ci<0)ci=0;if(ci>=a.length)ci=a.length-1;S.colIndex=ci;
 old=document.querySelector('.card.focus');if(old)old.classList.remove('focus');
 el=document.querySelector('.card[data-gi="'+gi+'"][data-ci="'+ci+'"]');
 if(el){
   el.classList.add('focus');
   try{el.focus({preventScroll:true})}catch(e){el.focus()}
   try{el.scrollIntoView({behavior:animate?'smooth':'auto',block:'nearest',inline:'center'})}catch(e){}
 }
 row=document.querySelector('.hrow[data-gi="'+gi+'"]');
 if(row&&el){x=el.offsetLeft-row.clientWidth/2+64;if(x<0)x=0;row.scrollLeft=x}
 lazyLogoScan()
}
function render(){
 var host=$('rows'),html='',start,end,gi,pair,group,channels,hr,inner,ci,c,card,lf,halo,ring,im,nm,sec;
 host.innerHTML='';
 if(!S.groups.length){host.innerHTML='<div id="empty">Không có kênh</div>';return}
 start=Math.max(0,S.groupIndex-2);end=Math.min(S.groups.length,S.groupIndex+5);
 for(gi=start;gi<end;gi++){
   pair=S.groups[gi];group=pair[0];channels=pair[1];
   sec=document.createElement('section');sec.className='group';
   var title=document.createElement('div');title.className='groupTitle';title.textContent=group;sec.appendChild(title);
   hr=document.createElement('div');hr.className='hrow';hr.setAttribute('data-gi',gi);
   inner=document.createElement('div');inner.className='hinner';
   for(ci=0;ci<channels.length;ci++){
     c=channels[ci];card=document.createElement('button');card.className='card '+(gi===S.groupIndex&&ci===S.colIndex?'focus':'');card.tabIndex=0;card.setAttribute('data-gi',gi);card.setAttribute('data-ci',ci);
     lf=document.createElement('span');lf.className='logoFrame';
     halo=document.createElement('span');halo.className='halo';lf.appendChild(halo);
     ring=document.createElement('span');ring.className='ring';lf.appendChild(ring);
     if(c.logo||c.tvgId){im=document.createElement('img');im.className='logo';im.alt='';setLogoLazy(im,c);lf.appendChild(im)}
     else{var badge=document.createElement('span');badge.className='badge';badge.textContent='TV';lf.appendChild(badge)}
     nm=document.createElement('span');nm.className='cardName';nm.textContent=c.name||'Kênh';
     card.appendChild(lf);card.appendChild(nm);
     (function(channel,gidx,cidx){card.onclick=function(){play(channel)};card.onfocus=function(){focusCard(gidx,cidx,true)}})(c,gi,ci);
     inner.appendChild(card)
   }
   hr.appendChild(inner);sec.appendChild(hr);host.appendChild(sec)
 }
 focusCard(S.groupIndex,S.colIndex,false);lazyLogoScan()
}
function updateHeader(){
 $('title').textContent='Danh sách kênh TV';
 $('clock').textContent=new Date().toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'})
}

function fetchPlaylist(source){

function tryNext(reason){
 if(!S.player)return;
 if(S.proxyAttempt){
   // Proxy failed: retry the SAME candidate directly.
   S.proxyAttempt=false;
 }else{
   // Direct failed: advance once, then choose the correct first mode for the new candidate.
   S.candidateIndex++;
   var next=S.candidates[S.candidateIndex];
   if(next){
     S.proxyAttempt=/^(hls|dash)$/.test(classify(next)) && !canUseNativeHls(next);
   }else{
     S.proxyAttempt=false;
   }
 }
 if(S.candidateIndex<S.candidates.length){
   toast((reason||'Nguồn lỗi')+(S.proxyAttempt?' · thử proxy':' · thử trực tiếp'));
   setTimeout(tryCurrent,180);return
 }
 status('Không phát được '+((S.current&&S.current.name)||'kênh')+'\\nĐã thử '+S.candidates.length+' nguồn trực tiếp/proxy')
}
function tryCurrent(){

 function begin(){startCandidate(c,function(success){if(success)hideStatus();else tryNext('Nguồn không phát được')})}

   probeUnknown(c,function(detected){
     if(S.current!==c)return;
     c.type=detected;
     if(detected!=='http')begin();else begin()
   });
   return
 }
 begin()
}
