<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05070a"><title>NM7 TV Web</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070a;color:#fff;font-family:Arial,Helvetica,sans-serif}button,input{font:inherit}
#app{position:relative;width:100%;height:100%;background:#05070a}#top{position:absolute;z-index:20;left:0;right:0;top:0;height:82px;padding:20px 42px;display:flex;gap:24px;align-items:center;background:linear-gradient(#05070aee,transparent)}#brand{font-size:30px;font-weight:800}#src{font-size:18px;color:#c9ced6}#clock{margin-left:auto;color:#c9ced6;font-size:18px}
#home{position:absolute;inset:0;padding:95px 42px 40px;overflow:hidden}.row{margin-bottom:26px}.row h2{margin:0 0 12px;font-size:27px}.cards{display:flex;gap:16px;overflow:hidden}.card{position:relative;flex:0 0 225px;height:180px;border:2px solid transparent;border-radius:12px;background:#13181f;padding:0 10px 10px}.card.focus{border-color:#fff;background:#222933;transform:scale(1.03)}.thumb{height:120px;border-radius:9px;background:#080a0e;display:flex;align-items:center;justify-content:center;overflow:hidden}.thumb img{max-width:92%;max-height:92%;object-fit:contain}.thumb span{color:#727b87;font-size:22px}.name{text-align:center;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:9px}.star{position:absolute;top:8px;right:12px}.empty{padding:90px 5px;font-size:28px;color:#abb2bc}
.hidden{display:none!important}#player{position:absolute;z-index:60;inset:0;background:#000}#video{width:100%;height:100%;background:#000;object-fit:contain}#status{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:#bbb;font-size:28px;padding:60px;pointer-events:none}#ctrl{position:absolute;z-index:5;left:50%;bottom:52px;transform:translateX(-50%);background:#10141aed;padding:12px 15px;border-radius:12px;display:flex;gap:10px}.cb{border:0;border-radius:8px;background:#2d333c;color:#fff;padding:12px 18px;font-size:18px}.cb.focus,.cb:focus{outline:3px solid #fff;background:#fff;color:#000}
#menu{position:absolute;z-index:80;left:0;top:0;bottom:0;width:560px;background:#090c10f5;padding:102px 28px 30px;box-shadow:20px 0 60px #000}.mi{height:60px;padding:14px 20px;margin:4px 0;border-radius:8px;font-size:22px}.mi.focus{background:#fff;color:#000}.hint{position:absolute;left:30px;bottom:20px;color:#aab1bb;font-size:16px}
#dlg{position:absolute;z-index:90;inset:0;background:#000b;display:flex;align-items:center;justify-content:center}#box{width:min(900px,90vw);max-height:82vh;overflow:auto;background:#171b21;border-radius:14px;padding:26px}#box h2{margin:0 0 18px;font-size:29px}.input{width:100%;background:#07090d;color:#fff;border:2px solid #555;border-radius:8px;padding:13px;font-size:21px}.guide{color:#b2b8c1;line-height:1.5}.b{border:0;background:#303640;color:#fff;padding:12px 18px;border-radius:8px}.b:focus{outline:3px solid #fff;background:#fff;color:#000}
#toast{position:absolute;z-index:120;left:50%;bottom:44px;transform:translateX(-50%);background:#111820ef;border-radius:9px;padding:12px 22px;font-size:19px;opacity:0;pointer-events:none}#toast.show{opacity:1}
</style></head>
<body><div id="app">
<header id="top"><div id="brand">NM7 TV</div><div id="src">Truyền hình</div><div id="clock"></div></header>
<main id="home"></main>
<section id="player" class="hidden"><video id="video" playsinline preload="metadata"></video><div id="status">Đang chờ phát…</div><div id="ctrl" class="hidden"><button class="cb" data-a="back">◀ Thoát</button><button class="cb" data-a="back10">↶ -10s</button><button class="cb" data-a="play">▶/Ⅱ</button><button class="cb" data-a="fwd30">+30s ↷</button><button class="cb" data-a="next">CH +</button></div></section>
<aside id="menu" class="hidden"><h2>MENU TÙY CHỌN</h2><div id="ml"></div><p class="hint">◀ mở/đóng · ▲▼ chọn · OK xác nhận</p></aside>
<div id="dlg" class="hidden"><div id="box"></div></div><div id="toast"></div>
</div>
<script>
(()=>{const SRC=[{id:'tv',name:'Truyền hình',url:'/api/playlist?source=tv'},{id:'sport',name:'Thể thao',url:'/api/playlist?source=sport'}];
const S={source:0,list:[],groups:[],row:0,col:0,view:null,q:'',fav:[],recent:[],menu:0,player:false,ctrl:false,cp:2,dialog:null,current:null};
const $=id=>document.getElementById(id);let tt;
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast=s=>{$('toast').textContent=s;$('toast').className='show';clearTimeout(tt);tt=setTimeout(()=>$('toast').className='',2200)};
function save(){try{localStorage.nm7fav=JSON.stringify(S.fav);localStorage.nm7recent=JSON.stringify(S.recent.slice(0,50));localStorage['nm7list'+S.source]=JSON.stringify(S.list)}catch(e){}}
function restore(){try{S.fav=JSON.parse(localStorage.nm7fav||'[]');S.recent=JSON.parse(localStorage.nm7recent||'[]');S.list=JSON.parse(localStorage['nm7list'+S.source]||'[]')}catch(e){}}
function parse(t){let a=[],m=null;for(const raw of String(t).replace(/^\uFEFF/,'').split(/\r?\n/)){const l=raw.trim();if(l.startsWith('#EXTINF:')){const p=l.indexOf(','),h=p<0?l:l.slice(0,p);m={name:p<0?'Kênh':l.slice(p+1).trim(),group:(/group-title="([^"]*)"/i.exec(h)||[])[1]||'Khác',logo:(/tvg-logo="([^"]*)"/i.exec(h)||[])[1]||'',id:(/tvg-id="([^"]*)"/i.exec(h)||[])[1]||''}}else if(m&&l.charAt(0)!=='#'&&/^(https?|rtsp|rtmp|udp):/i.test(l)){m.id=m.id||m.name;m.url=l;a.push(m);m=null}}return a}
function rebuild(){let seen={};S.groups=[];for(const c of S.list)if(!seen[c.group]){seen[c.group]=1;S.groups.push(c.group)}S.row=0;S.col=0;render()}
function srcList(){let a=S.view||S.list;if(S.q){const q=S.q.toLowerCase();a=a.filter(c=>(c.name+' '+c.group+' '+c.id).toLowerCase().includes(q))}return a}
function row(g){return srcList().filter(c=>c.group===g)}
function cur(){const a=row(S.groups[S.row]||'');return a[S.col]||a[0]}
function render(){const h=$('home');let html='';for(let r=0;r<S.groups.length;r++){const g=S.groups[r],a=row(g);if(!a.length)continue;html+='<section class="row"><h2>'+esc(g)+'</h2><div class="cards">';a.forEach((c,i)=>{const f=r===S.row&&i===S.col;html+='<div class="card '+(f?'focus':'')+'"><div class="thumb">'+(c.logo?'<img src="'+esc(c.logo)+'" onerror="this.style.display=\'none\';this.parentNode.innerHTML=\'<span>TV</span>\'">':'<span>TV</span>')+'</div><div class="name">'+esc(c.name)+'</div>'+(S.fav.includes(c.id)?'<span class="star">★</span>':'')+'</div>'});html+='</div></section>'}h.innerHTML=html||'<div class="empty">Không có kênh phù hợp</div>';const f=document.querySelector('.card.focus');if(f)f.scrollIntoView({block:'nearest',inline:'nearest'})}
function fetchSource(n){S.source=n;toast('Đang tải '+SRC[n].name+'…');fetch(SRC[n].url,{cache:'no-store'}).then(r=>r.ok?r.text():Promise.reject()).then(t=>{S.list=parse(t);S.view=null;S.q='';save();$('src').textContent=SRC[n].name+' · '+S.list.length+' kênh';rebuild();toast('Đã tải '+S.list.length+' kênh')}).catch(()=>toast('Không tải được playlist'))}
function menuItems(){return ['▣ Truyền hình','⚽ Thể thao','★ Yêu thích','◷ Gần đây','⌕ Tìm kiếm','↻ Tải lại playlist'].concat(S.groups)}
function drawMenu(){const a=menuItems();$('ml').innerHTML=a.map((x,i)=>'<div class="mi '+(i===S.menu?'focus':'')+'">'+esc(x)+'</div>').join('')}
function openMenu(){S.menu=Math.min(S.menu,menuItems().length-1);S.mode='menu';$('menu').className='';drawMenu()}
function closeMenu(){S.mode=S.player?'player':'home';$('menu').className='hidden';render()}
function selectMenu(){const p=S.menu;if(p===0||p===1){closeMenu();fetchSource(p)}else if(p===2||p===3){const ids=p===2?S.fav:S.recent,a=S.list.filter(c=>ids.includes(c.id));if(!a.length)return toast(p===2?'Yêu thích trống':'Gần đây trống');S.view=a;S.groups=[...new Set(a.map(c=>c.group))];S.row=0;S.col=0;closeMenu()}else if(p===4){showSearch()}else if(p===5){closeMenu();fetchSource(S.source)}else{const g=S.groups[p-6];if(g){S.view=null;S.row=S.groups.indexOf(g);S.col=0;closeMenu()}}}
function showSearch(){S.dialog='search';$('dlg').className='';$('box').innerHTML='<h2>Tìm kiếm kênh</h2><input id="qin" class="input" value="'+esc(S.q)+'" placeholder="Nhập tên kênh hoặc nhóm…"><p class="guide">Enter đóng tìm kiếm · Back quay lại.</p>';const i=$('qin');i.focus();i.oninput=()=>{S.q=i.value.trim();S.view=null;S.row=0;S.col=0;render()}}
function play(c){if(!c)return;S.current=c;S.player=true;S.ctrl=false;$('player').className='';$('ctrl').className='hidden';$('status').textContent='Đang mở '+c.name+'…';$('status').style.display='flex';S.recent=[c.id,...S.recent.filter(x=>x!==c.id)].slice(0,50);save();const v=$('video');v.src=c.url;v.load();const p=v.play();if(p&&p.catch)p.catch(()=>toast('Nhấn OK để phát '+c.name))}
function stop(){const v=$('video');v.pause();v.removeAttribute('src');v.load();S.player=false;S.ctrl=false;$('player').className='hidden';$('ctrl').className='hidden'}
function seek(sec){const v=$('video');if(!isFinite(v.duration)){toast('Luồng này không hỗ trợ tua');return}v.currentTime=Math.max(0,Math.min(v.duration,v.currentTime+sec))}
function showCtrl(){S.ctrl=!S.ctrl;$('ctrl').className=S.ctrl?'':'hidden';if(S.ctrl)focusCtrl()}
function focusCtrl(){document.querySelectorAll('.cb').forEach((b,i)=>b.className='cb '+(i===S.cp?'focus':''))}
function ctrlAction(){const a=document.querySelectorAll('.cb')[S.cp]?.dataset.a;if(a==='back'){stop();render()}else if(a==='back10')seek(-10);else if(a==='fwd30')seek(30);else if(a==='play'){const v=$('video');v.paused?v.play():v.pause()}else if(a==='next'){let i=S.list.findIndex(c=>c.id===S.current.id);play(S.list[(i+1+S.list.length)%S.list.length])}}
function updateClock(){const d=new Date();$('clock').textContent=d.toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'})}
$('video').addEventListener('playing',()=>$('status').style.display='none');$('video').addEventListener('error',()=>$('status').style.display='flex');$('video').addEventListener('waiting',()=>{$('status').textContent='Đang tải…';$('status').style.display='flex'});
document.addEventListener('keydown',e=>{const k=e.keyCode;
if(S.dialog){if(k===461||k===10009||k===27||k===13){$('dlg').className='hidden';S.dialog=null;render();e.preventDefault()}return}
if(S.player){if(k===461||k===10009||k===27){if(S.ctrl){S.ctrl=false;$('ctrl').className='hidden'}else{stop();render()}e.preventDefault();return}if(S.ctrl){if(k===37){S.cp=Math.max(0,S.cp-1);focusCtrl()}else if(k===39){S.cp=Math.min(4,S.cp+1);focusCtrl()}else if(k===13)ctrlAction();else if(k===38){S.cp=4;focusCtrl()}else if(k===40){S.cp=4;focusCtrl()}}else{if(k===13)showCtrl();else if(k===37)seek(-10);else if(k===39)seek(30);else if(k===38){let i=S.list.findIndex(c=>c.id===S.current.id);play(S.list[(i-1+S.list.length)%S.list.length])}else if(k===40){let i=S.list.findIndex(c=>c.id===S.current.id);play(S.list[(i+1)%S.list.length])}}e.preventDefault();return}
if(S.mode==='menu'){if(k===461||k===10009){closeMenu();return}if(k===38||k===40){S.menu=Math.max(0,Math.min(menuItems().length-1,S.menu+(k===38?-1:1)));drawMenu()}else if(k===13||k===39)selectMenu();e.preventDefault();return}
if(k===461||k===10009||k===27){openMenu();e.preventDefault();return}
if(k===37){if(S.col===0)openMenu();else S.col--;render()}else if(k===39){S.col=Math.min(row(S.groups[S.row]||'').length-1,S.col+1);render()}else if(k===38){S.row=Math.max(0,S.row-1);S.col=Math.min(S.col,Math.max(0,row(S.groups[S.row]||'').length-1));render()}else if(k===40){S.row=Math.min(S.groups.length-1,S.row+1);S.col=Math.min(S.col,Math.max(0,row(S.groups[S.row]||'').length-1));render()}else if(k===13)play(cur());else if(k===8||k===403){const c=cur();if(c){const i=S.fav.indexOf(c.id);i<0?S.fav.push(c.id):S.fav.splice(i,1);save();render();toast(i<0?'Đã thêm yêu thích':'Đã bỏ yêu thích')}}e.preventDefault()});
restore();$('src').textContent='Truyền hình';render();if(!S.list.length)fetchSource(0);setInterval(updateClock,1000);updateClock();
})();
</script></body></html>
