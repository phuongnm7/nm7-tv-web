<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111f;color:#fff;font-family:Arial,Helvetica,sans-serif}
body{user-select:none}
button,input{font:inherit}

#app{position:relative;width:100%;height:100%;background:#07111f url("/assets/nm7-web-bg.jpg") center/cover no-repeat fixed}

.card{position:relative;appearance:none;-webkit-appearance:none;flex:0 0 138px;width:138px;height:76px;border:1px solid #334f6a83;border-radius:22px;background:linear-gradient(90deg,#c72a3749,#d9182434);padding:6px 10px 2px;outline:none;display:flex;flex-direction:column;align-items:stretch;justify-content:stretch;transition:transform .12s ease,background .12s ease,border-color .12s ease;z-index:1;color:#fff;font:inherit;text-align:center;overflow:hidden;cursor:pointer}
.card.focus,.card:focus{border:5px solid #37d6a6;background:linear-gradient(90deg,#e837d6a6,#d82aae8a);transform:scale(1.08);z-index:5;box-shadow:0 8px 24px rgba(0,0,0,.45)}

#homeTabs{position:relative;height:64px;width:100%;display:flex;align-items:center;padding:6px 0;z-index:10}

#ytTab{width:180px;height:52px;border-radius:16px;background:rgba(45,185,231,.86);border:2px solid rgba(205,245,255,.7);box-shadow:0 3px 12px #0015;display:flex;align-items:center;justify-content:center;gap:8px}
#ytTab .ytPlay{width:46px;height:32px;border-radius:9px;background:#f11212;position:relative;box-shadow:0 0 0 1px #d80000 inset}
#ytTab .ytPlay:after{content:"";position:absolute;left:18px;top:9px;border-left:13px solid #fff;border-top:7px solid transparent;border-bottom:7px solid transparent}

#homeTitle{position:absolute;left:50%;top:0;transform:translateX(-50%);height:64px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#c1cad6;text-shadow:0 2px 4px #0007;pointer-events:none;white-space:nowrap}
#ytTab:focus,#ytTab.focus,#appShortcut:focus,#appShortcut.focus{outline:3px solid #37d6a6;outline-offset:3px;transform:scale(1.04)}

#player{position:absolute;z-index:60;inset:0;background:#000}
#video{width:100%;height:100%;background:#000;object-fit:contain}
#status{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:#c5cad1;font-size:26px;padding:70px;pointer-events:none;white-space:pre-wrap}
#playerTop{position:absolute;left:0;right:0;top:0;z-index:4;padding:22px 32px;background:linear-gradient(#000d,transparent)}
#playerTitle{font-size:25px;font-weight:700}
#playerMeta{font-size:15px;color:#9ea8b5;margin-top:5px;word-break:break-all}
#ctrl{position:absolute;z-index:5;left:50%;bottom:44px;transform:translateX(-50%);background:#10141aed;padding:12px 14px;border-radius:12px;display:flex;gap:9px}
.cb{border:0;border-radius:8px;background:#303742;color:#fff;padding:11px 17px;font-size:18px}
.cb.focus,.cb:focus{outline:3px solid #fff;background:#fff;color:#000}

#menu{position:absolute;z-index:80;left:0;top:0;bottom:0;width:310px;background:#090c10fa;padding:18px 14px 26px;box-shadow:20px 0 60px #000}
#menu h2{margin:0 0 15px;font-size:28px}
.mi{width:100%;height:48px;padding:10px 16px;margin:4px 0;border:0;border-radius:9px;background:transparent;color:#fff;text-align:left;font-size:18px;cursor:pointer;outline:none}.mi:focus,.mi.focus{background:#fff;color:#000}
.mi.focus{background:#fff;color:#000}
#menuHint{position:absolute;left:24px;bottom:18px;color:#949eab;font-size:14px}

#dlg{position:absolute;z-index:100;inset:0;background:#000b;display:flex;align-items:center;justify-content:center}
#box{width:860px;max-width:90vw;max-height:78vh;overflow:auto;background:#171c23;border-radius:14px;padding:26px}
#box h2{margin:0 0 17px;font-size:28px}
.input{width:100%;background:#07090d;color:#fff;border:2px solid #4e5662;border-radius:8px;padding:12px;font-size:21px}
.guide{color:#acb5c0;line-height:1.5;font-size:17px}
.db{border:0;border-radius:8px;background:#303741;color:#fff;padding:11px 17px;font-size:18px}
.db:focus{outline:3px solid #fff;background:#fff;color:#000}

#toast{position:absolute;z-index:120;left:50%;bottom:38px;transform:translateX(-50%);background:#121821f2;border-radius:9px;padding:11px 19px;font-size:18px;opacity:0;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1}
</style>

<script>
(function(){
var VERSION='1.0.69';
var SRC=[{id:'tv',name:'Truyền hình',url:'/api/playlist?source=tv'},{id:'sport',name:'Thể thao',url:'/api/playlist?source=sport'}];
var S={source:0,list:[],groups:[],row:0,col:0,view:null,q:'',fav:[],recent:[],menu:0,mode:'home',player:false,ctrl:false,cp:2,dialog:null,current:null,candidateIndex:0,hls:null,dash:null,playerGeneration:0,cacheAge:0,proxyAttempt:false,watchdog:null,attemptNo:0,advanceBusy:false,flv:null,dashBase:''};
function $(id){return document.getElementById(id)}
var toastTimer;
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function toast(s){$('toast').textContent=s;$('toast').className='show';clearTimeout(toastTimer);toastTimer=setTimeout(function(){$('toast').className=''},2800)}
function saveUser(){try{localStorage.setItem('nm7:fav',JSON.stringify(S.fav));localStorage.setItem('nm7:recent',JSON.stringify(S.recent.slice(0,80)));}catch(e){}}
function restoreUser(){try{S.fav=JSON.parse(localStorage.getItem('nm7:fav')||'[]');S.recent=JSON.parse(localStorage.getItem('nm7:recent')||'[]')}catch(e){S.fav=[];S.recent=[]}}
function cacheKey(){return 'nm7:web:'+S.source}
function saveListCache(){try{localStorage.setItem(cacheKey(),JSON.stringify({at:Date.now(),channels:S.list}))}catch(e){}}
function readListCache(){try{var x=JSON.parse(localStorage.getItem(cacheKey())||'null');return x&&x.channels&&x.channels.length?x:null}catch(e){return null}}
function norm(c){c=c||{};if(!c.candidates)c.candidates=[];return c}
function setLabel(){var n=SRC[S.source].name;$('src').textContent=n;$('count').textContent=S.list.length?('· '+S.list.length+' kênh'):''}
function rebuildGroups(){var seen={},i,g;S.groups=[];for(i=0;i<S.list.length;i++){g=S.list[i].group||'Khác';if(!seen[g]){seen[g]=1;S.groups.push(g)}}S.row=Math.min(S.row,Math.max(0,S.groups.length-1));S.col=0}
function currentRows(){return S.view||S.list}
function channelsInGroup(g){var a=currentRows(),b=[],i;for(i=0;i<a.length;i++)if((a[i].group||'Khác')===g)b.push(a[i]);return b}
function currentChannel(){var a=channelsInGroup(S.groups[S.row]||'');return a[S.col]||a[0]||null}
function nearestColumn(oldCol,g){var n=channelsInGroup(g).length;return n?Math.min(oldCol,n-1):0}
function focusElement(){
 var el=document.querySelector('.card.focus');
 if(!el){var all=document.querySelectorAll('.card');el=all[0]||null;if(el)el.classList.add('focus')}
 if(!el)return;
 try{el.focus({preventScroll:true})}catch(e){try{el.focus()}catch(e2){}}
 try{el.scrollIntoView({behavior:'auto',block:'nearest',inline:'center'})}catch(e){}
}
function activateLogos(){var imgs=document.querySelectorAll('img[data-src]'),i,im,r;for(i=0;i<imgs.length;i++){im=imgs[i];r=parseInt(im.getAttribute('data-row')||'0',10);if(Math.abs(r-S.row)<=2){im.src=im.getAttribute('data-src');im.removeAttribute('data-src')}}}
function render(){
 var h=$('home'),html='',start=Math.max(0,S.row-2),end=Math.min(S.groups.length,S.row+5),r,g,a,i,c,selected;
 html+='<div id="homeTabs">';
 html+='<button id="ytTab" class="homeTab" type="button" aria-label="YouTube"><span class="ytPlay"></span><span class="ytText">YouTube</span></button>';
 html+='<button id="appShortcut" class="homeTab" type="button" aria-label="Chọn ứng dụng"><span class="plus">+</span><span class="label">Chọn ứng dụng</span></button>';
 html+='<div id="homeTitle">Danh sách kênh TV</div></div>';
 for(r=start;r<end;r++){
   g=S.groups[r];a=channelsInGroup(g);if(!a.length)continue;
   html+='<section class="row" data-row="'+r+'"><h2>'+esc(g)+'</h2><div class="cards">';
   for(i=0;i<a.length;i++){
     c=norm(a[i]);selected=(r===S.row&&i===S.col);
     html+='<button type="button" class="card '+(selected?'focus':'')+'" tabindex="0" data-row="'+r+'" data-col="'+i+'" aria-label="'+esc(c.name)+'">';
     html+='<div class="thumb">';
     if(c.logo)html+='<img loading="lazy" data-row="'+r+'" data-src="'+esc(c.logo)+'" onerror="this.style.display=\'none\';this.parentNode.innerHTML=\'<span>TV</span>\'">';
     else html+='<span>TV</span>';
     html+='</div><div class="name">'+esc(c.name)+'</div>'+(S.fav.indexOf(c.id)>=0?'<span class="star">★</span>':'')+'</div>';
   }
   html+='</button></section>';
 }
 h.innerHTML=html||'<div class="empty">Không có kênh phù hợp</div>';
 var yt=$('ytTab');if(yt)yt.onclick=function(){toast('YouTube trên Web đang ở chế độ trình duyệt')};
 var app=$('appShortcut');if(app)app.onclick=function(){toast('Chọn ứng dụng chỉ khả dụng trên Android TV')};
 h.querySelectorAll('.card').forEach(function(card){
   card.onclick=function(){
     var rr=Number(card.getAttribute('data-row')||0),cc=Number(card.getAttribute('data-col')||0),aa=channelsInGroup(S.groups[rr]||'');
     S.row=rr;S.col=cc;if(aa[cc])play(aa[cc]);
   };
 });
 activateLogos();focusElement()
}
function parseM3UText(t){
 var lines=String(t||'').replace(/^\\uFEFF/,'').split(/\\r?\\n/),out=[],m=null,ua='',ref='',licenseType='',licenseKey='',i,l,p,h,um,rm,km,kv;
 for(i=0;i<lines.length;i++){
  l=lines[i].trim();
  if(l.indexOf('#EXTINF:')===0){
   if(m&&m.candidates.length)out.push(m);
   p=l.indexOf(',');h=p<0?l:l.slice(0,p);
   m={name:p<0?'Kênh':l.slice(p+1).trim(),group:(/group-title="([^"]*)"/i.exec(h)||[])[1]||'Khác',logo:(/tvg-logo="([^"]*)"/i.exec(h)||[])[1]||'',id:(/tvg-id="([^"]*)"/i.exec(h)||[])[1]||'',candidates:[]};
   ua='';ref='';licenseType='';licenseKey='';
  }else if(m&&l.indexOf('#EXTVLCOPT:')===0){
   um=/http-user-agent=(?:"([^"]+)"|([^\s]+))/i.exec(l);rm=/(?:http-referrer|http-referer)=(?:"([^"]+)"|([^\s]+))/i.exec(l);
   if(um)ua=um[1]||um[2];if(rm)ref=rm[1]||rm[2];
  }else if(m&&l.indexOf('#KODIPROP:')===0){
   km=/inputstream\.adaptive\.license_type=(.+)/i.exec(l);kv=/inputstream\.adaptive\.license_key=(.+)/i.exec(l);
   if(km)licenseType=km[1].trim();if(kv)licenseKey=kv[1].trim();
  }else if(m&&l.charAt(0)!=='#'&&/^(https?|rtsp|rtmp|udp):/i.test(l)){
   var ps=l.split('|'),url=ps[0],r=ref,u=ua;
   for(var j=1;j<ps.length;j++){if(/^referer=/i.test(ps[j]))r=ps[j].slice(ps[j].indexOf('=')+1);if(/^http-user-agent=/i.test(ps[j]))u=ps[j].slice(ps[j].indexOf('=')+1)}
   var cand={url:url,ref:r,ua:u,hls:/\.m3u8(?:$|\?)/i.test(url)||/\.m3u(?:$|\?)/i.test(url)||/playlist|index\.m3u|manifest/i.test(url)};
   if(licenseType&&licenseKey)cand.drm={type:licenseType,key:licenseKey};
   m.candidates.push(cand);
  }
 }
 if(m&&m.candidates.length)out.push(m);
 for(i=0;i<out.length;i++){out[i].id=out[i].id||out[i].name}
 return out;
}
function parseUserList(a){S.list=[];for(var i=0;i<a.length;i++)S.list.push(norm(a[i]));S.view=null;rebuildGroups();setLabel();render()}
function fetchSource(n){
 S.source=n;var cached=readListCache(),had=!!cached;
 if(cached){S.list=cached.channels||[];S.view=null;rebuildGroups();setLabel();render();toast('Đã mở cache · đang cập nhật…')}
 else {$('home').innerHTML='<div class="empty">Đang tải '+esc(SRC[n].name)+'…</div>';$('src').textContent=SRC[n].name;$('count').textContent=''}
 fetch(SRC[n].url,{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(function(data){
   if(!data||!data.channels)throw new Error('Playlist response không hợp lệ');
   parseUserList(data.channels);saveListCache();toast('Đã cập nhật '+S.list.length+' kênh');
 }).catch(function(e){
   if(S.source!==0||n!==0){if(!had)toast('Không tải được playlist: '+e.message);return}
   var fb='https://raw.githubusercontent.com/phuongnm7/Iptv-phuongnm7/main/IPTV_Gop_VMTTV_vAppTV.m3u';
   fetch(fb,{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('fallback HTTP '+r.status);return r.text()}).then(function(t){
     var list=parseM3UText(t);if(!list.length)throw new Error('fallback playlist rỗng');
     parseUserList(list);saveListCache();toast('Đã mở danh sách dự phòng · '+S.list.length+' kênh');
   }).catch(function(e2){if(!had)toast('Không tải được playlist: '+e.message+' · '+e2.message)})
 })
}
function menuItems(){return ['▣ Truyền hình','⚽ Thể thao','★ Yêu thích','◷ Gần đây','⌕ Tìm kiếm','↻ Tải lại playlist'].concat(S.groups)}
function drawMenu(){var a=menuItems(),h='',i;for(i=0;i<a.length;i++)h+='<div class="mi '+(i===S.menu?'focus':'')+'">'+esc(a[i])+'</div>';$('ml').innerHTML=h}
function openMenu(){S.mode='menu';S.menu=Math.max(0,Math.min(S.menu,menuItems().length-1));$('menu').className='';drawMenu()}
function closeMenu(){S.mode=S.player?'player':'home';$('menu').className='hidden';render()}
function selectMenu(){
 var p=S.menu,a=[],ids,i,g,seen;
 if(p===0||p===1){closeMenu();fetchSource(p);return}
 if(p===2||p===3){
   ids=p===2?S.fav:S.recent;for(i=0;i<S.list.length;i++)if(ids.indexOf(S.list[i].id)>=0)a.push(S.list[i]);
   if(!a.length){toast(p===2?'Yêu thích trống':'Gần đây trống');return}
   S.view=a;seen={};S.groups=[];for(i=0;i<a.length;i++){g=a[i].group||'Khác';if(!seen[g]){seen[g]=1;S.groups.push(g)}}S.row=0;S.col=0;closeMenu();return
 }
 if(p===4){showSearch();return}
 if(p===5){closeMenu();fetchSource(S.source);return}
 g=S.groups[p-6];if(g){S.view=null;S.row=S.groups.indexOf(g);S.col=0;closeMenu()}
}
function showSearch(){S.dialog='search';$('dlg').className='';$('box').innerHTML='<h2>Tìm kiếm kênh</h2><input id="qin" class="input" value="'+esc(S.q)+'" placeholder="Tên kênh, TVG-ID hoặc nhóm"><p class="guide">Gõ tìm kiếm rồi nhấn Enter. Back đóng.</p>';var i=$('qin');i.focus();i.oninput=function(){S.q=i.value.trim();S.row=0;S.col=0;render()}}
function listForNavigation(){var a=S.list;if(S.q){var q=S.q.toLowerCase(),b=[],i,c;for(i=0;i<a.length;i++){c=a[i];if((c.name+' '+c.group+' '+c.id).toLowerCase().indexOf(q)>=0)b.push(c)}return b}return a}
function refreshView(){var old=S.list;S.list=listForNavigation();rebuildGroups();S.list=old;render()}
function clearPlayers(){
 if(S.watchdog){clearTimeout(S.watchdog);S.watchdog=null}
 if(S.hls){try{S.hls.destroy()}catch(e){}S.hls=null}
 if(S.dash){try{S.dash.reset()}catch(e){}S.dash=null}
 if(S.flv){try{S.flv.destroy()}catch(e){}S.flv=null}
 S.dashBase=''
}
function getCandidate(){if(!S.current||!S.current.candidates||!S.current.candidates.length)return null;return S.current.candidates[S.candidateIndex]||null}
function showStatus(s){$('status').textContent=s;$('status').style.display='flex'}
function classify(c){
 var u=String(c.url||'').toLowerCase(),m=String(c.mime||'').toLowerCase(),o=String(c.type||'').toLowerCase();
 if(c.dash||o==='dash'||m.indexOf('dash+xml')>=0||/\.mpd(?:$|\?)/i.test(u))return 'dash';
 if(c.hls||o==='hls'||m.indexOf('mpegurl')>=0||/\.m3u8?(?:$|\?)/i.test(u))return 'hls';
 if(o==='rtsp'||/^rtsps?:/i.test(u))return 'rtsp';
 if(o==='rtmp'||/^rtmps?:/i.test(u))return 'rtmp';
 if(o==='udp'||/^udp:/i.test(u))return 'udp';
 if(o==='flv'||m.indexOf('x-flv')>=0||/\.flv(?:$|\?)/i.test(u))return 'flv';
 if(/\.mp4(?:$|\?)/i.test(u))return 'mp4';
 return 'http';
}
function playbackUrl(c){
 var u=c.url||'';
 if(!S.proxyAttempt||!/^https?:/i.test(u))return u;
 if(c.proxy&&/^https?:/i.test(c.proxy)===false)return c.proxy;
 var q='/api/stream?u='+encodeURIComponent(u);
 if(c.ref)q+='&r='+encodeURIComponent(c.ref);
 if(c.ua)q+='&ua='+encodeURIComponent(c.ua);
 if(c.headers&&Object.keys(c.headers).length)q+='&h='+encodeURIComponent(JSON.stringify(c.headers));
 return q
}
function protectionData(c){
 var d=c.drm||{},type=String(d.type||c.licenseType||'').toLowerCase(),key=String(d.key||c.licenseKey||'').trim();
 if(!type||!key)return null;
 var out={},proto=type.indexOf('widevine')>=0?'com.widevine.alpha':type.indexOf('playready')>=0?'com.microsoft.playready':'org.w3.clearkey';
 var ph=JSON.stringify(c.headers||{});
 if(proto==='org.w3.clearkey'){
   if(/^https?:/i.test(key)){
     var lq2='/api/license?u='+encodeURIComponent(key)+'&h='+encodeURIComponent(ph);
     if(c.ref)lq2+='&r='+encodeURIComponent(c.ref);
     if(c.ua)lq2+='&ua='+encodeURIComponent(c.ua);
     out[proto]={serverURL:lq2,httpRequestHeaders:c.headers||{'X-NM7-Client':'web-1.0.69'}};
   }
   else{
     var map={},text=key.trim(),json=null,parts,i,p,k,v;
     try{if(text.charAt(0)==='{')json=JSON.parse(text)}catch(e){}
     if(json&&json.keys){for(i=0;i<json.keys.length;i++){k=json.keys[i].kid;v=json.keys[i].k;if(k&&v)map[k]=v}}
     else{parts=text.split(/[;,]/);for(i=0;i<parts.length;i++){p=parts[i].split(':');if(p.length===2){k=b64urlFromHex(p[0]);v=b64urlFromHex(p[1]);if(!k)k=p[0].trim();if(!v)v=p[1].trim();if(k&&v)map[k]=v}}}
     if(Object.keys(map).length)out[proto]={clearkeys:map};
   }
 }else if(/^https?:/i.test(key)){
   var lq='/api/license?u='+encodeURIComponent(key)+'&h='+encodeURIComponent(ph);
   if(c.ref)lq+='&r='+encodeURIComponent(c.ref);
   if(c.ua)lq+='&ua='+encodeURIComponent(c.ua);
   out[proto]={serverURL:lq,httpRequestHeaders:c.headers||{'X-NM7-Client':'web-1.0.69'}};
 }
 return Object.keys(out).length?out:null
}
function b64urlFromHex(s){var h=String(s||'').replace(/^0x/i,'').replace(/-/g,'').trim(),bin='',i;if(!/^[0-9a-f]+$/i.test(h)||h.length%2)return '';for(i=0;i<h.length;i+=2)bin+=String.fromCharCode(parseInt(h.substr(i,2),16));return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function setupDash(c,cand,v,u){
 if(!window.dashjs){showStatus('Thiếu DASH player trên trình duyệt');return false}
 try{
   S.dashBase=cand.finalUrl||cand.url||'';
   var p=dashjs.MediaPlayer().create();S.dash=p;
   function dashProxyUrl(url){
     if(!S.proxyAttempt||!/^https?:/i.test(url))return url;
     var abs=url;
     try{
       if(url.indexOf(location.origin)===0){
         var rel=url.slice(location.origin.length);
         if(rel.indexOf('/api/stream')===0)return url;
         if(S.dashBase)abs=new URL(rel,S.dashBase).toString();
       }
     }catch(e){}
     var q='/api/stream?u='+encodeURIComponent(abs);
     if(cand.ref)q+='&r='+encodeURIComponent(cand.ref);
     if(cand.ua)q+='&ua='+encodeURIComponent(cand.ua);
     if(cand.headers&&Object.keys(cand.headers).length)q+='&h='+encodeURIComponent(JSON.stringify(cand.headers));
     return q
   }
   p.extend('RequestModifier',function(){return{
     modifyRequestURL:function(url){return dashProxyUrl(url)},
     modifyRequestHeader:function(xhr){
       if(cand.ua)try{xhr.setRequestHeader('User-Agent',cand.ua)}catch(e){}
       if(cand.ref)try{xhr.setRequestHeader('Referer',cand.ref)}catch(e){}
       return xhr
     }
   }});
   var prot=protectionData(cand);
   if(prot&&p.setProtectionData)p.setProtectionData(prot);
   p.on(dashjs.MediaPlayer.events.ERROR,function(e){if(e&&e.error){nextCandidate('DASH lỗi: '+(e.error.message||e.error.code||'unknown'))}});
   p.on(dashjs.MediaPlayer.events.STREAM_INITIALIZED,function(){hideStatus();var x=v.play();if(x&&x.catch)x.catch(function(){try{v.muted=true;v.play()}catch(e){}})});
   p.initialize(v,u,true);
   return true
 }catch(e){nextCandidate('DASH khởi tạo lỗi');return false}
}
function setupFlv(c,cand,v,u){
 if(!window.flvjs||!flvjs.isSupported()){showStatus('Trình duyệt không hỗ trợ FLV/MSE');return false}
 try{
   S.flv=flvjs.createPlayer({type:'flv',isLive:true,url:u},{enableStashBuffer:true,stashInitialSize:128*1024});
   S.flv.on(flvjs.Events.ERROR,function(evType,detail,info){nextCandidate('FLV lỗi '+(detail||evType||''))});
   S.flv.attachMediaElement(v);S.flv.load();
   var x=v.play();if(x&&x.catch)x.catch(function(){try{v.muted=true;v.play()}catch(e){}});
   return true
 }catch(e){nextCandidate('FLV khởi tạo lỗi');return false}
}
function setupHls(c,cand,v,u){
 var nativeHls=(v.canPlayType&&((v.canPlayType('application/vnd.apple.mpegurl')||v.canPlayType('application/x-mpegURL'))))&&/SMART-TV|Tizen/i.test(navigator.userAgent||'');
 if(nativeHls){v.autoplay=true;v.src=u;var x=v.play();if(x&&x.catch)x.catch(function(){try{v.muted=true;v.play()}catch(e){}});return true}
 if(window.Hls&&Hls.isSupported()){
   S.hls=new Hls({enableWorker:false,lowLatencyMode:false,maxBufferLength:30,startFragPrefetch:true,maxBufferHole:0.3});
   S.hls.on(Hls.Events.ERROR,function(ev,data){if(data&&data.fatal)nextCandidate('HLS lỗi '+(data.details||''))});
   S.hls.on(Hls.Events.MANIFEST_PARSED,function(){hideStatus();var x=v.play();if(x&&x.catch)x.catch(function(){try{v.muted=true;v.play()}catch(e){toast('Nhấn OK để phát '+c.name)}})});
   S.hls.loadSource(u);S.hls.attachMedia(v);return true
 }
 if(v.canPlayType&&v.canPlayType('application/vnd.apple.mpegurl')){v.autoplay=true;v.src=u;var x2=v.play();if(x2&&x2.catch)x2.catch(function(){try{v.muted=true;v.play()}catch(e){}});return true}
 showStatus('Trình duyệt không hỗ trợ HLS/MSE');return false
}
function directPlayback(c,cand,v,u){
 if(classify(cand)==='rtsp'||classify(cand)==='rtmp'||classify(cand)==='udp'){showStatus('Giao thức '+classify(cand).toUpperCase()+' không thể phát trực tiếp trong Web browser');return false}
 try{v.src=u;var x=v.play();if(x&&x.catch)x.catch(function(){}) ;return true}catch(e){return false}
}
function hideStatus(){$('status').style.display='none'}
function nextCandidate(reason){
 if(!S.player||S.advanceBusy)return;
 S.advanceBusy=true;
 if(S.watchdog){clearTimeout(S.watchdog);S.watchdog=null}
 if(!S.proxyAttempt){
   S.proxyAttempt=true;
   toast((reason||'Nguồn trực tiếp lỗi')+' · thử proxy');
   setTimeout(function(){S.advanceBusy=false;tryCurrent()},120);
   return
 }
 S.candidateIndex++;
 S.proxyAttempt=false;
 if(S.current&&S.candidateIndex<S.current.candidates.length){
   toast(reason||'Nguồn lỗi');
   setTimeout(function(){S.advanceBusy=false;tryCurrent()},160);
   return
 }
 S.advanceBusy=false;
 showStatus('Không phát được '+(S.current?S.current.name:'kênh')+'\nĐã thử '+(S.current&&S.current.candidates?S.current.candidates.length:0)+' nguồn');
}
function tryResolvedType(c,cand,v,u,t){
 var ok=false;
 if(t==='dash'){cand.dash=true;ok=setupDash(c,cand,v,u)}
 else if(t==='hls'){cand.hls=true;ok=setupHls(c,cand,v,u)}
 else if(t==='flv'){cand.type='flv';ok=setupFlv(c,cand,v,u)}
 else ok=directPlayback(c,cand,v,u);
 if(!ok&&S.current===c)nextCandidate('Nguồn không tương thích');
}
function probeUnknown(c,cand,attempt){
 var pu='/api/probe?u='+encodeURIComponent(cand.url),self=c;
 if(cand.ref)pu+='&r='+encodeURIComponent(cand.ref);
 if(cand.ua)pu+='&ua='+encodeURIComponent(cand.ua);
 fetch(pu,{cache:'no-store'}).then(function(r){return r.json()}).then(function(d){
   if(S.current!==self||attempt!==S.attemptNo)return;
   if(d&&d.type){
     cand.type=d.type;cand.mime=d.contentType||cand.mime||'';cand.finalUrl=d.finalUrl||cand.finalUrl||cand.url;
     var v=$('video'),u=playbackUrl(cand);
     showStatus('Đang phát '+self.name+'\nNguồn '+(S.candidateIndex+1)+'/'+self.candidates.length);
     tryResolvedType(self,cand,v,u,d.type)
   }else nextCandidate('Không xác định được định dạng');
 }).catch(function(){if(S.current===self&&attempt===S.attemptNo)nextCandidate('Không xác định được định dạng')})
}
function tryCurrent(){
 var c=S.current,cand=getCandidate(),v=$('video'),u,t,attempt=++S.attemptNo;
 if(!cand){showStatus('Kênh chưa có URL phát');return}
 S.advanceBusy=false;
 clearPlayers();u=playbackUrl(cand);
 showStatus('Đang phát '+c.name+'\nNguồn '+(S.candidateIndex+1)+'/'+c.candidates.length+(S.proxyAttempt?' · proxy':' · trực tiếp'));
 v.pause();v.removeAttribute('src');try{v.load()}catch(e){}
 t=classify(cand);
 if(t==='http'&&!cand.mime&&!cand.type)probeUnknown(c,cand,attempt);
 else if(t==='http'&&cand.type==='http')directPlayback(c,cand,v,u);
 else tryResolvedType(c,cand,v,u,t);
 S.watchdog=setTimeout(function(){
   if(!S.player||attempt!==S.attemptNo)return;
   if(v.readyState<2||v.paused)nextCandidate('Timeout phát 15s');
 },15000);
}
function play(c){
 if(!c)return;S.current=c;S.candidateIndex=0;S.proxyAttempt=false;S.playerGeneration++;S.player=true;S.ctrl=false;
 $('player').className='';$('ctrl').className='hidden';$('playerTitle').textContent=c.name;$('playerMeta').textContent=c.url||'';
 S.recent=[c.id].concat(S.recent.filter(function(x){return x!==c.id})).slice(0,80);saveUser();tryCurrent()
}
function stop(){
 clearPlayers();var v=$('video');try{v.pause();v.removeAttribute('src');v.load()}catch(e){}
 S.current=null;S.player=false;S.ctrl=false;S.proxyAttempt=false;S.attemptNo++;$('player').className='hidden';$('ctrl').className='hidden'
}
function seek(sec){var v=$('video');if(!isFinite(v.duration)){toast('Luồng này không hỗ trợ tua');return}v.currentTime=Math.max(0,Math.min(v.duration,v.currentTime+sec))}
function showCtrl(){S.ctrl=!S.ctrl;$('ctrl').className=S.ctrl?'':'hidden';if(S.ctrl)focusCtrl()}
function focusCtrl(){
 var b=document.querySelectorAll('.cb'),i;
 for(i=0;i<b.length;i++){b[i].className='cb '+(i===S.cp?'focus':'');b[i].tabIndex=i===S.cp?0:-1}
 var el=b[S.cp];if(el)try{el.focus({preventScroll:true})}catch(e){try{el.focus()}catch(e2){}}
}
function ctrlAction(){var b=document.querySelectorAll('.cb'),a=b[S.cp]?b[S.cp].getAttribute('data-a'):'';if(a==='back'){stop();render()}else if(a==='back10')seek(-10);else if(a==='fwd30')seek(30);else if(a==='play'){var v=$('video');v.paused?v.play():v.pause()}else if(a==='next'){switchChannelRelative(1)}}
function switchChannelRelative(d){var c=S.current||currentChannel(),i=S.list.indexOf(c);if(i<0)i=0;play(S.list[(i+d+S.list.length)%S.list.length])}
$('video').addEventListener('playing',function(){if(S.watchdog){clearTimeout(S.watchdog);S.watchdog=null}hideStatus()});
$('video').addEventListener('canplay',function(){if(S.watchdog){clearTimeout(S.watchdog);S.watchdog=null}hideStatus()});
$('video').addEventListener('error',function(){nextCandidate('Video error')});
$('video').addEventListener('ended',function(){if(S.player)nextCandidate('Luồng kết thúc')});

function remoteCode(e){
 var k=Number(e&&(e.keyCode!=null?e.keyCode:(e.which!=null?e.which:e.charCode))||0);
 var key=String(e&&e.key||'').toLowerCase(),code=String(e&&e.code||'').toLowerCase(),id=String(e&&e.keyIdentifier||'').toLowerCase();
 if(key==='arrowleft'||key==='left'||code==='arrowleft'||id==='left')return 37;
 if(key==='arrowright'||key==='right'||code==='arrowright'||id==='right')return 39;
 if(key==='arrowup'||key==='up'||code==='arrowup'||id==='up')return 38;
 if(key==='arrowdown'||key==='down'||code==='arrowdown'||id==='down')return 40;
 if(key==='enter'||key==='select'||key==='ok'||key==='numpadenter')return 13;
 if(key==='escape'||key==='esc')return 27;
 if(key==='back'||key==='backspace')return 461;
 if(k===412||key==='mediarewind')return 412;
 if(k===417||key==='mediafastforward')return 417;
 if(k===10252||key==='mediaplaypause')return 10252;
 if(k===427||key==='channelup')return 427;
 if(k===428||key==='channeldown')return 428;
 return k;
}
function stopRemoteEvent(e){try{e.preventDefault()}catch(x){}try{e.stopPropagation()}catch(x){}}
function handleRemote(e){
 if(e&&e.__nm7RemoteHandled)return false;
 if(e&&e.repeat)return true;
 var k=remoteCode(e),handled=false;
 if(S.dialog){
   if(k===13||k===461||k===10009||k===27){$('dlg').className='hidden';S.dialog=null;render();handled=true}
 }else if(S.player){
   if(k===461||k===10009||k===27){
     if(S.ctrl){S.ctrl=false;$('ctrl').className='hidden';focusElement()}else{stop();render()}
     handled=true
   }else if(S.ctrl){
     if(k===37){S.cp=Math.max(0,S.cp-1);focusCtrl();handled=true}
     else if(k===39){S.cp=Math.min(4,S.cp+1);focusCtrl();handled=true}
     else if(k===13){ctrlAction();handled=true}
     else if(k===38||k===40){S.cp=k===38?Math.max(0,S.cp-1):Math.min(4,S.cp+1);focusCtrl();handled=true}
   }else{
     if(k===13||k===10252){showCtrl();handled=true}
     else if(k===37||k===412){seek(-10);handled=true}
     else if(k===39||k===417){seek(30);handled=true}
     else if(k===38||k===427){switchChannelRelative(-1);handled=true}
     else if(k===40||k===428){switchChannelRelative(1);handled=true}
   }
 }else if(S.mode==='menu'){
   if(k===461||k===10009||k===27){closeMenu();handled=true}
   else if(k===38||k===40){var mi=menuItems();S.menu=Math.max(0,Math.min(mi.length-1,S.menu+(k===38?-1:1)));drawMenu();handled=true}
   else if(k===13||k===39){selectMenu();handled=true}
 }else{
   if(k===461||k===10009||k===27){openMenu();handled=true}
   else{
     var rows=channelsInGroup(S.groups[S.row]||'');
     if(k===37){if(S.col===0)openMenu();else{S.col--;render()};handled=true}
     else if(k===39){if(rows.length){S.col=(S.col+1)%rows.length;render()};handled=true}
     else if(k===38){var old=S.col;S.row=Math.max(0,S.row-1);S.col=nearestColumn(old,S.groups[S.row]||'');render();handled=true}
     else if(k===40){var old2=S.col;S.row=Math.min(S.groups.length-1,S.row+1);S.col=nearestColumn(old2,S.groups[S.row]||'');render();handled=true}
     else if(k===13){play(currentChannel());handled=true}
     else if(k===8||k===403){var c=currentChannel();if(c){var fi=S.fav.indexOf(c.id);if(fi<0)S.fav.push(c.id);else S.fav.splice(fi,1);saveUser();render();toast(fi<0?'Đã thêm yêu thích':'Đã bỏ yêu thích')};handled=true}
   }
 }
 if(handled){if(e)e.__nm7RemoteHandled=true;stopRemoteEvent(e);return false}
 return true;
}
window.NM7_REMOTE=handleRemote;
window.addEventListener('keydown',handleRemote,true);
document.addEventListener('keydown',handleRemote,false);
document.addEventListener('focusin',function(e){var t=e&&e.target;if(!t||!t.classList||!t.classList.contains('card'))return;var rr=Number(t.getAttribute('data-row')||0),cc=Number(t.getAttribute('data-col')||0);if(isFinite(rr)&&isFinite(cc)){S.row=rr;S.col=cc;document.querySelectorAll('.card.focus').forEach(function(x){if(x!==t)x.classList.remove('focus')});t.classList.add('focus')}},true);
window.addEventListener('focus',function(){if(S.mode==='home'&&!S.player&&!S.dialog)setTimeout(focusElement,0)},true);

restoreUser();try{document.body.focus()}catch(e){}var cached=readListCache();if(cached){S.list=cached.channels||[];rebuildGroups();setLabel();render()}
fetchSource(0);
setInterval(function(){$('clock').textContent=new Date().toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'})},1000);
$('clock').textContent=new Date().toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'});
})();
