<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#05070a">
<title>NM7 TV Web</title>
<style>
:root{--navy:#07111F;--surface:#0E1C2E;--surface2:#14263C;--text:#F5F8FC;--muted:#9FB3C8;--accent:#37D6A6;--focus:#A8E8FA}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--navy);color:var(--text);font-family:Arial,Helvetica,sans-serif}
body{user-select:none}
button,input{font:inherit}
#app{position:relative;width:100%;height:100%;background:var(--navy) url("https://raw.githubusercontent.com/phuongnm7/nm7-tv-android/f79fc06009f20e0ac3a5859c0abcfd6ce70a6763/app/src/main/res/drawable/nm7_default_background_new.webp") center/cover no-repeat}
#app:after{content:"";position:absolute;inset:0;z-index:0;background:linear-gradient(90deg,rgba(7,17,31,.90),rgba(7,17,31,.56) 45%,rgba(7,17,31,.78));pointer-events:none}
#top{position:absolute;z-index:20;left:0;right:0;top:0;height:72px;padding:7px 22px;display:flex;align-items:center;gap:12px;background:linear-gradient(180deg,rgba(7,17,31,.96),rgba(7,17,31,.60),transparent)}
#brand{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:800;min-width:150px}
#brand img{width:42px;height:42px;object-fit:contain}
#src{font-size:15px;font-weight:700;color:var(--muted);padding:9px 13px;border-radius:16px}
#clock{margin-left:auto;color:var(--text);font-size:17px}
#home{position:absolute;z-index:1;inset:0;padding:72px 22px 18px;overflow:hidden}
.row{margin:0 0 4px}.row h2{margin:0;height:31px;padding:7px 2px 5px;font-size:17px;line-height:19px}.cards{display:flex;gap:4px;overflow:hidden;height:92px}
.card{position:relative;flex:0 0 128px;width:128px;height:86px;border:0;border-radius:13px;background:transparent;padding:0;outline:none;display:flex;flex-direction:column;align-items:center}
.card.focus{z-index:4;transform:scale(1.10);transform-origin:center center}
.thumb{position:relative;width:60px;height:60px;margin-top:3px;border-radius:50%;background:rgba(14,28,46,.82);display:flex;align-items:center;justify-content:center;overflow:visible}
.thumb:before{content:"";position:absolute;inset:-3px;border-radius:50%;border:2px solid transparent}
.card.focus .thumb{background:rgba(20,38,60,.98)}
.card.focus .thumb:before{border-color:#fff;box-shadow:0 0 0 5px rgba(47,155,255,.34)}
.thumb img{position:relative;z-index:2;max-width:48px;max-height:48px;width:auto;height:auto;border-radius:50%;object-fit:contain}
.thumb span{position:relative;z-index:2;color:var(--accent);font-weight:800;font-size:16px}
.name{text-align:center;width:100%;font-size:11px;line-height:17px;height:18px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.card.focus .name{font-weight:700}
.star{position:absolute;top:2px;right:25px;font-size:12px;color:#FFD86B}
.empty{padding:90px 20px;font-size:22px;color:var(--muted);text-align:center}
.hidden{display:none!important}
#player{position:absolute;z-index:60;inset:0;background:#000}
#video{width:100%;height:100%;background:#000;object-fit:contain}
#status{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:#c2cad3;font-size:24px;padding:60px;pointer-events:none;white-space:pre-wrap}
#ctrl{position:absolute;z-index:5;left:50%;bottom:34px;transform:translateX(-50%);background:rgba(16,20,24,.92);padding:10px;border-radius:13px;display:flex;gap:8px}
.cb{border:0;border-radius:9px;background:#303742;color:#fff;padding:11px 16px;font-size:17px;outline:none}
.cb.focus,.cb:focus{outline:3px solid #fff;background:#fff;color:#000}
#menu{position:absolute;z-index:80;left:0;top:0;bottom:0;width:320px;background:rgba(7,17,31,.97);padding:10px;border-top-right-radius:22px;border-bottom-right-radius:22px;border:1px solid rgba(168,232,250,.20);box-shadow:20px 0 60px #0008}
#menu h2{font-size:18px;margin:8px 10px 14px}
.mi{height:48px;padding:0 14px;margin:3px 0;border-radius:16px;font-size:15px;display:flex;align-items:center;color:var(--text)}
.mi.focus{background:#D9298BA8;border:2px solid var(--focus)}
.hint{position:absolute;left:18px;right:18px;bottom:12px;color:var(--muted);font-size:12px}
#dlg{position:absolute;z-index:90;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center}
#box{width:760px;max-width:88vw;background:#171C23;border-radius:14px;padding:26px}
#box h2{margin:0 0 16px;font-size:27px}.input{width:100%;background:#07090D;color:#fff;border:2px solid #4e5662;border-radius:8px;padding:12px;font-size:20px}.guide{color:#b2b8c1;line-height:1.5}
#toast{position:absolute;z-index:120;left:50%;bottom:24px;transform:translateX(-50%);background:rgba(18,24,33,.95);border-radius:9px;padding:11px 18px;font-size:17px;opacity:0;pointer-events:none}.show{opacity:1!important}
</style>
<script src="/web-tv/dash.all.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@0.14.17/dist/hls.min.js"></script>
</head>
<body>
<div id="app">
<header id="top"><div id="brand"><img src="https://raw.githubusercontent.com/phuongnm7/nm7-tv-android/f79fc06009f20e0ac3a5859c0abcfd6ce70a6763/app/src/main/res/drawable/nm7_main_logo.png" alt=""><span>NM7 TV</span></div><div id="src">Truyền hình</div><div id="clock"></div></header>
<main id="home"><div class="empty">Đang tải danh sách kênh…</div></main>
<section id="player" class="hidden">
<video id="video" playsinline preload="metadata"></video>
<div id="status">Đang chờ phát…</div>
<div id="ctrl" class="hidden">
<button class="cb" data-a="back">◀ Thoát</button><button class="cb" data-a="back10">↶ -10s</button><button class="cb" data-a="play">▶/Ⅱ</button><button class="cb" data-a="fwd30">+30s ↷</button><button class="cb" data-a="next">CH +</button>
</div></section>
<aside id="menu" class="hidden"><h2>MENU TÙY CHỌN</h2><div id="ml"></div><p class="hint">◀ mở/đóng · ▲▼ chọn · OK xác nhận</p></aside>
<div id="dlg" class="hidden"><div id="box"></div></div><div id="toast"></div>
</div>
<script>
(function(){
var SRC=[{id:'tv',name:'Truyền hình',url:'/api/playlist?source=tv'},{id:'sport',name:'Thể thao',url:'/api/playlist?source=sport'}];
var S={source:0,list:[],groups:[],row:0,col:0,view:null,q:'',fav:[],recent:[],menu:0,mode:'home',player:false,ctrl:false,cp:2,dialog:null,current:null,candidateIndex:0,hls:null,dash:null};
function $(id){return document.getElementById(id)}
var toastTimer;
function esc(s){return String(s||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function toast(s){$('toast').textContent=s;$('toast').className='show';clearTimeout(toastTimer);toastTimer=setTimeout(function(){$('toast').className=''},2400)}
function save(){try{localStorage.setItem('nm7:fav',JSON.stringify(S.fav));localStorage.setItem('nm7:recent',JSON.stringify(S.recent.slice(0,50)));localStorage.setItem('nm7:list:'+S.source,JSON.stringify(S.list))}catch(e){}}
function restore(){try{S.fav=JSON.parse(localStorage.getItem('nm7:fav')||'[]');S.recent=JSON.parse(localStorage.getItem('nm7:recent')||'[]');var c=JSON.parse(localStorage.getItem('nm7:list:'+S.source)||'[]');if(c&&c.length)S.list=c}catch(e){}}
function normalize(c){if(!c.candidates)c.candidates=c.url?[{url:c.url}]:[];return c}
function rebuildGroups(){var seen={},i;S.groups=[];for(i=0;i<S.list.length;i++){var g=S.list[i].group||'Khác';if(!seen[g]){seen[g]=1;S.groups.push(g)}}S.row=0;S.col=0}
function srcList(){var a=S.view||S.list;if(S.q){var q=S.q.toLowerCase(),b=[],i,c;for(i=0;i<a.length;i++){c=a[i];if((c.name+' '+c.group+' '+c.id).toLowerCase().indexOf(q)>=0)b.push(c)}return b}return a}
function row(g){var a=srcList(),b=[],i;for(i=0;i<a.length;i++)if(a[i].group===g)b.push(a[i]);return b}
function cur(){var a=row(S.groups[S.row]||'');return a[S.col]||a[0]}
function activateLogos(){var imgs=document.querySelectorAll('img[data-src]'),i,im,ri;for(i=0;i<imgs.length;i++){im=imgs[i];ri=parseInt(im.getAttribute('data-row')||'0',10);if(Math.abs(ri-S.row)<=2&&im.getAttribute('data-src')){im.setAttribute('src',im.getAttribute('data-src'));im.removeAttribute('data-src')}}}
function render(){var h=$('home'),html='',start=Math.max(0,S.row-2),end=Math.min(S.groups.length,S.row+5),r,g,a,i,c,focus;for(r=start;r<end;r++){g=S.groups[r];a=row(g);if(!a.length)continue;html+='<section class="row"><h2>'+esc(g)+'</h2><div class="cards">';for(i=0;i<a.length;i++){c=normalize(a[i]);focus=(r===S.row&&i===S.col);html+='<div class="card '+(focus?'focus':'')+'"><div class="thumb">';if(c.logo){html+='<img data-row="'+r+'" data-src="'+esc(c.logo)+'" onerror="this.style.display=\'none\';this.parentNode.innerHTML=\'<span>TV</span>\'">'}else html+='<span>TV</span>';html+='</div><div class="name">'+esc(c.name)+'</div>'+(S.fav.indexOf(c.id)>=0?'<span class="star">★</span>':'')+'</div>'}html+='</div></section>'}h.innerHTML=html||'<div class="empty">Không có kênh phù hợp</div>';activateLogos()}
function bindCardClicks(){
 $('home').onclick=function(e){
   var n=e.target;
   while(n&&n!==$('home')&&!(' '+String(n.className||'')+' ').match(/ card /))n=n.parentNode;
   if(!n||n===$('home'))return;
   var cards=document.querySelectorAll('.card'),idx,i,el,gi,ci,a;
   for(i=0;i<cards.length;i++)if(cards[i]===n){idx=i;break}
   if(idx==null)return;
   gi=parseInt(n.getAttribute('data-gi')||'0',10);
   ci=parseInt(n.getAttribute('data-ci')||'0',10);
   S.groupIndex=gi;S.colIndex=ci;
   a=groupChannels();
   if(a[ci])play(a[ci]);
 };
}
function setSourceLabel(){var n=S.source===1?'Thể thao':'Truyền hình';$('src').textContent=n+(S.list.length?' · '+S.list.length+' kênh':'')}
function parseLegacy(t){var lines=String(t).replace(/^\uFEFF/,'').split(/\r?\n/),out=[],m=null,ua='',ref='',i,l,p,h,c;for(i=0;i<lines.length;i++){l=lines[i].trim();if(l.indexOf('#EXTINF:')===0){if(m&&m.candidates.length)out.push(m);p=l.indexOf(',');h=p<0?l:l.slice(0,p);m={name:p<0?'Kênh':l.slice(p+1).trim(),group:(/group-title="([^"]*)"/i.exec(h)||[])[1]||'Khác',logo:(/tvg-logo="([^"]*)"/i.exec(h)||[])[1]||'',id:(/tvg-id="([^"]*)"/i.exec(h)||[])[1]||'',candidates:[]};ua='';ref=''}else if(m&&l.indexOf('#EXTVLCOPT:')===0){var um=/http-user-agent=(?:"([^"]+)"|([^\s]+))/i.exec(l);var rm=/(?:http-referrer|http-referer)=(?:"([^"]+)"|([^\s]+))/i.exec(l);if(um)ua=um[1]||um[2];if(rm)ref=rm[1]||rm[2]}else if(m&&l.charAt(0)!=='#'&&/^(https?|rtsp|rtmp|udp):/i.test(l)){var parts=l.split('|'),url=parts[0],r2=ref,u2=ua,j;for(j=1;j<parts.length;j++){if(/^referer=/i.test(parts[j]))r2=parts[j].slice(parts[j].indexOf('=')+1);else if(/^http-user-agent=/i.test(parts[j]))u2=parts[j].slice(parts[j].indexOf('=')+1)}m.candidates.push({url:url,ref:r2,ua:u2})}}if(m&&m.candidates.length)out.push(m);for(i=0;i<out.length;i++){c=out[i];c.id=c.id||c.name}return out}
function fetchSource(n){S.source=n;var cache=[];try{cache=JSON.parse(localStorage.getItem('nm7:list:'+n)||'[]')}catch(e){}if(cache.length){S.list=cache;S.view=null;S.q='';rebuildGroups();setSourceLabel();render();toast('Đã mở cache · đang cập nhật…')}else{S.list=[];$('home').innerHTML='<div class="empty">Đang tải danh sách '+(n?'thể thao':'truyền hình')+'…</div>'}
fetch(SRC[n].url,{cache:'default'}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(data){S.list=data.channels||[];S.view=null;S.q='';for(var i=0;i<S.list.length;i++)normalize(S.list[i]);save();rebuildGroups();setSourceLabel();render();toast('Đã cập nhật '+S.list.length+' kênh')}).catch(function(){if(!S.list.length)toast('Không tải được playlist')})}
function menuItems(){return ['▣ Truyền hình','⚽ Thể thao','★ Yêu thích','◷ Gần đây','⌕ Tìm kiếm','↻ Tải lại playlist'].concat(S.groups)}
function drawMenu(){var a=menuItems(),h='',i;for(i=0;i<a.length;i++)h+='<div class="mi '+(i===S.menu?'focus':'')+'">'+esc(a[i])+'</div>';$('ml').innerHTML=h}
function openMenu(){S.mode='menu';S.menu=Math.min(S.menu,menuItems().length-1);$('menu').className='';drawMenu()}
function closeMenu(){S.mode=S.player?'player':'home';$('menu').className='hidden';render()}
function selectMenu(){var p=S.menu,a,ids,kind,i;if(p===0||p===1){closeMenu();fetchSource(p)}else if(p===2||p===3){ids=p===2?S.fav:S.recent;a=[];for(i=0;i<S.list.length;i++)if(ids.indexOf(S.list[i].id)>=0)a.push(S.list[i]);if(!a.length)return toast(p===2?'Yêu thích trống':'Gần đây trống');S.view=a;S.groups=[];var seen={};for(i=0;i<a.length;i++){kind=a[i].group||'Khác';if(!seen[kind]){seen[kind]=1;S.groups.push(kind)}}S.row=0;S.col=0;closeMenu()}else if(p===4){showSearch()}else if(p===5){closeMenu();fetchSource(S.source)}else{var g=S.groups[p-6];if(g){S.view=null;S.row=S.groups.indexOf(g);S.col=0;closeMenu()}}}
function showSearch(){S.dialog='search';$('dlg').className='';$('box').innerHTML='<h2>Tìm kiếm kênh</h2><input id="qin" class="input" value="'+esc(S.q)+'" placeholder="Nhập tên kênh hoặc nhóm…"><p class="guide">Enter/Back đóng tìm kiếm.</p>';var i=$('qin');i.focus();i.oninput=function(){S.q=i.value.trim();S.row=0;S.col=0;render()}}
function clearPlayers(){
 if(S.hls){try{S.hls.destroy()}catch(e){}S.hls=null}
 if(S.dash){try{S.dash.reset()}catch(e){}S.dash=null}
}
function candidateUrl(c){
 if(!c||!c.candidates||!c.candidates.length)return '';
 var cand=c.candidates[S.candidateIndex]||{};
 return cand.proxy||cand.url||''
}
function likelyHls(u){return /\\.m3u8(?:$|[?#])/i.test(u)||/playlist|index\\.m3u|chunklist|manifest\\.m3u/i.test(u)}
function likelyDash(u){return /\\.mpd(?:$|[?#])/i.test(u)||/manifest\\.mpd|dash/i.test(u)}
function decodeHexB64(s){
 var v=String(s||'').replace(/^0x/i,'').replace(/-/g,''),out='',i;
 if(!/^[0-9a-fA-F]+$/.test(v)||v.length%2)return s;
 for(i=0;i<v.length;i+=2)out+=String.fromCharCode(parseInt(v.substr(i,2),16));
 try{return btoa(out).replace(/\\+/g,'-').replace(/\\//g,'_').replace(/=+$/,'')}catch(e){return s}
}
function clearKeyData(c){
 var opts=[],base=[],i,m,parts,map={},j;
 if(c&&c.candidates&&c.candidates[S.candidateIndex]&&c.candidates[S.candidateIndex].options)opts=opts.concat(c.candidates[S.candidateIndex].options);
 if(c&&c.options)opts=opts.concat(c.options);
 var key='';
 for(i=0;i<opts.length;i++){
   if(/license_key/i.test(opts[i])){m=opts[i].indexOf('=');if(m>=0)key=opts[i].slice(m+1)}
 }
 if(c&&c.drm&&c.drm.key)key=c.drm.key;
 if(!key||/^https?:/i.test(key))return null;
 parts=String(key).split(/[;,]/);
 for(j=0;j<parts.length;j++){
   m=parts[j].indexOf(':');
   if(m<0)continue;
   var kid=decodeHexB64(parts[j].slice(0,m)),ck=decodeHexB64(parts[j].slice(m+1));
   if(kid&&ck)map[kid]=ck;
 }
 for(i in map)base.push(i);
 if(!base.length)return null;
 return {'org.w3.clearkey':{clearkeys:map}}
}
function drmProtection(c){
 return clearKeyData(c)
}
function tryCandidate(c){
 if(!c||!c.candidates||!c.candidates.length){showStatus('Kênh không có URL phát');return}
 if(S.candidateIndex>=c.candidates.length){showStatus('Không phát được '+c.name+'\\nĐã thử '+c.candidates.length+' nguồn');return}
 clearPlayers();
 var v=$('video'),cand=c.candidates[S.candidateIndex],u=cand.proxy||cand.url||'',show='Đang mở '+c.name+'\\nNguồn '+(S.candidateIndex+1)+'/'+c.candidates.length;
 showStatus(show);
 v.pause();v.removeAttribute('src');v.load();
 var kind=String(cand.type||'').toLowerCase();
 if(!kind)kind=likelyDash(u)?'dash':(likelyHls(u)?'hls':'http');
 if(kind==='dash'&&window.dashjs){
   try{
     S.dash=dashjs.MediaPlayer().create();
     var prot=drmProtection(c);
     if(prot&&S.dash.setProtectionData)S.dash.setProtectionData(prot);
     S.dash.initialize(v,u,true);
     try{var p=v.play();if(p&&p.catch)p.catch(function(){})}catch(e){}
     return
   }catch(e){setTimeout(function(){nextCandidate('DASH lỗi')},150);return}
 }
 if(kind==='hls'&&window.Hls&&Hls.isSupported()){
   S.hls=new Hls({enableWorker:false,lowLatencyMode:false,maxBufferLength:30,maxMaxBufferLength:45});
   S.hls.on(Hls.Events.ERROR,function(event,data){if(data&&data.fatal)setTimeout(function(){nextCandidate('HLS lỗi')},150)});
   S.hls.attachMedia(v);
   try{var p0=v.play();if(p0&&p0.catch)p0.catch(function(){})}catch(e){}
   S.hls.on(Hls.Events.MANIFEST_PARSED,function(){try{var p1=v.play();if(p1&&p1.catch)p1.catch(function(){})}catch(e){}});
   S.hls.loadSource(u);
   return
 }
 v.autoplay=true;
 v.src=u;
 try{var p2=v.play();if(p2&&p2.catch)p2.catch(function(){})}catch(e){}
}
function nextCandidate(reason){if(!S.player||!S.current)return;S.candidateIndex++;toast((reason||'Nguồn lỗi')+' · thử nguồn dự phòng');tryCandidate(S.current)}
function showStatus(s){$('status').textContent=s;$('status').style.display='flex'}
function play(c){if(!c)return;S.current=c;S.candidateIndex=0;S.player=true;S.ctrl=false;$('player').className='';$('ctrl').className='hidden';$('status').style.display='none';S.recent=[c.id].concat(S.recent.filter(function(x){return x!==c.id})).slice(0,50);save();tryCandidate(c)}
function stop(){clearPlayers();var v=$('video');v.pause();v.autoplay=false;v.removeAttribute('src');v.load();S.current=null;S.player=false;S.ctrl=false;$('player').className='hidden';$('ctrl').className='hidden'}
function seek(sec){var v=$('video');if(!isFinite(v.duration)){toast('Luồng này không hỗ trợ tua');return}v.currentTime=Math.max(0,Math.min(v.duration,v.currentTime+sec))}
function showCtrl(){S.ctrl=!S.ctrl;$('ctrl').className=S.ctrl?'':'hidden';if(S.ctrl)focusCtrl()}
function focusCtrl(){var b=document.querySelectorAll('.cb'),i;for(i=0;i<b.length;i++)b[i].className='cb '+(i===S.cp?'focus':'')}
function ctrlAction(){var b=document.querySelectorAll('.cb'),a=b[S.cp]?b[S.cp].getAttribute('data-a'):'';if(a==='back'){stop();render()}else if(a==='back10')seek(-10);else if(a==='fwd30')seek(30);else if(a==='play'){var v=$('video');v.paused?v.play():v.pause()}else if(a==='next'){switchRelative(1)}}
function switchRelative(d){var c=S.current||cur(),i=S.list.indexOf(c);if(i<0)i=0;play(S.list[(i+d+S.list.length)%S.list.length])}
$('video').addEventListener('playing',function(){$('status').style.display='none'});$('video').addEventListener('error',function(){nextCandidate('Trình phát không nhận nguồn')});$('video').addEventListener('ended',function(){if(S.player)nextCandidate('Luồng kết thúc')});
document.addEventListener('keydown',function(e){var k=e.keyCode||({ArrowLeft:37,ArrowRight:39,ArrowUp:38,ArrowDown:40,Enter:13,Escape:27,Backspace:8}[e.key]||0);
