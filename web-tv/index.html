<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111F">
<meta name="application-name" content="NM7 TV 1.0.69">
<link rel="manifest" href="/manifest.webmanifest">
<title>NM7 TV 1.0.69</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111f;color:#fff;font-family:Arial,Helvetica,sans-serif}
body{user-select:none;-webkit-user-select:none}
button,input{font:inherit}
button{cursor:pointer}
#app{position:relative;width:100%;height:100%;background:#07111f url("/assets/nm7-default-background.webp") center/cover no-repeat fixed}
#home{position:absolute;inset:0;padding:0 18px 28px 22px;overflow-y:auto;overflow-x:hidden;background:linear-gradient(180deg,rgba(5,12,20,.04),rgba(5,12,20,.17));scrollbar-width:none}
#home::-webkit-scrollbar,.cards::-webkit-scrollbar,.quickCards::-webkit-scrollbar{display:none}
.row{margin:0}
.row h2{margin:0;height:34px;padding:8px 2px 5px;font-size:18px;line-height:21px;font-weight:700;text-shadow:0 2px 4px #000a}
.cards{display:flex;gap:4px;height:80px;min-width:max-content;overflow-x:auto;overflow-y:hidden;padding:0 18px 4px 0;scroll-behavior:auto;scrollbar-width:none;overscroll-behavior:none}
.card{position:relative;appearance:none;-webkit-appearance:none;flex:0 0 138px;width:138px;height:76px;border:1px solid #334f6a83;border-radius:22px;background:linear-gradient(90deg,#c72a3749,#d9182434);padding:6px 10px 2px;outline:none;display:flex;flex-direction:column;align-items:stretch;justify-content:stretch;transition:transform .12s ease,background .12s ease,border-color .12s ease;z-index:1;color:#fff;text-align:center;overflow:hidden}
.card:focus{border:5px solid #37d6a6;background:linear-gradient(90deg,#e837d6a6,#d82aae8a);transform:scale(1.08);z-index:5;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.card:focus .thumb{border-radius:10px}
.thumb{height:0;flex:1 1 auto;min-height:0;border-radius:12px;background:transparent;display:flex;align-items:center;justify-content:center;overflow:hidden}
.thumb img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;display:block}
.thumb span{color:#37d6a6;font-size:18px;font-weight:700}
.name{text-align:center;font-size:11px;line-height:18px;height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:0;color:#f5f8fc}
.star{position:absolute;top:7px;right:10px;font-size:17px}
.empty{padding:80px 5px;font-size:28px;color:#abb2bc}
.hidden{display:none!important}
#player{position:absolute;z-index:60;inset:0;background:#000}
#video{width:100%;height:100%;background:#000;object-fit:contain}
#status{position:absolute;z-index:3;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:#c5cad1;font-size:26px;padding:70px;pointer-events:none;white-space:pre-wrap;text-shadow:0 2px 8px #000}
#playerTop{position:absolute;left:0;right:0;top:0;z-index:4;padding:22px 32px;background:linear-gradient(#000d,transparent);pointer-events:none}
#playerTitle{font-size:25px;font-weight:700}
#playerMeta{font-size:15px;color:#9ea8b5;margin-top:5px;word-break:break-all}
#ctrl{position:absolute;z-index:5;left:50%;bottom:44px;transform:translateX(-50%);background:#10141aed;padding:12px 14px;border-radius:12px;display:flex;gap:9px;white-space:nowrap}
.cb{border:0;border-radius:8px;background:#303742;color:#fff;padding:11px 17px;font-size:18px;outline:none}
.cb:focus{outline:3px solid #fff;background:#fff;color:#000}
#side{position:absolute;z-index:80;left:0;top:0;bottom:0;width:310px;background:#090c10fa;padding:18px 14px 26px;box-shadow:20px 0 60px #000}
#sideHeader{height:64px;display:flex;align-items:center;margin-bottom:8px}
#sideHeader img{width:54px;height:54px;object-fit:contain;flex:none}
#sideHeader span{font-size:19px;font-weight:700;margin-left:10px}
#sideList{height:calc(100% - 106px);overflow-y:auto;scrollbar-width:none}
#sideList::-webkit-scrollbar{display:none}
.menuBtn{width:100%;height:48px;padding:10px 16px;margin:4px 0;border:0;border-radius:9px;background:transparent;color:#fff;text-align:left;font-size:18px;cursor:pointer;outline:none}
.menuBtn:focus{background:#fff;color:#000}
#sideHint{position:absolute;left:24px;bottom:18px;color:#949eab;font-size:14px}
#dlg{position:absolute;z-index:100;inset:0;background:#000b;display:flex;align-items:center;justify-content:center}
#box{width:860px;max-width:90vw;max-height:80vh;overflow:auto;background:#171c23;border-radius:14px;padding:26px;box-shadow:0 25px 80px #000}
#box h2{margin:0 0 17px;font-size:28px}
.input{width:100%;background:#07090d;color:#fff;border:2px solid #4e5662;border-radius:8px;padding:12px;font-size:21px;outline:none}
.input:focus{border-color:#fff}
.guide{color:#acb5c0;line-height:1.5;font-size:17px}
.dialogActions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.db{border:0;border-radius:8px;background:#303741;color:#fff;padding:11px 17px;font-size:18px;outline:none}
.db:focus{outline:3px solid #fff;background:#fff;color:#000}
#toast{position:absolute;z-index:120;left:50%;bottom:38px;transform:translateX(-50%);background:#121821f2;border-radius:9px;padding:11px 19px;font-size:18px;opacity:0;pointer-events:none;max-width:90vw;text-align:center;transition:opacity .15s}
#toast.show{opacity:1}
#quick{position:absolute;z-index:70;left:0;right:0;bottom:0;background:linear-gradient(transparent,#040608 28%);padding:72px 22px 28px}
#quickTitle{font-size:18px;font-weight:700;margin-bottom:7px;text-shadow:0 2px 5px #000}
.quickCards{display:flex;gap:6px;overflow-x:auto;min-height:84px;padding:2px 8px 3px 2px;scrollbar-width:none}
.quickCard{flex:0 0 142px;height:78px;border-radius:20px;border:2px solid transparent;background:#131a22d9;color:#fff;outline:none;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;font-size:13px}
.quickCard:focus{border-color:#37d6a6;background:#263238;transform:scale(1.05)}
#debug{position:absolute;z-index:130;left:8px;top:8px;max-width:60vw;color:#ffedb3;background:#18140be8;border:1px solid #6b5c32;border-radius:6px;padding:6px 9px;font:12px/1.35 monospace;white-space:pre-wrap;display:none;pointer-events:none}
@media (max-height:650px){
  #home{padding-bottom:14px}
  #box{padding:20px}
  #playerTop{padding:15px 24px}
  #playerTitle{font-size:21px}
  #status{font-size:22px}
}
</style>
<script src="./dash.all.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.7.3/dist/hls.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flv.js@1.6.2/dist/flv.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.8.2/dist/mpegts.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/shaka-player@4.16.51/dist/shaka-player.compiled.js"></script>
</head>
<body id="nm7-body" tabindex="-1">
<div id="app">
  <main id="home"><div class="empty">Đang tải danh sách kênh…</div></main>
  <section id="player" class="hidden">
    <div id="playerTop"><div id="playerTitle"></div><div id="playerMeta"></div></div>
    <video id="video" playsinline preload="auto"></video>
    <div id="status">Đang chờ phát…</div>
    <div id="ctrl" class="hidden">
      <button class="cb" data-a="back">◀ Thoát</button>
      <button class="cb" data-a="back10">↶ -10s</button>
      <button class="cb" data-a="play">▶/Ⅱ</button>
      <button class="cb" data-a="fwd30">+30s ↷</button>
      <button class="cb" data-a="next">CH +</button>
    </div>
    <div id="quick" class="hidden"><div id="quickTitle"></div><div id="quickCards" class="quickCards"></div></div>
  </section>
  <aside id="side" class="hidden">
    <div id="sideHeader"><img src="/assets/nm7-main-logo.png" alt="NM7 TV"><span>NM7 TV</span></div>
    <div id="sideList"></div>
    <div id="sideHint">←/Back đóng · ↑↓ chọn · →/OK xác nhận</div>
  </aside>
  <div id="dlg" class="hidden"><div id="box"></div></div>
  <div id="toast"></div>
  <div id="debug"></div>
</div>
<script src="./app.js"></script>
</body>
</html>
